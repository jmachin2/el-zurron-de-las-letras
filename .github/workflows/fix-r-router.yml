name: Fix R public router
on:
  push:
    paths:
      - '.github/workflows/fix-r-router.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch master router with R routes
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text(encoding='utf-8')

          if '"/r/":{"title":"Letra R · El Zurrón de las Letras"' not in src:
              anchor='"/p/trazo/":{"title":"Trazo de la P · La contraseña del Zurrón","src":"/p/trazo/index.html","direct":true}};'
              repl='"/p/trazo/":{"title":"Trazo de la P · La contraseña del Zurrón","src":"/p/trazo/index.html","direct":true},"/r/":{"title":"Letra R · El Zurrón de las Letras","src":"/app-content/r/index.html","direct":true},"/r/juego-r-rr/":{"title":"El taller de las erres · R o RR","src":"/app-content/r/juego-r-rr/index.html","direct":true}};'
              if anchor not in src: raise SystemExit('No se encontró ancla ROUTES del router maestro')
              src=src.replace(anchor,repl,1)

          # Patch both route suffix list and initial candidates if needed.
          old='"/l/trazo/","/a/","/e/","/i/","/o/","/u/","/d/","/m/","/s/","/l/"]'
          new='"/l/trazo/","/r/juego-r-rr/","/a/","/e/","/i/","/o/","/u/","/d/","/m/","/s/","/l/","/r/"]'
          count=src.count(old)
          if count < 2: raise SystemExit(f'No se encontraron las dos listas base del router: {count}')
          src=src.replace(old,new,2)

          # Write one synchronized router to root, 404, and R public entrypoints.
          Path('index.html').write_text(src,encoding='utf-8')
          Path('404.html').write_text(src,encoding='utf-8')
          Path('r').mkdir(exist_ok=True)
          Path('r/juego-r-rr').mkdir(parents=True,exist_ok=True)
          Path('r/index.html').write_text(src,encoding='utf-8')
          Path('r/juego-r-rr/index.html').write_text(src,encoding='utf-8')
          PY
      - name: Verify complete R router integration
        run: |
          grep -q '"/r/":{"title":"Letra R' index.html
          grep -q '"/r/juego-r-rr/"' index.html
          grep -q '"/r/":{"title":"Letra R' r/index.html
          grep -q '"/r/juego-r-rr/"' r/juego-r-rr/index.html
          test -f app-content/r/index.html
          test -f app-content/r/juego-r-rr/index.html
      - name: Commit synchronized routers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html r/index.html r/juego-r-rr/index.html
          git diff --cached --quiet || git commit -m "Sincronizar router maestro con letra R"
          git pull --rebase origin main
          git push origin HEAD:main
