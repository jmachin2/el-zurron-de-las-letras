name: Fix R public router
on:
  push:
    paths:
      - '.github/workflows/fix-r-router.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore generic router on public R routes
        run: |
          mkdir -p r/juego-r-rr
          cp d/index.html r/index.html
          cp d/index.html r/juego-r-rr/index.html
      - name: Commit router files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add r/index.html r/juego-r-rr/index.html
          git diff --cached --quiet || git commit -m "Integrar R en el router común del Zurrón"
          git pull --rebase origin main
          git push origin HEAD:main
