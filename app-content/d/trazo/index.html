<script id="zurron-local-nav">
(() => {
  const ROUTES = new Set(["/","/a/","/a/trazo/","/e/","/e/trazo/","/i/","/i/trazo/","/o/","/o/trazo/","/u/","/u/trazo/","/m/","/m/centro/","/m/mision/","/s/","/s/centro/","/s/mision/","/s/cuento/","/l/","/l/centro/","/l/mision/","/l/trazo/","/d/","/d/centro/","/d/mision/","/d/cuento/","/d/trazo/"]);
  function norm(href){
    if(!href || !String(href).startsWith('/')) return null;
    let p=String(href).split('?')[0].split('#')[0];
    if(p!=='/' && !p.endsWith('/')) p+='/';
    return ROUTES.has(p)?p:null;
  }
  document.addEventListener('click',(ev)=>{
    const a=ev.target.closest('a[href]'); if(!a) return;
    const p=norm(a.getAttribute('href')); if(!p) return;
    ev.preventDefault(); ev.stopImmediatePropagation();
    if(window.parent && window.parent!==window) window.parent.postMessage({type:'zurron:navigate',path:p},'*');
    else location.href=p;
  },true);
})();
</script>
