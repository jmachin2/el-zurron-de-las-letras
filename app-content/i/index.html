<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Letra I · El Zurrón de las Letras</title>
<style>
:root{--ink:#17324d;--muted:#5c7184;--l:#7467c8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef5f9}
body{overflow:hidden}
a{text-decoration:none;color:inherit}
.page{width:100%;height:100dvh;padding:8px}
.shell{
  position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;
  border-radius:24px;border:1px solid rgba(216,228,237,.9);
  box-shadow:0 14px 34px rgba(30,70,105,.12)
}
.shell::before{
  content:"";position:absolute;inset:-20px;
  background:url('/assets/portada_zurron.jpg') center/cover;
  filter:blur(15px) saturate(1.02);transform:scale(1.07);z-index:-3
}
.shell::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.52));z-index:-2
}
.content{
  width:min(1500px,100%);height:100%;margin:auto;
  padding:12px 20px 84px;
  display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px
}
.back{
  justify-self:start;display:inline-flex;align-items:center;min-height:38px;padding:6px 11px;
  border-radius:13px;border:2px solid rgba(255,255,255,.76);background:rgba(255,255,255,.92);
  font-weight:950
}
.heroTop{display:flex;align-items:center;gap:12px}
.mark{
  width:58px;height:58px;border-radius:18px;display:grid;place-items:center;
  background:var(--l);color:white;font-size:37px;font-weight:950
}
.kicker{font-size:11px;font-weight:950;letter-spacing:.08em;color:#31536d}
h1{margin:2px 0 0;font-size:36px;line-height:1}
.sub{margin:4px 0 0;font-size:14px;font-weight:750;color:#355a75}
.grid{
  width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start
}
.card{
  height:360px;padding:20px;border-radius:24px;border:3px solid rgba(255,255,255,.86);
  background:rgba(255,255,255,.93);backdrop-filter:blur(9px);
  box-shadow:0 13px 28px rgba(30,60,90,.11);display:flex;flex-direction:column;overflow:hidden
}
.card h2{margin:0 0 8px;font-size:27px;line-height:1.08}
.card p{margin:0 0 11px;color:var(--muted);font-size:14px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:4px 8px;border:1px solid rgba(23,50,77,.13);border-radius:999px;background:white;font-size:11px;font-weight:900}
.open{
  margin-top:auto;min-height:52px;border-radius:16px;display:grid;place-items:center;
  background:var(--l);color:white;font-size:15px;font-weight:950;text-align:center
}
@media(max-height:700px) and (min-width:901px){
  .content{padding:6px 14px 76px;gap:5px}.back{min-height:31px;font-size:10px}
  .mark{width:42px;height:42px;font-size:26px}.kicker{font-size:9px}h1{font-size:26px}.sub{font-size:11px}
  .card{height:300px;padding:12px}.card h2{font-size:19px}.card p{font-size:11px}.chip{font-size:9px}.open{min-height:40px;font-size:11px}
}
@media(max-width:760px){
  html,body{height:auto}body{overflow:auto}.page{height:auto;min-height:100dvh;padding:5px}
  .shell{height:auto;min-height:calc(100dvh - 10px)}
  .content{height:auto;min-height:calc(100dvh - 10px);padding:10px 10px 84px;display:flex;flex-direction:column}
  .grid{grid-template-columns:1fr}.card{height:auto;min-height:280px}
}

/* ==========================================================
   ZURRÓN · AJUSTE GLOBAL RESPONSIVE v3
   La altura útil se calcula con JS y corresponde al viewport
   REAL de cada pantalla interna.
   ========================================================== */
:root{
  --zurron-view-h:100dvh;
  --zurron-view-w:100vw;
}
html,body{
  width:100%!important;
  height:100%!important;
  min-width:0!important;
  min-height:0!important;
  max-width:100%!important;
  max-height:100%!important;
}
body{
  overflow:hidden!important;
}

/* Contenedores principales: nunca deben sobrepasar el viewport */
.page,
.app{
  width:100%!important;
  height:var(--zurron-view-h)!important;
  min-width:0!important;
  min-height:0!important;
  max-width:100%!important;
  max-height:var(--zurron-view-h)!important;
}
.shell{
  min-width:0!important;
  min-height:0!important;
  max-width:100%!important;
  max-height:100%!important;
}

/* Cualquier imagen funcional debe entrar COMPLETA en su contenedor */
img{
  max-width:100%!important;
  max-height:100%!important;
}

/* Pictogramas de las misiones */
.picture{
  width:min(40vw,46vh,420px)!important;
  height:min(40vw,46vh,420px)!important;
  max-width:88vw!important;
  max-height:46vh!important;
  object-fit:contain!important;
}
.picture.small{
  width:min(28vw,30vh,285px)!important;
  height:min(28vw,30vh,285px)!important;
  max-width:72vw!important;
  max-height:30vh!important;
  object-fit:contain!important;
}

/* Portada: siempre se ve la ilustración completa */
.hero{
  min-height:0!important;
  overflow:hidden!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
}
.hero img{
  width:100%!important;
  height:100%!important;
  object-fit:contain!important;
  object-position:center center!important;
}

/* Cuento: página completa dentro del área disponible */
.storyImageWrap{
  min-width:0!important;
  min-height:0!important;
  overflow:hidden!important;
}
.storyImage{
  width:100%!important;
  height:100%!important;
  max-width:100%!important;
  max-height:100%!important;
  object-fit:contain!important;
  object-position:center center!important;
}

/* Ilustraciones de las canciones */
.audioIllu{
  width:100%!important;
  height:auto!important;
  min-height:0!important;
  max-width:100%!important;
  max-height:min(42vh,390px)!important;
  object-fit:contain!important;
  object-position:center!important;
}

/* Canvas/ruletas: nunca salen de pantalla */
canvas{
  max-width:100%!important;
  max-height:100%!important;
}

/* SVG y vídeo, por seguridad */
svg,video{
  max-width:100%;
  max-height:100%;
}

/* Evitar que grids/flex fuerzen anchuras superiores al viewport */
.stage,
.storyStage,
.storyLayout,
.audioGrid,
.quizWrap,
.quizCard,
.question-card,
.activity,
.activity-body,
.activity-panel,
.main,
.content,
.cardsWrap,
.grid,
.levels,
.players-layout,
.roulette-stage{
  min-width:0!important;
  min-height:0!important;
}

/* Ordenador/PDI: todo debe caber, sin scroll */
@media (min-width:761px){
  html,body{
    overflow:hidden!important;
  }
  .page,.app{
    overflow:hidden!important;
  }
}

/* Pantallas de poca altura: reducir automáticamente elementos visuales */
@media (max-height:760px) and (min-width:761px){
  .picture{
    width:min(34vw,40vh,340px)!important;
    height:min(34vw,40vh,340px)!important;
    max-height:40vh!important;
  }
  .picture.small{
    width:min(23vw,25vh,230px)!important;
    height:min(23vw,25vh,230px)!important;
    max-height:25vh!important;
  }
  .audioIllu{
    max-height:32vh!important;
  }
}

/* Pantalla especialmente baja */
@media (max-height:620px) and (min-width:761px){
  .picture{
    width:min(29vw,34vh,290px)!important;
    height:min(29vw,34vh,290px)!important;
    max-height:34vh!important;
  }
  .picture.small{
    width:min(20vw,21vh,190px)!important;
    height:min(20vw,21vh,190px)!important;
    max-height:21vh!important;
  }
  .audioIllu{
    max-height:26vh!important;
  }
}

/* Móvil/tablet vertical: se prioriza legibilidad y se permite flujo vertical */
@media (max-width:760px){
  html,body{
    height:auto!important;
    min-height:100%!important;
    max-height:none!important;
    overflow:auto!important;
  }
  .page,.app{
    height:auto!important;
    min-height:var(--zurron-view-h)!important;
    max-height:none!important;
    overflow:visible!important;
  }
  .picture{
    width:min(86vw,390px)!important;
    height:min(86vw,390px)!important;
    max-height:none!important;
  }
  .picture.small{
    width:min(70vw,270px)!important;
    height:min(70vw,270px)!important;
    max-height:none!important;
  }
  .audioIllu{
    max-height:340px!important;
  }
}


/* === ZURRÓN · LIMPIEZA VISUAL v5 === */
.content{gap:8px!important}
.back{border-width:1px!important;box-shadow:none!important}
.sub{font-size:15px!important;color:#355a75!important}
.grid{gap:14px!important}
.card{border-width:2px!important;box-shadow:none!important;background:rgba(255,255,255,.95)!important}
.card h2{font-size:clamp(24px,2.4vw,30px)!important;line-height:1.08!important}
.card p{font-size:15px!important;line-height:1.35!important}.chip{font-size:12px!important;padding:5px 9px!important}
.open{min-height:50px!important;font-size:15px!important;box-shadow:none!important}


.letterCharacter{margin-left:auto;width:clamp(70px,8vw,108px);height:clamp(70px,8vw,108px);object-fit:contain;filter:drop-shadow(0 5px 8px rgba(0,0,0,.12))}
.single-trace{grid-template-columns:minmax(0,760px)!important;justify-content:center}
@media(max-width:760px){.letterCharacter{width:72px;height:72px}.single-trace{grid-template-columns:1fr!important}}

</style>
</head>

<script id="zurron-local-nav">
(() => {
  const ROUTES = new Set(["/","/a/","/a/trazo/","/e/","/e/trazo/","/i/","/i/trazo/","/o/","/o/trazo/","/u/","/u/trazo/","/m/","/m/centro/","/m/mision/","/s/","/s/centro/","/s/mision/","/s/cuento/","/l/","/l/centro/","/l/mision/","/l/trazo/"]);

  function normalizeInternal(href) {
    if (!href) return null;
    href = String(href).trim();

    // Solo rutas internas absolutas del proyecto.
    if (!href.startsWith('/')) return null;

    let path = href.split('?')[0].split('#')[0];
    if (path !== '/' && !path.endsWith('/')) path += '/';

    return ROUTES.has(path) ? path : null;
  }

  document.addEventListener('click', (ev) => {
    const a = ev.target.closest('a[href]');
    if (!a) return;

    const path = normalizeInternal(a.getAttribute('href'));
    if (!path) return;

    ev.preventDefault();
    ev.stopImmediatePropagation();

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({type:'zurron:navigate', path}, '*');
    }
  }, true);
})();
</script>


<script id="zurron-responsive-viewport">
(() => {
  const applyViewport = () => {
    const h = Math.max(
      320,
      Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight)
    );
    const w = Math.max(
      320,
      Math.round(window.visualViewport ? window.visualViewport.width : window.innerWidth)
    );
    document.documentElement.style.setProperty('--zurron-view-h', h + 'px');
    document.documentElement.style.setProperty('--zurron-view-w', w + 'px');
  };
  applyViewport();
  window.addEventListener('resize', applyViewport, {passive:true});
  window.addEventListener('orientationchange', applyViewport, {passive:true});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', applyViewport, {passive:true});
  }
})();
</script>
