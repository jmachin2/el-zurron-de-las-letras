ction setStep(step){\n  $$('#stepTrack .stepPill').forEach(el=>{\n    const n=Number(el.dataset.step);\n    el.classList.toggle('active',n===step);\n    el.classList.toggle('done',n<step);\n  });\n}\n\nfunction clearStepTrack(){\n  $$('#stepTrack .stepPill').forEach(el=>el.classList.remove('active','done'));\n}\n\n\n\nfunction wrapStageContent(){\n  document.querySelectorAll('.stage').forEach(stage=>{\n    if(stage.querySelector('.stageFit')) return;\n    const fit=document.createElement('div');\n    fit.className='stageFit';\n    const content=document.createElement('div');\n    content.className='stageContent';\n    while(stage.firstChild){\n      content.appendChild(stage.firstChild);\n    }\n    fit.appendChild(content);\n    stage.appendChild(fit);\n  });\n  document.querySelectorAll('.picture').forEach(img=>{\n    img.addEventListener('load',()=>refitStage(),{once:false});\n  });\n}\nfunction fitActiveStage(){\n  const active=[...document.querySelectorAll('.stage')].find(s=>!s.classList.contains('hidden'));\n  if(!active) return;\n  const fit=active.querySelector('.stageFit');\n  const content=active.querySelector('.stageContent');\n  if(!fit || !content) return;\n\n  content.style.transform='scale(1)';\n  content.style.maxWidth='100%';\n\n  // On small screens, keep the natural flow.\n  if(window.innerWidth < 760){\n    return;\n  }\n\n  const availW=Math.max(100, fit.clientWidth - 8);\n  const availH=Math.max(100, fit.clientHeight - 8);\n\n  // Measure the content at natural size.\n  const neededW=Math.max(content.scrollWidth, content.getBoundingClientRect().width || 0);\n  const neededH=Math.max(content.scrollHeight, content.getBoundingClientRect().height || 0);\n\n  const scale=Math.min(1, availW / neededW, availH / neededH);\n\n  content.style.transform='scale('+scale+')';\n}\nfunction refitStage(){\n  requestAnimationFrame(fitActiveStage);\n  setTimeout(fitActiveStage, 60);\n  setTimeout(fitActiveStage, 160);\n}\n\nlet level=1, deck=[], index=0, score=0, countTries=0, soundTries=0, found=new Set();\n\nconst $=q=>document.querySelector(q);\nconst $$=q=>[...document.querySelectorAll(q)];\n\nfunction shuffle(a){\n  const b=[...a];\n  for(let i=b.length-1;i>0;i--){\n    const j=Math.floor(Math.random()*(i+1));\n    [b[i],b[j]]=[b[j],b[i]];\n  }\n  return b;\n}\nfunction current(){return deck[index]}\nfunction hide(q){$(q).classList.add('hidden')}\nfunction show(q){$(q).classList.remove('hidden')}\nfunction pointsFor(tries){return tries===1?3:tries===2?2:1}\nfunction addPoints(n){score+=n;$('#pointsText').textContent='Puntos: '+score}\n\nfunction showOnly(id){\n  ['#screenCenterReady','#screenIdentify','#screenCount','#screenSound','#screenSentence','#screenSuccess'].forEach(hide);\n  show(id);\n  const stepMap={\n    '#screenIdentify':1,\n    '#screenCount':2,\n    '#screenSound':3,\n    '#screenSentence':4\n  };\n  if(stepMap[id]) setStep(stepMap[id]);\n  else clearStepTrack();\n  refitStage();\n}\n\nfunction renderProgress(){\n  $('#progressDots').innerHTML='';\n  deck.forEach((_,i)=>{\n    const d=document.createElement('span');\n    d.className='pdot '+(i<index?'done':i===index?'current':'');\n    $('#progressDots').appendChild(d);\n  });\n  $('#roundText').textContent=`Palabra ${index+1} de ${deck.length}`;\n}\n\nfunction setImages(){\n  const c=current();\n  [\n    ['#identifyImg',c.img],\n    ['#countImg',c.img],\n    ['#sentenceImg',c.img]\n  ].forEach(([sel,src])=>{\n    $(sel).src=src;\n    $(sel).alt='Pictograma de '+c.label;\n  });\n}\n\nfunction buildCountButtons(){\n  $('#countButtons').innerHTML='';\n  for(let n=1;n<=6;n++){\n    const b=document.createElement('button');\n    b.type='button';\n    b.className='btn';\n    b.textContent=n;\n    b.addEventListener('click',()=>checkCount(b,n));\n    $('#countButtons').appendChild(b);\n  }\n}\n\nfunction buildSoundSyllables(){\n  $('#soundSyllables').innerHTML='';\n  current().syll.forEach((s,i)=>{\n    const b=document.createElement('button');\n    b.type='button';\n    b.className='syll';\n    b.textContent=s.toUpperCase();\n    b.addEventListener('click',()=>checkSound(b,i));\n    $('#soundSyllables').appendChild(b);\n  });\n}\n\nfunction resetWord(){\n  countTries=0; soundTries=0; found=new Set();\n  renderProgress(); setImages(); buildCountButtons(); buildSoundSyllables();\n\n  $('#identifyWord').textContent='';\n  $('#countWord').textContent=current().label.toUpperCase();\n  $('#soundWord').textContent=current().label.toUpperCase();\n  $('#sentenceWord').textContent=current().label.toUpperCase();\n  $('#successWord').textContent=current().label.toUpperCase();\n\n  $('#countFeedback').className='feedback';\n  $('#soundFeedback').className='feedback';\n  $('#countFeedback').textContent='';\n  $('#soundFeedback').textContent='';\n  $('#revealBtn').disabled=false;\n  show('#revealBtn'); hide('#toCountBtn');\n  hide('#toSoundBtn'); hide('#toSentenceBtn');\n\n  const [tagText,tagColor]=TAGS[current().cat];\n  $('#categoryTag').innerHTML=`<span class=\"tag\" style=\"border-color:${tagColor};background:${tagColor}18\">${tagText}<\/span>`;\n\n  showOnly('#screenIdentify');\n}\n\nfunction startLevel(n){\n  level=Number(n);\n  deck=shuffle(BANKS[level]).slice(0,5);\n  index=0; score=0;\n  $('#pointsText').textContent='Puntos: 0';\n  $('#levelTitle').textContent=NAMES[level];\n  applyLevelTheme();\n  hide('#levelScreen'); hide('#finishScreen'); show('#gameScreen');\n  resetWord();\n}\n\nfunction prepareNewPlayer(){\n  deck=shuffle(BANKS[level]).slice(0,5);\n  index=0;\n  score=0;\n  $('#pointsText').textContent='Puntos: 0';\n  applyLevelTheme();\n  $('#centerReadyLevel').textContent=NAMES[level];\n  hide('#finishScreen');\n  hide('#levelScreen');\n  show('#gameScreen');\n  renderProgress();\n  showOnly('#screenCenterReady');\n}\n\nfunction samePlayerAnotherFive(){\n  deck=shuffle(BANKS[level]).slice(0,5);\n  index=0;\n  // score is intentionally preserved for the same child\n  hide('#finishScreen');\n  hide('#levelScreen');\n  show('#gameScreen');\n  resetWord();\n}\n\nfunction changeLevel(){\n  hide('#gameScreen');\n  hide('#finishScreen');\n  clearStepTrack();\n  show('#levelScreen');\n  refitStage();\n}\n\n\nfunction checkCount(button,n){\n  countTries++;\n  const correct=current().syll.length;\n  if(n===correct){\n    button.classList.add('good');\n    $$('#countButtons .btn').forEach(b=>b.disabled=true);\n    $('#countFeedback').className='feedback ok';\n    $('#countFeedback').textContent=`Muy bien. Tiene ${correct} ${correct===1?'sílaba':'sílabas'}.`;\n    addPoints(pointsFor(countTries));\n    show('#toSoundBtn');\n    refitStage();\n  } else {\n    button.classList.add('bad');\n    $('#countFeedback').className='feedback try';\n    $('#countFeedback').textContent='Casi. Dilo despacio y vuelve a contar.';\n    setTimeout(()=>button.classList.remove('bad'),550);\n  }\n}\n\nfunction getSoundTargets(){\n  const c=current();\n  const targets=Array.isArray(c.s) ? c.s : [];\n  return [...new Set(targets)].filter(i=>Number.isInteger(i) && i>=0 && i<c.syll.length);\n}\n\nfunction completeSoundStep(){\n  const targets=getSoundTargets();\n  $$('#soundSyllables .syll').forEach(b=>b.disabled=true);\n  $('#soundFeedback').className='feedback ok';\n  $('#soundFeedback').textContent='Muy bien. Has encontrado dónde suena la S.';\n  addPoints(pointsFor(soundTries));\n  show('#toSentenceBtn');\n  refitStage();\n}\n\nfunction checkSound(button,i){\n  if(found.has(i)) return;\n\n  const targets=getSoundTargets();\n  soundTries++;\n\n  if(targets.includes(i)){\n    found.add(i);\n    button.classList.add('hit');\n    button.disabled=true;\n\n    if(!button.querySelector('.cap')){\n      const cap=document.createElement('span');\n      cap.className='cap';\n      cap.setAttribute('aria-hidden','true');\n      button.appendChild(cap);\n    }\n\n    const remaining=targets.filter(pos=>!found.has(pos));\n\n    if(remaining.length===0){\n      completeSoundStep();\n    } else {\n      $('#soundFeedback').className='feedback ok';\n      $('#soundFeedback').textContent='Muy bien. La S también suena en otra sílaba. Tócala.';\n      refitStage();\n    }\n  } else {\n    button.classList.add('bad');\n    $('#soundFeedback').className='feedback try';\n    $('#soundFeedback').textContent='Casi. Escucha despacio y toca otra sílaba.';\n    setTimeout(()=>button.classList.remove('bad'),550);\n  }\n}\n\nfunction finishGame(){\n  hide('#gameScreen'); show('#finishScreen');\n  $('#finishLevel').textContent=NAMES[level];\n  $('#finishPoints').textContent='Puntos: '+score;\n  clearStepTrack();\n  refitStage();\n}\n\n$$('[data-level]').forEach(b=>b.addEventListener('click',()=>startLevel(b.dataset.level)));\n\n$('#revealBtn').addEventListener('click',()=>{\n  $('#identifyWord').textContent=current().label.toUpperCase();\n  $('#revealBtn').disabled=true;\n  hide('#revealBtn'); show('#toCountBtn');\n  refitStage();\n});\n\n$('#toCountBtn').addEventListener('click',()=>showOnly('#screenCount'));\n$('#toSoundBtn').addEventListener('click',()=>showOnly('#screenSound'));\n$('#toSentenceBtn').addEventListener('click',()=>showOnly('#screenSentence'));\n\n$('#clapBtn').addEventListener('click',()=>{\n  const syllables=$$('#soundSyllables .syll');\n  $('#soundFeedback').className='feedback';\n  $('#soundFeedback').textContent='Palmea cada sílaba...';\n\n  syllables.forEach((el,i)=>{\n    setTimeout(()=>{\n      el.classList.add('clapPulse');\n      setTimeout(()=>el.classList.remove('clapPulse'),360);\n    },i*430);\n  });\n\n  const total=Math.max(450, syllables.length*430+120);\n  setTimeout(()=>{\n    if(getSoundTargets().some(pos=>!found.has(pos))){\n      $('#soundFeedback').className='feedback';\n      $('#soundFeedback').textContent='Ahora toca la sílaba o sílabas donde suena la S.';\n      refitStage();\n    }\n  },total);\n});\n\n$('#sentenceDoneBtn').addEventListener('click',()=>{\n  addPoints(1);\n  $('#successLead').textContent=POSITIVE[index % POSITIVE.length];\n  showOnly('#screenSuccess');\n  refitStage();\n});\n\n$('#nextWordBtn').addEventListener('click',()=>{\n  index++;\n  if(index>=deck.length) finishGame();\n  else resetWord();\n  refitStage();\n});\n\n$('#restartLevel').addEventListener('click',()=>startLevel(level));\n$('#quickNewPlayer').addEventListener('click',prepareNewPlayer);\n$('#quickChangeLevel').addEventListener('click',changeLevel);\n$('#centerStartBtn').addEventListener('click',resetWord);\n$('#playAgain').addEventListener('click',samePlayerAnotherFive);\n$('#chooseLevel').addEventListener('click',changeLevel);\n$('#finishNewPlayer').addEventListener('click',prepareNewPlayer);\n\n\nwrapStageContent();\nwindow.addEventListener('resize', refitStage);\nwindow.addEventListener('load', refitStage);\ndocument.addEventListener('fullscreenchange', ()=>setTimeout(refitStage,120));\n\nconst fullscreenBtn=document.getElementById('fullscreenBtn');\nif(fullscreenBtn){\n  fullscreenBtn.addEventListener('click', async ()=>{\n    try{\n      if(!document.fullscreenElement){\n        await document.documentElement.requestFullscreen();\n        fullscreenBtn.textContent='Salir de pantalla completa';\n      }else{\n        await document.exitFullscreen();\n        fullscreenBtn.textContent='Pantalla completa';\n      }\n    }catch(e){\n      fullscreenBtn.textContent='Pantalla completa';\n    }\n  });\n  document.addEventListener('fullscreenchange',()=>{\n    fullscreenBtn.textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa';\n  });\n}\n\n<\/script>\n\n\n<script id=\"zurron-local-nav\">\n(() => {\n  const ROUTES = new Set([\"/\", \"/m/\", \"/m/centro/\", \"/m/mision/\", \"/s/\", \"/s/centro/\", \"/s/mision/\", \"/s/cuento/\", \"/l/\", \"/l/centro/\", \"/l/mision/\"]);\n\n  function normalizeInternal(href) {\n    if (!href) return null;\n    href = String(href).trim();\n\n    // Solo rutas internas absolutas del proyecto.\n    if (!href.startsWith('/')) return null;\n\n    let path = href.split('?')[0].split('#')[0];\n    if (path !== '/' && !path.endsWith('/')) path += '/';\n\n    return ROUTES.has(path) ? path : null;\n  }\n\n  document.addEventListener('click', (ev) => {\n    const a = ev.target.closest('a[href]');\n    if (!a) return;\n\n    const path = normalizeInternal(a.getAttribute('href'));\n    if (!path) return;\n\n    ev.preventDefault();\n    ev.stopImmediatePropagation();\n\n    if (window.parent && window.parent !== window) {\n      window.parent.postMessage({type:'zurron:navigate', path}, '*');\n    }\n  }, true);\n})();\n<\/script>\n\n\n<script id=\"zurron-responsive-viewport\">\n(() => {\n  const applyViewport = () => {\n    const h = Math.max(\n      320,\n      Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight)\n    );\n    const w = Math.max(\n      320,\n      Math.round(window.visualViewport ? window.visualViewport.width : window.innerWidth)\n    );\n    document.documentElement.style.setProperty('--zurron-view-h', h + 'px');\n    document.documentElement.style.setProperty('--zurron-view-w', w + 'px');\n  };\n  applyViewport();\n  window.addEventListener('resize', applyViewport, {passive:true});\n  window.addEventListener('orientationchange', applyViewport, {passive:true});\n  if(window.visualViewport){\n    window.visualViewport.addEventListener('resize', applyViewport, {passive:true});\n  }\n})();\n<\/script>\n\n<\/body>\n<\/html>\n","/s/cuento/":"<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>Cuento · Letra S · El Zurrón de las Letras<\/title>\n<meta name=\"description\" content=\"Cuento del sirinoque, canciones, comprensión y vocabulario de la letra S.\">\n<style>\n:root{\n  --ink:#17324d;\n  --muted:#5f7182;\n  --paper:#fffdf8;\n  --line:#d8e4ed;\n  --s:#df4b53;\n  --s2:#f07a81;\n  --blue:#2f80ed;\n  --green:#2f9e5b;\n  --yellow:#f3b52b;\n  --violet:#8058c7;\n  --shadow:0 14px 36px rgba(30,70,105,.14);\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef5f9}\nbody{min-height:100vh;background:linear-gradient(145deg,#eef7fb,#f9fbfc)}\nbutton{font:inherit}\na{color:inherit;text-decoration:none}\n.hidden{display:none!important}\n.page{min-height:100vh;padding:9px}\n.shell{\n  width:100%;\n  min-height:calc(100vh - 18px);\n  background:var(--paper);\n  border:1px solid var(--line);\n  border-radius:23px;\n  box-shadow:var(--shadow);\n  overflow:hidden;\n}\n.header{\n  padding:12px 16px 10px;\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:12px;\n  border-bottom:1px solid var(--line);\n  background:rgba(255,255,255,.96);\n}\n.headerLeft{display:flex;align-items:center;gap:12px;min-width:0}\n.back{\n  min-height:40px;\n  padding:7px 12px;\n  border:2px solid var(--line);\n  border-radius:12px;\n  background:white;\n  font-weight:900;\n  white-space:nowrap;\n}\n.mark{\n  width:46px;height:46px;border-radius:14px;\n  display:grid;place-items:center;\n  background:var(--s);color:white;\n  font-size:29px;font-weight:950;\n}\n.titleWrap{min-width:0}\n.kicker{font-size:11px;font-weight:900;letter-spacing:.07em;color:var(--muted)}\nh1{margin:2px 0 0;font-size:clamp(23px,2.8vw,38px);line-height:1}\n.tabs{\n  padding:10px 12px;\n  display:grid;\n  grid-template-columns:repeat(4,minmax(0,1fr));\n  gap:8px;\n  border-bottom:1px solid var(--line);\n  background:#f8fbfd;\n}\n.tab{\n  min-height:47px;\n  border:2px solid var(--line);\n  border-radius:14px;\n  background:white;\n  color:var(--ink);\n  font-weight:950;\n  cursor:pointer;\n}\n.tab.active{\n  background:var(--s);\n  border-color:var(--s);\n  color:white;\n}\n.panel{padding:14px;min-height:calc(100vh - 145px)}\n\n/* CUENTO */\n.storyLayout{\n  min-height:calc(100vh - 180px);\n  display:grid;\n  grid-template-columns:minmax(0,1fr) 165px;\n  gap:12px;\n}\n.storyStage{\n  min-height:0;\n  border:2px solid var(--line);\n  border-radius:20px;\n  background:#eef5f9;\n  display:grid;\n  grid-template-rows:minmax(0,1fr) auto;\n  overflow:hidden;\n}\n.storyImageWrap{\n  min-height:0;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  padding:8px;\n}\n.storyImage{\n  max-width:100%;\n  max-height:calc(100vh - 260px);\n  object-fit:contain;\n  border-radius:12px;\n  box-shadow:0 8px 22px rgba(30,60,90,.10);\n  background:white;\n}\n.storyControls{\n  display:grid;\n  grid-template-columns:auto minmax(0,1fr) auto;\n  gap:9px;\n  align-items:center;\n  padding:9px;\n  border-top:1px solid var(--line);\n  background:white;\n}\n.storyBtn{\n  min-height:46px;\n  min-width:110px;\n  border:0;\n  border-radius:13px;\n  background:var(--s);\n  color:white;\n  font-weight:950;\n  cursor:pointer;\n}\n.storyBtn:disabled{opacity:.38;cursor:not-allowed}\n.pageCounter{text-align:center;font-weight:900;color:var(--muted)}\n.thumbs{\n  display:flex;\n  flex-direction:column;\n  gap:7px;\n  overflow:auto;\n  padding-right:3px;\n}\n.thumb{\n  width:100%;\n  aspect-ratio:1/1;\n  object-fit:cover;\n  border:3px solid transparent;\n  border-radius:12px;\n  cursor:pointer;\n  background:white;\n}\n.thumb.active{border-color:var(--s)}\n\n/* CANCIONES */\n.audioGrid{\n  min-height:calc(100vh - 185px);\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  gap:18px;\n  align-items:stretch;\n}\n.audioCard{\n  border:3px solid var(--line);\n  border-radius:24px;\n  background:white;\n  padding:24px;\n  display:flex;\n  flex-direction:column;\n  justify-content:center;\n  box-shadow:0 10px 24px rgba(30,60,90,.08);\n}\n.audioCard h2{margin:0 0 8px;font-size:clamp(24px,2.4vw,36px)}\n.audioCard p{color:var(--muted);font-size:17px;line-height:1.45;margin:0 0 20px}\naudio{width:100%}\n.audioTag{\n  display:inline-block;\n  align-self:flex-start;\n  margin-bottom:16px;\n  padding:7px 11px;\n  border-radius:999px;\n  background:#fff0f1;\n  color:#a43b41;\n  font-size:12px;\n  font-weight:950;\n}\n\n/* KAHOOT */\n.quizWrap{\n  min-height:calc(100vh - 185px);\n  display:flex;\n  align-items:center;\n  justify-content:center;\n}\n.quizCard{\n  width:min(920px,100%);\n  border:3px solid var(--line);\n  border-radius:24px;\n  background:white;\n  padding:clamp(18px,3vw,34px);\n  box-shadow:0 10px 26px rgba(30,60,90,.08);\n}\n.quizTop{\n  display:flex;justify-content:space-between;gap:10px;align-items:center;\n  margin-bottom:16px;\n}\n.quizCount,.quizScore{font-weight:950;color:var(--muted)}\n.quizQuestion{\n  font-size:clamp(25px,3.1vw,42px);\n  font-weight:950;\n  line-height:1.12;\n  text-align:center;\n  margin:18px auto 26px;\n}\n.answers{\n  display:grid;\n  grid-template-columns:repeat(2,minmax(0,1fr));\n  gap:12px;\n}\n.answer{\n  min-height:92px;\n  border:0;\n  border-radius:18px;\n  color:white;\n  font-weight:950;\n  font-size:clamp(17px,1.8vw,24px);\n  cursor:pointer;\n  padding:14px;\n}\n.answer:nth-child(1){background:#d94848}\n.answer:nth-child(2){background:#2f80ed}\n.answer:nth-child(3){background:#e4a61d}\n.answer:nth-child(4){background:#2d9d55}\n.answer.correct{outline:7px solid rgba(47,157,85,.22);filter:brightness(1.06)}\n.answer.wrong{opacity:.45}\n.quizFeedback{min-height:32px;text-align:center;font-weight:950;font-size:19px;margin:16px 0 8px}\n.nextQuiz{\n  width:100%;min-height:54px;border:0;border-radius:16px;background:var(--ink);color:white;font-weight:950;font-size:18px;cursor:pointer\n}\n.result{text-align:center}\n.result h2{font-size:clamp(32px,4vw,50px);margin:0 0 10px}\n.resultScore{font-size:clamp(42px,6vw,74px);font-weight:950;color:var(--s);margin:10px 0 20px}\n\n/* VOCABULARIO */\n.vocabIntro{margin:0 0 12px;color:var(--muted);font-size:16px}\n.vocabGrid{\n  display:grid;\n  grid-template-columns:repeat(3,minmax(0,1fr));\n  gap:13px;\n}\n.vocabCard{\n  min-height:190px;\n  border:3px solid var(--line);\n  border-radius:20px;\n  background:white;\n  padding:18px;\n  cursor:pointer;\n  position:relative;\n  overflow:hidden;\n  text-align:left;\n}\n.vocabWord{font-size:clamp(24px,2.2vw,34px);font-weight:950;color:var(--s);margin-bottom:10px}\n.vocabPrompt{font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.03em}\n.vocabDefinition{\n  margin-top:14px;\n  font-size:17px;\n  line-height:1.42;\n  color:var(--ink);\n  opacity:0;\n  transform:translateY(8px);\n  transition:.18s ease;\n}\n.vocabClue{\n  margin-top:9px;\n  color:var(--muted);\n  font-size:14px;\n  line-height:1.35;\n  opacity:0;\n  transition:.18s ease;\n}\n.vocabCard.open .vocabDefinition,\n.vocabCard.open .vocabClue{opacity:1;transform:none}\n.vocabCard.open .vocabPrompt{display:none}\n.vocabChallenge{\n  margin-top:16px;\n  border:3px solid #f1d0d2;\n  border-radius:20px;\n  background:#fff7f7;\n  padding:18px;\n}\n.challengeTitle{font-size:23px;font-weight:950;margin-bottom:8px}\n.challengeQuestion{font-size:19px;font-weight:850;margin-bottom:12px}\n.challengeChoices{display:flex;flex-wrap:wrap;gap:9px}\n.challengeBtn{\n  min-height:44px;\n  padding:8px 14px;\n  border:2px solid var(--line);\n  border-radius:13px;\n  background:white;\n  font-weight:900;\n  cursor:pointer;\n}\n.challengeBtn.ok{background:#e9f8ef;border-color:#57a873}\n.challengeBtn.bad{background:#fff0f0;border-color:#d66a6a}\n.challengeFeedback{min-height:25px;margin-top:10px;font-weight:900}\n\n.originals{\n  margin-top:18px;\n  border-top:1px solid var(--line);\n  padding-top:14px;\n}\n.originals summary{cursor:pointer;font-weight:900;color:var(--muted)}\n.originalGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}\n.originalGrid img{width:100%;border:1px solid var(--line);border-radius:14px}\n\n@media(max-width:850px){\n  .tabs{grid-template-columns:repeat(2,1fr)}\n  .storyLayout{grid-template-columns:1fr}\n  .thumbs{flex-direction:row}\n  .thumb{width:95px;flex:0 0 95px}\n  .audioGrid{grid-template-columns:1fr}\n  .vocabGrid{grid-template-columns:repeat(2,minmax(0,1fr))}\n}\n@media(max-width:600px){\n  .page{padding:4px}\n  .shell{border-radius:16px}\n  .header{padding:9px}\n  .back{padding:6px 9px;font-size:12px}\n  .mark{width:39px;height:39px;font-size:24px}\n  .tabs{padding:7px;gap:6px}\n  .tab{min-height:43px;font-size:13px}\n  .panel{padding:8px}\n  .storyImage{max-height:65vh}\n  .storyBtn{min-width:84px}\n  .answers{grid-template-columns:1fr}\n  .answer{min-height:65px}\n  .vocabGrid{grid-template-columns:1fr}\n  .originalGrid{grid-template-columns:1fr}\n}\n\n/* =======================================================\n   RESPONSIVE DE PANTALLA COMPLETA · CUENTO S\n   ======================================================= */\nhtml,body{\n  width:100%;\n  height:100%;\n  min-height:0;\n}\nbody{overflow:hidden}\n.page{\n  width:100%;\n  height:100dvh;\n  min-height:0;\n  padding:clamp(4px,.7vw,8px);\n}\n.shell{\n  width:100%;\n  height:100%;\n  min-height:0;\n  display:grid;\n  grid-template-rows:auto auto minmax(0,1fr);\n  overflow:hidden;\n}\n.header{\n  min-height:0;\n  padding:clamp(7px,1vh,11px) clamp(9px,1vw,14px);\n}\n.headerLeft{min-width:0}\n.mark{\n  width:clamp(38px,4vw,46px);\n  height:clamp(38px,4vw,46px);\n  font-size:clamp(23px,2.5vw,29px);\n}\nh1{font-size:clamp(20px,2.4vw,32px)}\n.tabs{\n  min-height:0;\n  padding:clamp(5px,.7vh,8px) clamp(7px,.8vw,11px);\n  gap:clamp(5px,.7vw,8px);\n}\n.tab{\n  min-height:clamp(38px,6vh,47px);\n  font-size:clamp(11px,.95vw,14px);\n}\n.panel{\n  min-height:0!important;\n  height:100%!important;\n  padding:clamp(6px,.8vw,10px);\n  overflow:hidden;\n}\n\n/* Botón fullscreen de la página */\n.cuento-fullscreen{\n  min-height:40px;\n  padding:7px 11px;\n  border:2px solid var(--line);\n  border-radius:12px;\n  background:white;\n  color:var(--ink);\n  font-weight:950;\n  cursor:pointer;\n  white-space:nowrap;\n}\n\n/* CUENTO: imagen usa todo el espacio disponible */\n.storyLayout{\n  width:100%;\n  height:100%;\n  min-height:0!important;\n  display:grid;\n  grid-template-rows:minmax(0,1fr) 68px;\n  grid-template-columns:1fr;\n  gap:7px;\n}\n.storyStage{\n  width:100%;\n  height:100%;\n  min-height:0;\n}\n.storyImageWrap{\n  width:100%;\n  height:100%;\n  min-height:0;\n  padding:5px;\n}\n.storyImage{\n  width:100%;\n  height:100%;\n  max-width:none!important;\n  max-height:none!important;\n  object-fit:contain;\n}\n.storyControls{\n  min-height:52px;\n  grid-template-columns:auto minmax(0,1fr) auto auto;\n  padding:6px 8px;\n}\n.storyBtn{\n  min-height:40px;\n  min-width:96px;\n  padding:6px 10px;\n  font-size:13px;\n}\n.imageFullscreenBtn{\n  min-height:40px;\n  border:2px solid var(--line);\n  border-radius:12px;\n  padding:6px 10px;\n  background:white;\n  color:var(--ink);\n  font-weight:950;\n  cursor:pointer;\n}\n.thumbs{\n  min-height:0;\n  display:flex;\n  flex-direction:row;\n  gap:6px;\n  overflow-x:auto;\n  overflow-y:hidden;\n  padding:0 2px 3px;\n}\n.thumb{\n  width:62px;\n  height:62px;\n  flex:0 0 62px;\n  aspect-ratio:1;\n}\n\n/* Al ampliar SOLO la imagen */\n#storyStage:fullscreen{\n  width:100vw;\n  height:100vh;\n  border:0;\n  border-radius:0;\n  background:#101820;\n  padding:0;\n  display:grid;\n  grid-template-rows:minmax(0,1fr) auto;\n}\n#storyStage:fullscreen .storyImageWrap{padding:0}\n#storyStage:fullscreen .storyImage{\n  width:100vw;\n  height:calc(100vh - 58px);\n  object-fit:contain;\n  border-radius:0;\n  box-shadow:none;\n  background:#101820;\n}\n#storyStage:fullscreen .storyControls{\n  min-height:58px;\n}\n\n/* CANCIONES: ilustradas con imágenes del PDF */\n.audioGrid{\n  width:100%;\n  height:100%;\n  min-height:0!important;\n  gap:clamp(10px,1.2vw,18px);\n}\n.audioCard{\n  height:100%;\n  min-height:0;\n  padding:clamp(10px,1.4vw,18px);\n  justify-content:flex-start;\n  overflow:hidden;\n}\n.audioIllu{\n  width:100%;\n  flex:1 1 auto;\n  min-height:0;\n  max-height:calc(100vh - 330px);\n  object-fit:contain;\n  border-radius:16px;\n  background:#f3f7fa;\n  margin-bottom:10px;\n}\n.audioCard h2{\n  font-size:clamp(18px,2vw,28px);\n  margin-bottom:4px;\n}\n.audioCard p{\n  font-size:clamp(12px,1vw,15px);\n  margin-bottom:8px;\n}\n.audioTag{margin-bottom:7px;padding:5px 9px}\naudio{flex:0 0 auto;height:42px}\n\n/* KAHOOT: todo en una sola pantalla sin scroll */\n.quizWrap{\n  width:100%;\n  height:100%;\n  min-height:0!important;\n  align-items:stretch;\n}\n.quizCard{\n  width:min(1000px,100%);\n  height:100%;\n  max-height:100%;\n  min-height:0;\n  margin:auto;\n  padding:clamp(9px,1.4vh,18px) clamp(12px,1.6vw,22px);\n  display:flex;\n  flex-direction:column;\n  justify-content:center;\n  overflow:hidden;\n}\n#quizPlay{\n  min-height:0;\n  display:flex;\n  flex-direction:column;\n  justify-content:center;\n}\n.quizTop{margin-bottom:clamp(5px,.8vh,10px)}\n.quizCount,.quizScore{font-size:clamp(12px,1vw,15px)}\n.quizQuestion{\n  font-size:clamp(22px,3.5vh,38px);\n  line-height:1.08;\n  margin:clamp(7px,1.3vh,14px) auto clamp(9px,1.5vh,16px);\n}\n.answers{\n  min-height:0;\n  gap:clamp(7px,1vh,10px);\n}\n.answer{\n  min-height:clamp(58px,10vh,82px);\n  padding:clamp(7px,1vh,12px);\n  font-size:clamp(15px,2.2vh,21px);\n}\n.quizFeedback{\n  min-height:25px;\n  font-size:clamp(14px,2vh,18px);\n  margin:clamp(5px,.8vh,9px) 0 4px;\n}\n.nextQuiz{\n  min-height:clamp(42px,6.5vh,50px);\n  font-size:clamp(14px,2vh,17px);\n}\n.result h2{font-size:clamp(28px,4.5vh,44px)}\n.resultScore{font-size:clamp(42px,8vh,68px);margin:6px 0 14px}\n.originals{display:none!important}\n\n/* VOCABULARIO: también adaptado al viewport */\n#vocab{\n  display:grid;\n  grid-template-rows:auto minmax(0,1fr) auto;\n  gap:7px;\n}\n#vocab.hidden{display:none!important}\n.vocabIntro{margin:0;font-size:13px}\n.vocabGrid{\n  min-height:0;\n  grid-template-columns:repeat(3,minmax(0,1fr));\n  grid-template-rows:repeat(2,minmax(0,1fr));\n  gap:8px;\n}\n.vocabCard{\n  min-height:0;\n  padding:clamp(8px,1vw,13px);\n}\n.vocabWord{font-size:clamp(19px,2vw,28px);margin-bottom:5px}\n.vocabPrompt{font-size:10px}\n.vocabDefinition{margin-top:6px;font-size:clamp(12px,1vw,15px);line-height:1.28}\n.vocabClue{margin-top:5px;font-size:11px}\n.vocabChallenge{\n  margin:0;\n  padding:9px 12px;\n}\n.challengeTitle{font-size:17px;margin-bottom:3px}\n.challengeQuestion{font-size:14px;margin-bottom:6px}\n.challengeChoices{gap:5px}\n.challengeBtn{min-height:34px;padding:5px 9px;font-size:12px}\n.challengeFeedback{min-height:18px;margin-top:4px;font-size:12px}\n\n/* Pantallas de ordenador con poca altura */\n@media(max-height:720px) and (min-width:761px){\n  .header{padding:5px 8px}\n  .back{min-height:32px;font-size:10px;padding:4px 7px}\n  .mark{width:34px;height:34px;font-size:21px}\n  .kicker{font-size:9px}\n  h1{font-size:19px}\n  .cuento-fullscreen{min-height:32px;font-size:10px;padding:4px 7px}\n  .tabs{padding:4px 6px}\n  .tab{min-height:34px;font-size:10px}\n  .panel{padding:5px}\n  .storyLayout{grid-template-rows:minmax(0,1fr) 52px}\n  .thumb{width:48px;height:48px;flex-basis:48px}\n  .storyControls{min-height:43px}\n  .storyBtn,.imageFullscreenBtn{min-height:34px;font-size:10px}\n  .audioIllu{max-height:calc(100vh - 280px)}\n  .audioCard h2{font-size:18px}\n  .audioCard p{font-size:11px}\n  audio{height:36px}\n}\n\n/* Tablet/móvil: se permite scroll cuando es físicamente necesario */\n@media(max-width:760px){\n  html,body{height:auto;min-height:100%}\n  body{overflow:auto}\n  .page{height:auto;min-height:100dvh}\n  .shell{height:auto;min-height:calc(100dvh - 8px);display:block}\n  .panel{height:auto!important;overflow:visible}\n  .storyLayout{height:auto;display:block}\n  .storyStage{height:72vh}\n  .thumbs{margin-top:7px}\n  .audioGrid{height:auto;grid-template-columns:1fr}\n  .audioCard{height:auto;min-height:520px}\n  .audioIllu{max-height:340px}\n  .quizWrap{height:auto;min-height:70vh}\n  .quizCard{height:auto}\n  .vocabGrid{grid-template-columns:1fr;grid-template-rows:none}\n}\n\n\n/* La pantalla completa la controla EXCLUSIVAMENTE la consola superior. */\n#fullscreenBtn,\n[data-page-fullscreen],\n.s-page-fullscreen,\n.cuento-fullscreen{\n  display:none!important;\n}\nhtml,body{\n  max-width:100%;\n}\n\n\n/* Zoom interno de la página del cuento: no activa Fullscreen API. */\n.storyStage.image-expanded{\n  position:fixed!important;\n  inset:0!important;\n  z-index:99990!important;\n  width:100vw!important;\n  height:100dvh!important;\n  max-width:none!important;\n  max-height:none!important;\n  border:0!important;\n  border-radius:0!important;\n  background:#101820!important;\n  display:grid!important;\n  grid-template-rows:minmax(0,1fr) auto!important;\n}\n.storyStage.image-expanded .storyImageWrap{\n  min-height:0!important;\n  padding:0!important;\n}\n.storyStage.image-expanded .storyImage{\n  width:100%!important;\n  height:100%!important;\n  max-width:none!important;\n  max-height:none!important;\n  object-fit:contain!important;\n  border-radius:0!important;\n  box-shadow:none!important;\n  background:#101820!important;\n}\n.storyStage.image-expanded .storyControls{\n  min-height:56px!important;\n  background:white!important;\n}\n\n\n/* ==========================================================\n   ZURRÓN · AJUSTE GLOBAL RESPONSIVE v3\n   La altura útil se calcula con JS y corresponde al viewport\n   REAL de cada pantalla interna.\n   ========================================================== */\n:root{\n  --zurron-view-h:100dvh;\n  --zurron-view-w:100vw;\n}\nhtml,body{\n  width:100%!important;\n  height:100%!important;\n  min-width:0!important;\n  min-height:0!important;\n  max-width:100%!important;\n  max-height:100%!important;\n}\nbody{\n  overflow:hidden!important;\n}\n\n/* Contenedores principales: nunca deben sobrepasar el viewport */\n.page,\n.app{\n  width:100%!important;\n  height:var(--zurron-view-h)!important;\n  min-width:0!important;\n  min-height:0!important;\n  max-width:100%!important;\n  max-height:var(--zurron-view-h)!important;\n}\n.shell{\n  min-width:0!important;\n  min-height:0!important;\n  max-width:100%!important;\n  max-height:100%!important;\n}\n\n/* Cualquier imagen funcional debe entrar COMPLETA en su contenedor */\nimg{\n  max-width:100%!important;\n  max-height:100%!important;\n}\n\n/* Pictogramas de las misiones */\n.picture{\n  width:min(40vw,46vh,420px)!important;\n  height:min(40vw,46vh,420px)!important;\n  max-width:88vw!important;\n  max-height:46vh!important;\n  object-fit:contain!important;\n}\n.picture.small{\n  width:min(28vw,30vh,285px)!important;\n  height:min(28vw,30vh,285px)!important;\n  max-width:72vw!important;\n  max-height:30vh!important;\n  object-fit:contain!important;\n}\n\n/* Portada: siempre se ve la ilustración completa */\n.hero{\n  min-height:0!important;\n  overflow:hidden!important;\n  display:flex!important;\n  align-items:center!important;\n  justify-content:center!important;\n}\n.hero img{\n  width:100%!important;\n  height:100%!important;\n  object-fit:contain!important;\n  object-position:center center!important;\n}\n\n/* Cuento: página completa dentro del área disponible */\n.storyImageWrap{\n  min-width:0!important;\n  min-height:0!important;\n  overflow:hidden!important;\n}\n.storyImage{\n  width:100%!important;\n  height:100%!important;\n  max-width:100%!important;\n  max-height:100%!important;\n  object-fit:contain!important;\n  object-position:center center!important;\n}\n\n/* Ilustraciones de las canciones */\n.audioIllu{\n  width:100%!important;\n  height:auto!important;\n  min-height:0!important;\n  max-width:100%!important;\n  max-height:min(42vh,390px)!important;\n  object-fit:contain!important;\n  object-position:center!important;\n}\n\n/* Canvas/ruletas: nunca salen de pantalla */\ncanvas{\n  max-width:100%!important;\n  max-height:100%!important;\n}\n\n/* SVG y vídeo, por seguridad */\nsvg,video{\n  max-width:100%;\n  max-height:100%;\n}\n\n/* Evitar que grids/flex fuerzen anchuras superiores al viewport */\n.stage,\n.storyStage,\n.storyLayout,\n.audioGrid,\n.quizWrap,\n.quizCard,\n.question-card,\n.activity,\n.activity-body,\n.activity-panel,\n.main,\n.content,\n.cardsWrap,\n.grid,\n.levels,\n.players-layout,\n.roulette-stage{\n  min-width:0!important;\n  min-height:0!important;\n}\n\n/* Ordenador/PDI: todo debe caber, sin scroll */\n@media (min-width:761px){\n  html,body{\n    overflow:hidden!important;\n  }\n  .page,.app{\n    overflow:hidden!important;\n  }\n}\n\n/* Pantallas de poca altura: reducir automáticamente elementos visuales */\n@media (max-height:760px) and (min-width:761px){\n  .picture{\n    width:min(34vw,40vh,340px)!important;\n    height:min(34vw,40vh,340px)!important;\n    max-height:40vh!important;\n  }\n  .picture.small{\n    width:min(23vw,25vh,230px)!important;\n    height:min(23vw,25vh,230px)!important;\n    max-height:25vh!important;\n  }\n  .audioIllu{\n    max-height:32vh!important;\n  }\n}\n\n/* Pantalla especialmente baja */\n@media (max-height:620px) and (min-width:761px){\n  .picture{\n    width:min(29vw,34vh,290px)!important;\n    height:min(29vw,34vh,290px)!important;\n    max-height:34vh!important;\n  }\n  .picture.small{\n    width:min(20vw,21vh,190px)!important;\n    height:min(20vw,21vh,190px)!important;\n    max-height:21vh!important;\n  }\n  .audioIllu{\n    max-height:26vh!important;\n  }\n}\n\n/* Móvil/tablet vertical: se prioriza legibilidad y se permite flujo vertical */\n@media (max-width:760px){\n  html,body{\n    height:auto!important;\n    min-height:100%!important;\n    max-height:none!important;\n    overflow:auto!important;\n  }\n  .page,.app{\n    height:auto!important;\n    min-height:var(--zurron-view-h)!important;\n    max-height:none!important;\n    overflow:visible!important;\n  }\n  .picture{\n    width:min(86vw,390px)!important;\n    height:min(86vw,390px)!important;\n    max-height:none!important;\n  }\n  .picture.small{\n    width:min(70vw,270px)!important;\n    height:min(70vw,270px)!important;\n    max-height:none!important;\n  }\n  .audioIllu{\n    max-height:340px!important;\n  }\n}\n\n\n/* === ZURRÓN · LIMPIEZA VISUAL v5 === */\nhtml,body{background:#f4f7fa!important}\n:root{--line:#d7e1eb!important;--muted:#6e8294!important;--shadow:0 5px 14px rgba(30,70,105,.06)!important}\n.shell,.storyStage,.audioCard,.quizCard{box-shadow:none!important}\n.header{padding:8px 14px!important}.kicker{display:none!important}\nh1{font-size:clamp(22px,2.5vw,32px)!important}.tabs{padding:8px 12px!important;gap:8px!important;background:#fbfcfd!important}\n.tab{min-height:44px!important;border-width:1px!important;color:#38526c!important;background:#fff!important}.tab.active{background:var(--s)!important;color:#fff!important}\n.panel{padding:10px!important}\n.storyLayout{grid-template-columns:minmax(0,1fr) 110px!important;gap:10px!important;min-height:calc(100vh - 165px)!important}\n.storyStage{border-width:1px!important;background:#fff!important}\n.storyImageWrap{padding:6px!important;background:#fbfcfd!important}\n.storyImage{max-height:calc(100vh - 230px)!important;box-shadow:none!important;border-radius:10px!important}\n.storyControls{padding:8px!important;background:#fbfcfd!important}.storyBtn{min-height:42px!important;min-width:102px!important}\n.pageCounter{font-size:14px!important}.thumb{border-width:2px!important;border-radius:10px!important}\n.audioGrid{gap:14px!important}.audioCard{border-width:2px!important;padding:18px!important}.audioCard h2{font-size:clamp(22px,2.2vw,30px)!important}.audioCard p{font-size:15px!important;line-height:1.35!important}\n.quizCard{border-width:2px!important;padding:18px!important}.quizQuestion{font-size:clamp(28px,3.3vw,42px)!important;line-height:1.15!important}\n.answers .answer,.vocabCard,.vocabBtn,.flipCard{box-shadow:none!important}\n\n<\/style>\n<\/head>\n<body>\n<main class=\"page\">\n<section class=\"shell\">\n  <header class=\"header\">\n    <div class=\"headerLeft\">\n      <a class=\"back\" href=\"/s/\">← LETRA S<\/a>\n      <div class=\"mark\">S<\/div>\n      <div class=\"titleWrap\">\n        <div class=\"kicker\">EL ZURRÓN DE LAS LETRAS<\/div>\n        <h1>Cuento · El sirinoque<\/h1>\n      <\/div>\n    <\/div>\n    <button class=\"cuento-fullscreen\" type=\"button\" data-page-fullscreen>PANTALLA COMPLETA<\/button>\n  <\/header>\n\n  <nav class=\"tabs\" aria-label=\"Secciones del cuento\">\n    <button class=\"tab active\" data-panel=\"story\" type=\"button\">CUENTO<\/button>\n    <button class=\"tab\" data-panel=\"songs\" type=\"button\">CANCIONES<\/button>\n    <button class=\"tab\" data-panel=\"quiz\" type=\"button\">KAHOOT · COMPRENSIÓN<\/button>\n    <button class=\"tab\" data-panel=\"vocab\" type=\"button\">VOCABULARIO<\/button>\n  <\/nav>\n\n  <section id=\"story\" class=\"panel\">\n    <div class=\"storyLayout\">\n      <div class=\"storyStage\">\n        <div class=\"storyImageWrap\">\n          <img id=\"storyImage\" class=\"storyImage\" src=\"assets/pagina_05.png\" alt=\"Página 5 del cuento\">\n        <\/div>\n        <div class=\"storyControls\">\n          <button id=\"prevStory\" class=\"storyBtn\" type=\"button\">ANTERIOR<\/button>\n          <div id=\"storyCounter\" class=\"pageCounter\">Página 5 de 12<\/div>\n          <button id=\"imageFullscreenBtn\" class=\"imageFullscreenBtn\" type=\"button\">AMPLIAR IMAGEN<\/button>\n          <button id=\"nextStory\" class=\"storyBtn\" type=\"button\">SIGUIENTE<\/button>\n        <\/div>\n      <\/div>\n      <div id=\"thumbs\" class=\"thumbs\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"songs\" class=\"panel hidden\">\n    <div class=\"audioGrid\">\n      <article class=\"audioCard\">\n        <span class=\"audioTag\">CANCIÓN<\/span>\n        <img class=\"audioIllu\" src=\"assets/pagina_12.png\" alt=\"Olegario tocando el tambor y la flauta en el sirinoque\">\n        <h2>El sirinoque · versión 2<\/h2>\n        <p>Escucha la canción del sirinoque.<\/p>\n        <audio controls preload=\"metadata\">\n          <source src=\"assets/elsirinoque_version_2.mp3\" type=\"audio/mpeg\">\n        <\/audio>\n      <\/article>\n\n      <article class=\"audioCard\">\n        <span class=\"audioTag\">BASE MUSICAL<\/span>\n        <img class=\"audioIllu\" src=\"assets/pagina_05.png\" alt=\"Olegario y el zurrón de los sonidos\">\n        <h2>El sirinoque del zurrón<\/h2>\n        <p>Base musical para cantar o acompañar el cuento en clase.<\/p>\n        <audio controls preload=\"metadata\">\n          <source src=\"assets/sirinoque_base_musical.mp3\" type=\"audio/mpeg\">\n        <\/audio>\n      <\/article>\n    <\/div>\n  <\/section>\n\n  <section id=\"quiz\" class=\"panel hidden\">\n    <div class=\"quizWrap\">\n      <div id=\"quizCard\" class=\"quizCard\">\n        <div id=\"quizPlay\">\n          <div class=\"quizTop\">\n            <div id=\"quizCount\" class=\"quizCount\"><\/div>\n            <div id=\"quizScore\" class=\"quizScore\"><\/div>\n          <\/div>\n          <div id=\"quizQuestion\" class=\"quizQuestion\"><\/div>\n          <div id=\"answers\" class=\"answers\"><\/div>\n          <div id=\"quizFeedback\" class=\"quizFeedback\" aria-live=\"polite\"><\/div>\n          <button id=\"nextQuiz\" class=\"nextQuiz hidden\" type=\"button\">SIGUIENTE PREGUNTA<\/button>\n        <\/div>\n        <div id=\"quizResult\" class=\"result hidden\">\n          <h2>Comprensión completada<\/h2>\n          <div id=\"resultScore\" class=\"resultScore\"><\/div>\n          <button id=\"restartQuiz\" class=\"nextQuiz\" type=\"button\">VOLVER A JUGAR<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <details class=\"originals\">\n      <summary>Ver las fichas originales de comprensión (páginas 13 y 14)<\/summary>\n      <div class=\"originalGrid\">\n        <img src=\"assets/pagina_13.png\" alt=\"Preguntas de comprensión originales, página 13\">\n        <img src=\"assets/pagina_14.png\" alt=\"Actividad visual de comprensión original, página 14\">\n      <\/div>\n    <\/details>\n  <\/section>\n\n  <section id=\"vocab\" class=\"panel hidden\">\n    <p class=\"vocabIntro\">Toca una palabra para descubrir qué significa dentro del cuento.<\/p>\n    <div id=\"vocabGrid\" class=\"vocabGrid\"><\/div>\n\n    <div class=\"vocabChallenge\">\n      <div class=\"challengeTitle\">Reto de vocabulario<\/div>\n      <div id=\"challengeQuestion\" class=\"challengeQuestion\"><\/div>\n      <div id=\"challengeChoices\" class=\"challengeChoices\"><\/div>\n      <div id=\"challengeFeedback\" class=\"challengeFeedback\" aria-live=\"polite\"><\/div>\n    <\/div>\n  <\/section>\n<\/section>\n<\/main>\n\n<script>\nconst storyPages=[\"assets/pagina_05.png\", \"assets/pagina_06.png\", \"assets/pagina_07.png\", \"assets/pagina_08.png\", \"assets/pagina_09.png\", \"assets/pagina_10.png\", \"assets/pagina_11.png\", \"assets/pagina_12.png\"];\nlet storyIndex=0;\n\nconst tabs=[...document.querySelectorAll('.tab')];\nconst panels=['story','songs','quiz','vocab'];\n\nfunction showPanel(id){\n  panels.forEach(p=>document.getElementById(p).classList.toggle('hidden',p!==id));\n  tabs.forEach(t=>t.classList.toggle('active',t.dataset.panel===id));\n}\n\ntabs.forEach(t=>t.addEventListener('click',()=>showPanel(t.dataset.panel)));\n\nfunction renderStory(){\n  const img=document.getElementById('storyImage');\n  img.src=storyPages[storyIndex];\n  img.alt=`Página ${storyIndex+5} del cuento`;\n  document.getElementById('storyCounter').textContent=`Página ${storyIndex+5} de 12`;\n  document.getElementById('prevStory').disabled=storyIndex===0;\n  document.getElementById('nextStory').disabled=storyIndex===storyPages.length-1;\n  [...document.querySelectorAll('.thumb')].forEach((el,i)=>el.classList.toggle('active',i===storyIndex));\n}\n\nconst thumbs=document.getElementById('thumbs');\nstoryPages.forEach((src,i)=>{\n  const im=document.createElement('img');\n  im.src=src;\n  im.className='thumb';\n  im.alt=`Miniatura página ${i+5}`;\n  im.addEventListener('click',()=>{storyIndex=i;renderStory()});\n  thumbs.appendChild(im);\n});\ndocument.getElementById('prevStory').addEventListener('click',()=>{if(storyIndex>0){storyIndex--;renderStory()}});\ndocument.getElementById('nextStory').addEventListener('click',()=>{if(storyIndex<storyPages.length-1){storyIndex++;renderStory()}});\nrenderStory();\n\n/* KAHOOT DE COMPRENSIÓN */\nconst quizData=[{\"q\": \"¿De qué isla es el sirinoque?\", \"options\": [\"La Palma\", \"Tenerife\", \"Gran Canaria\", \"La Gomera\"], \"answer\": 0}, {\"q\": \"¿Qué instrumento toca Olegario con una mano?\", \"options\": [\"Tambor\", \"Guitarra\", \"Maracas\", \"Acordeón\"], \"answer\": 0}, {\"q\": \"¿Qué instrumento toca Olegario con la otra mano?\", \"options\": [\"Flauta\", \"Trompeta\", \"Acordeón\", \"Guitarra\"], \"answer\": 0}, {\"q\": \"¿El sirinoque se canta, se baila o las dos cosas?\", \"options\": [\"Se canta\", \"Se baila\", \"Las dos cosas\", \"Solo se escucha\"], \"answer\": 2}, {\"q\": \"¿Cuántos agujeros tiene la flauta del sirinoque?\", \"options\": [\"1\", \"2\", \"3\", \"4\"], \"answer\": 2}, {\"q\": \"¿Cómo es la música del sirinoque?\", \"options\": [\"Alegre\", \"Triste\", \"Silenciosa\", \"Muy lenta\"], \"answer\": 0}];\nlet qi=0, score=0, locked=false;\n\nfunction renderQuiz(){\n  locked=false;\n  const q=quizData[qi];\n  document.getElementById('quizCount').textContent=`Pregunta ${qi+1} de ${quizData.length}`;\n  document.getElementById('quizScore').textContent=`Puntos: ${score}`;\n  document.getElementById('quizQuestion').textContent=q.q;\n  document.getElementById('quizFeedback').textContent='';\n  document.getElementById('nextQuiz').classList.add('hidden');\n  const box=document.getElementById('answers');\n  box.innerHTML='';\n  q.options.forEach((op,i)=>{\n    const b=document.createElement('button');\n    b.type='button';\n    b.className='answer';\n    b.textContent=op;\n    b.addEventListener('click',()=>answerQuiz(b,i));\n    box.appendChild(b);\n  });\n}\n\nfunction answerQuiz(btn,idx){\n  if(locked)return;\n  locked=true;\n  const q=quizData[qi];\n  const buttons=[...document.querySelectorAll('.answer')];\n  buttons.forEach((b,i)=>{\n    b.disabled=true;\n    if(i===q.answer)b.classList.add('correct');\n    else if(i===idx)b.classList.add('wrong');\n  });\n  if(idx===q.answer){\n    score++;\n    document.getElementById('quizFeedback').textContent='¡Correcto!';\n  }else{\n    document.getElementById('quizFeedback').textContent=`La respuesta correcta es: ${q.options[q.answer]}.`;\n  }\n  document.getElementById('quizScore').textContent=`Puntos: ${score}`;\n  document.getElementById('nextQuiz').classList.remove('hidden');\n}\n\ndocument.getElementById('nextQuiz').addEventListener('click',()=>{\n  qi++;\n  if(qi>=quizData.length){\n    document.getElementById('quizPlay').classList.add('hidden');\n    document.getElementById('quizResult').classList.remove('hidden');\n    document.getElementById('resultScore').textContent=`${score} / ${quizData.length}`;\n  }else renderQuiz();\n});\n\ndocument.getElementById('restartQuiz').addEventListener('click',()=>{\n  qi=0;score=0;\n  document.getElementById('quizResult').classList.add('hidden');\n  document.getElementById('quizPlay').classList.remove('hidden');\n  renderQuiz();\n});\nrenderQuiz();\n\n/* VOCABULARIO */\nconst vocabData=[{\"word\": \"sirinoque\", \"definition\": \"Un ritmo de La Palma que se puede cantar y bailar.\", \"clue\": \"Es el ritmo que sale del zurrón y que Olegario enseña a los niños.\"}, {\"word\": \"zurrón\", \"definition\": \"El zurrón de Olegario guarda sonidos de las islas.\", \"clue\": \"Es la bolsa especial de Olegario.\"}, {\"word\": \"siote\", \"definition\": \"En el cuento es un sonido saltarín y juguetón.\", \"clue\": \"Los niños lo ayudan a volver bailando con pequeños saltos.\"}, {\"word\": \"sorondongo\", \"definition\": \"En el cuento es un sonido suave y tranquilo.\", \"clue\": \"Olegario y los niños guardan silencio para escucharlo.\"}, {\"word\": \"tambor\", \"definition\": \"Instrumento que acompaña al sirinoque.\", \"clue\": \"Olegario lo toca con una mano.\"}, {\"word\": \"flauta de tres agujeros\", \"definition\": \"Instrumento que acompaña al tambor en el sirinoque.\", \"clue\": \"Olegario la toca con la otra mano.\"}];\nconst vocabGrid=document.getElementById('vocabGrid');\n\nvocabData.forEach(v=>{\n  const card=document.createElement('button');\n  card.type='button';\n  card.className='vocabCard';\n  card.innerHTML=`\n    <div class=\"vocabWord\">${v.word}<\/div>\n    <div class=\"vocabPrompt\">TOCA PARA DESCUBRIR<\/div>\n    <div class=\"vocabDefinition\">${v.definition}<\/div>\n    <div class=\"vocabClue\">${v.clue}<\/div>`;\n  card.addEventListener('click',()=>card.classList.toggle('open'));\n  vocabGrid.appendChild(card);\n});\n\nlet challengeIndex=0;\nfunction renderChallenge(){\n  const v=vocabData[challengeIndex % vocabData.length];\n  document.getElementById('challengeQuestion').textContent=`¿Qué palabra corresponde? ${v.definition}`;\n  document.getElementById('challengeFeedback').textContent='';\n  const other=vocabData.filter(x=>x.word!==v.word).slice(0,3).map(x=>x.word);\n  const choices=[v.word,...other].sort(()=>Math.random()-.5);\n  const box=document.getElementById('challengeChoices');\n  box.innerHTML='';\n  choices.forEach(word=>{\n    const b=document.createElement('button');\n    b.type='button';\n    b.className='challengeBtn';\n    b.textContent=word;\n    b.addEventListener('click',()=>{\n      [...box.children].forEach(x=>x.disabled=true);\n      if(word===v.word){\n        b.classList.add('ok');\n        document.getElementById('challengeFeedback').textContent='¡Muy bien!';\n      }else{\n        b.classList.add('bad');\n        document.getElementById('challengeFeedback').textContent=`Era: ${v.word}.`;\n      }\n      setTimeout(()=>{challengeIndex++;renderChallenge()},1100);\n    });\n    box.appendChild(b);\n  });\n}\nrenderChallenge();\n<\/script>\n<script>\nasync function togglePageFullscreen(btn){\n  try{\n    if(!document.fullscreenElement){\n      await document.documentElement.requestFullscreen();\n    }else{\n      await document.exitFullscreen();\n    }\n  }catch(e){}\n}\nfunction updatePageFullscreenButtons(){\n  document.querySelectorAll('[data-page-fullscreen]').forEach(btn=>{\n    btn.textContent=document.fullscreenElement?'SALIR DE PANTALLA COMPLETA':'PANTALLA COMPLETA';\n  });\n}\ndocument.querySelectorAll('[data-page-fullscreen]').forEach(btn=>{\n  btn.addEventListener('click',()=>togglePageFullscreen(btn));\n});\ndocument.addEventListener('fullscreenchange',updatePageFullscreenButtons);\n\nconst imageFullscreenBtn=document.getElementById('imageFullscreenBtn');\nconst storyStage=document.querySelector('.storyStage');\nif(imageFullscreenBtn && storyStage){\n  imageFullscreenBtn.addEventListener('click',()=>{\n    const expanded=storyStage.classList.toggle('image-expanded');\n    imageFullscreenBtn.textContent=expanded?'VOLVER AL CUENTO':'AMPLIAR IMAGEN';\n  });\n}\n<\/script>\n\n\n<script id=\"zurron-local-nav\">\n(() => {\n  const ROUTES = new Set([\"/\", \"/m/\", \"/m/centro/\", \"/m/mision/\", \"/s/\", \"/s/centro/\", \"/s/mision/\", \"/s/cuento/\", \"/l/\", \"/l/centro/\", \"/l/mision/\"]);\n\n  function normalizeInternal(href) {\n    if (!href) return null;\n    href = String(href).trim();\n\n    // Solo rutas internas absolutas del proyecto.\n    if (!href.startsWith('/')) return null;\n\n    let path = href.split('?')[0].split('#')[0];\n    if (path !== '/' && !path.endsWith('/')) path += '/';\n\n    return ROUTES.has(path) ? path : null;\n  }\n\n  document.addEventListener('click', (ev) => {\n    const a = ev.target.closest('a[href]');\n    if (!a) return;\n\n    const path = normalizeInternal(a.getAttribute('href'));\n    if (!path) return;\n\n    ev.preventDefault();\n    ev.stopImmediatePropagation();\n\n    if (window.parent && window.parent !== window) {\n      window.parent.postMessage({type:'zurron:navigate', path}, '*');\n    }\n  }, true);\n})();\n<\/script>\n\n\n<script id=\"zurron-responsive-viewport\">\n(() => {\n  const applyViewport = ;background:#fff!important;box-shadow:none!important}\n.choice.long{font-size:clamp(19px,2vw,27px)!important;line-height:1.18!important}\n.feedback{font-size:18px!important;margin-top:4px!important}\n.question-kicker,.audio-status,.small,.journey-label,.instruction-box strong{font-weight:800!important}\n.zurron-back-letter{opacity:.9!important;background:rgba(255,255,255,.95)!important;border-color:rgba(23,50,77,.14)!important}\n@media(max-height:760px) and (min-width:901px){\n  .journey-wrap{min-height:64px!important;padding:6px 12px!important}\n  .journey-line{min-height:46px!important}\n  .question-main{font-size:clamp(42px,6vw,72px)!important}\n  .choice{min-height:64px!important;font-size:clamp(30px,3.5vw,44px)!important}\n}\n\n\n/* ==========================================================\n   ZURRÓN · AVATARES MÁS VISIBLES v7\n   ========================================================== */\n.animal-roster{grid-auto-rows:minmax(72px,1fr)!important}\n.animal-card{padding:4px 3px!important}\n.animal-card .avatar-svg{width:54px!important;height:54px!important;flex:0 0 54px!important}\n.animal-label{font-size:10px!important;line-height:1.05!important}\n.animal-meta{font-size:8px!important;line-height:1!important}\n.current-turn{min-height:54px!important}\n.current-turn .avatar-svg{width:46px!important;height:46px!important;flex:0 0 46px!important}\n.roulette-choice{min-height:68px!important}\n.roulette-choice .avatar-svg{width:58px!important;height:58px!important;flex:0 0 58px!important}\n.player-badge .avatar-svg{width:42px!important;height:42px!important;flex:0 0 42px!important}\n.journey-animal .avatar-svg{width:32px!important;height:32px!important}\n.activity-waiting .avatar-svg{width:72px!important;height:72px!important}\n.turn-card .avatar-svg{width:76px!important;height:76px!important}\n@media(max-height:700px) and (min-width:761px){\n .animal-roster{grid-auto-rows:minmax(62px,1fr)!important}\n .animal-card .avatar-svg{width:46px!important;height:46px!important;flex-basis:46px!important}\n .current-turn .avatar-svg{width:42px!important;height:42px!important;flex-basis:42px!important}\n .roulette-choice .avatar-svg{width:50px!important;height:50px!important;flex-basis:50px!important}\n .player-badge .avatar-svg{width:38px!important;height:38px!important;flex-basis:38px!important}\n .journey-animal .avatar-svg{width:30px!important;height:30px!important}\n}\n@media(max-width:760px){\n .animal-card .avatar-svg{width:56px!important;height:56px!important;flex-basis:56px!important}\n .current-turn .avatar-svg{width:48px!important;height:48px!important;flex-basis:48px!important}\n .roulette-choice .avatar-svg{width:60px!important;height:60px!important;flex-basis:60px!important}\n}\n\n<\/style>\n<\/head>\n<body>\n<a class=\"zurron-back-letter\" href=\"/l/\" aria-label=\"Volver a la letra L\">← LETRA L<\/a>\n<div class=\"app\">\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <div class=\"badge\">L<\/div>\n      <div><h1>Juego con la CARTILLA DE LECTURA de la L<\/h1><div class=\"subtitle\">Dos pantallas: jugadores y ruleta / niveles y actividad. Al comenzar, el juego sustituye esta pantalla de espera.<\/div><\/div>\n    <\/div>\n    <nav class=\"nav\" aria-label=\"Pantallas del juego\">\n      <button class=\"btn active\" id=\"playersTab\" type=\"button\">JUGADORES Y RULETA<\/button>\n      <button class=\"btn secondary\" id=\"activityTab\" type=\"button\">NIVELES Y ACTIVIDAD<\/button>\n    <\/nav>\n    <div class=\"actions\">\n      <button class=\"btn secondary\" id=\"voiceSettingsBtn\" type=\"button\">VOZ Y VOLUMEN<\/button>\n      <button class=\"btn secondary\" id=\"fullscreenBtn\" type=\"button\">PANTALLA COMPLETA<\/button>\n      <button class=\"btn danger\" id=\"resetBtn\" type=\"button\">NUEVA PARTIDA<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"pages\">\n    <section class=\"page active\" id=\"playersPage\" aria-label=\"Jugadores y ruleta\">\n      <div class=\"players-layout\">\n        <div class=\"card players-panel\">\n          <div class=\"panel-head\">\n            <div>\n              <div class=\"panel-title\">ELIGE TU ANIMALITO<\/div>\n              <div class=\"panel-help\">Cada niño toca un animal libre al terminar su trabajo. Los 20 permanecen visibles. El borde azul señala a quienes tienen prioridad para salir.<\/div>\n            <\/div>\n          <\/div>\n          <div class=\"current-turn\" id=\"currentTurn\"><span><strong>Sin turno.<\/strong> Elige animalitos y gira la ruleta.<\/span><\/div>\n          <div class=\"animal-roster\" id=\"animalRoster\"><\/div>\n          <div class=\"roster-footer\">\n            <div class=\"legend\"><span><b>Azul:<\/b> prioridad<\/span><span><b>Amarillo:<\/b> juega ahora<\/span><span><b>Verde:<\/b> finalizado<\/span><\/div>\n            <div class=\"small\">La ruleta prioriza primero a quienes todavía no han jugado y después a quienes llevan menos turnos.<\/div>\n          <\/div>\n        <\/div>\n\n        <aside class=\"card wheel-panel\">\n          <div class=\"roulette-kicker\">LA RULETA ELIGE<\/div>\n          <h2>¿Quién juega ahora?<\/h2>\n          <div class=\"priority-box\" id=\"priorityInfo\"><strong>Prioridad<\/strong><br>Elige varios animalitos para empezar.<\/div>\n          <div class=\"roulette-stage\">\n            <div class=\"roulette-pointer\"><\/div>\n            <canvas id=\"wheel\" width=\"420\" height=\"420\" aria-label=\"Ruleta de jugadores\"><\/canvas>\n          <\/div>\n          <div class=\"roulette-choice\" id=\"wheelResult\"><div><strong>Preparados<\/strong><span>Primero juegan quienes todavía no han participado.<\/span><\/div><\/div>\n          <div class=\"roulette-buttons\">\n            <button class=\"btn primary\" id=\"spinBtn\" type=\"button\">GIRAR<\/button>\n            <button class=\"btn good\" id=\"startTurnBtn\" type=\"button\" disabled>COMENZAR<\/button>\n          <\/div>\n        <\/aside>\n      <\/div>\n    <\/section>\n\n    <section class=\"page\" id=\"activityPage\" aria-label=\"Niveles y actividad\">\n      <div class=\"activity-layout\">\n        <div class=\"activity-head\">\n          <div>\n            <div class=\"activity-title\" id=\"levelTitle\">Niveles y actividad<\/div>\n            <div class=\"small\" id=\"levelDesc\">La ruleta debe elegir primero a un jugador.<\/div>\n          <\/div>\n          <div class=\"activity-actions\"><div class=\"player-badge\" id=\"playerBadge\"><strong>Sin jugador<\/strong><\/div><button class=\"btn secondary\" id=\"changePlayerBtn\" type=\"button\">CAMBIAR JUGADOR<\/button><\/div>\n        <\/div>\n        <div class=\"progress-track\" id=\"progressTrack\"><\/div>\n        <div class=\"journey-wrap\" id=\"journeyWrap\"><\/div>\n        <div id=\"activityBody\" style=\"height:100%;min-height:0\">\n          <div class=\"activity-waiting\" id=\"waitingView\">\n            <div>\n              <div class=\"waiting-default\" id=\"waitingDefault\">\n                <div class=\"bigM\">L<\/div>\n                <h2>Preparados para leer<\/h2>\n                <p>Primero la ruleta debe elegir un animalito.<\/p>\n                <div class=\"waiting-actions\">\n                  <button class=\"btn primary\" id=\"goPlayersBtn\" type=\"button\">IR A LA RULETA<\/button>\n                <\/div>\n              <\/div>\n              <div class=\"waiting-selected\" id=\"waitingSelected\">\n                <div id=\"waitingAvatar\"><\/div>\n                <h2 id=\"waitingName\">Jugador elegido<\/h2>\n                <p id=\"waitingLevel\">Preparado para comenzar.<\/p>\n                <div class=\"waiting-actions\">\n                  <button class=\"btn good\" id=\"waitingStartBtn\" type=\"button\">COMENZAR ACTIVIDAD<\/button>\n                  <button class=\"btn secondary\" id=\"waitingBackBtn\" type=\"button\">VOLVER A LA RULETA<\/button>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n          <div class=\"question-card\" id=\"levelView\" hidden>\n            <div class=\"question-kicker\" id=\"questionKicker\">PREGUNTA<\/div>\n            <div class=\"instruction-box\" id=\"instructionBox\">\n              <strong>QUÉ HAGO<\/strong>\n              <div class=\"instruction-text\" id=\"instructionText\">Escucha o lee con calma y elige la respuesta correcta.<\/div>\n              <button class=\"btn secondary instruction-listen\" id=\"instructionListenBtn\" type=\"button\">OÍR INSTRUCCIÓN<\/button>\n            <\/div>\n            <div class=\"audio-zone\" id=\"audioZone\">\n              <div class=\"speaker-disc\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 64 64\"><path d=\"M12 26h11l13-11v34L23 38H12z\" fill=\"#2f80ed\" stroke=\"#17324d\" stroke-width=\"3\"/><path d=\"M43 24q8 8 0 16M49 18q14 14 0 28\" fill=\"none\" stroke=\"#17324d\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><\/svg>\n              <\/div>\n              <div>\n                <button class=\"btn primary listen-btn\" id=\"listenBtn\" type=\"button\">ESCUCHAR<\/button>\n                <div class=\"audio-status\" id=\"audioStatus\">Escucha y después toca la sílaba.<\/div>\n              <\/div>\n            <\/div>\n            <div class=\"phrase-controls\" id=\"phraseControls\" aria-label=\"Ajustes de lectura del nivel 4\">\n              <div class=\"phrase-control\">\n                <strong>VELOCIDAD<\/strong>\n                <button class=\"phrase-step\" id=\"phraseRateDown\" type=\"button\" aria-label=\"Reducir velocidad\">−<\/button>\n                <span class=\"phrase-value\" id=\"phraseRateValue\">0,56<\/span>\n                <button class=\"phrase-step\" id=\"phraseRateUp\" type=\"button\" aria-label=\"Aumentar velocidad\">+<\/button>\n              <\/div>\n              <div class=\"phrase-control\">\n                <strong>PAUSA<\/strong>\n                <button class=\"phrase-step\" id=\"phrasePauseDown\" type=\"button\" aria-label=\"Reducir pausa entre palabras\">−<\/button>\n
