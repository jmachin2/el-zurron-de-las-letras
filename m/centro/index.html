n  max-height:100%!important;\n  padding:6px!important;\n  border-width:2px!important;\n  border-radius:14px!important;\n  justify-content:flex-start!important;\n  overflow:auto!important;\n  overscroll-behavior:contain;\n  scrollbar-width:thin;\n}\n.question-kicker{font-size:10px!important}\n.question-main{\n  font-size:clamp(25px,4vw,40px)!important;\n  margin:3px 0 4px!important;\n}\n.question-main.sentence{font-size:clamp(20px,3vw,32px)!important}\n.prompt{\n  font-size:clamp(16px,2vw,21px)!important;\n  margin:0 0 4px!important;\n}\n.instruction-box{\n  gap:5px!important;\n  margin:2px auto 3px!important;\n  padding:4px 6px!important;\n  border-width:1px!important;\n  border-radius:10px!important;\n}\n.instruction-box strong{font-size:9px!important}\n.instruction-text{\n  font-size:clamp(13px,1.5vw,17px)!important;\n  line-height:1.1!important;\n}\n.instruction-listen{\n  min-height:30px!important;\n  padding:3px 6px!important;\n  font-size:10px!important;\n}\n\n/* Audio compacto. */\n.audio-zone{\n  min-height:52px!important;\n  margin:2px auto 4px!important;\n  gap:7px!important;\n}\n.speaker-disc{\n  width:52px!important;\n  height:52px!important;\n  border-width:3px!important;\n}\n.speaker-disc svg{width:30px!important;height:30px!important}\n.listen-btn{\n  min-width:130px!important;\n  min-height:38px!important;\n  padding:5px 8px!important;\n  font-size:13px!important;\n}\n.audio-status{\n  min-height:12px!important;\n  font-size:9px!important;\n}\n\n/* Controles del nivel 4 de S/L. */\n.phrase-controls{\n  width:min(700px,98%)!important;\n  margin:0 auto 3px!important;\n  padding:3px 5px!important;\n  gap:4px!important;\n}\n.phrase-control{\n  grid-template-columns:auto 28px minmax(65px,1fr) 28px!important;\n  gap:3px!important;\n}\n.phrase-control strong,.phrase-value{font-size:9px!important}\n.phrase-step{\n  width:28px!important;\n  height:25px!important;\n  font-size:15px!important;\n  border-radius:7px!important;\n}\n\n/* Opciones y feedback: siemp }\n.subtitle{display:none!important}\n.badge{width:46px!important;height:46px!important;flex-basis:46px!important;font-size:28px!important;border-width:2px!important;background:#fff!important}\n.brand h1{font-size:clamp(20px,2vw,24px)!important}\n.actions .btn,.nav .btn{\n  min-height:34px!important;padding:7px 10px!important;font-size:13px!important;\n  border:1px solid #d6dee8!important;background:#f8fafc!important;color:#4e677f!important;box-shadow:none!important\n}\n.nav .btn.active{background:#24486f!important;color:#fff!important;border-color:#24486f!important}\n.activity-title{font-size:clamp(18px,2.2vw,22px)!important;line-height:1.1!important}\n.player-badge{padding:4px 8px!important;border-width:2px!important;box-shadow:none!important}\n.player-badge strong{font-size:15px!important}.mistakes{font-size:13px!important}.mistakes .mark{width:20px!important;height:20px!important}\n.progress-track{display:none!important}\n.journey-wrap{padding:8px 14px!important;border-width:2px!important;min-height:76px!important;background:#fbfcfd!important}\n.journey-wrap::after{display:none!important}\n.journey-line{min-height:54px!important}\n.journey-line::before,.journey-fill{top:22px!important;height:6px!important}\n.journey-node{width:24px!important;height:24px!important;border-width:2px!important;font-size:10px!important;box-shadow:none!important}\n.journey-stop.goal .journey-node{width:30px!important;height:30px!important;border-radius:10px!important;font-size:15px!important}\n.journey-label{font-size:11px!important;color:#6b8094!important}\n.journey-animal{top:0!important}.journey-animal .avatar-svg{width:28px!important;height:28px!important}.journey-animal .bubble{display:none!important}\n.question-card{border-width:2px!important;padding:10px 14px!important;background:#fff!important}\n.question-kicker{font-size:12px!important;color:#8598aa!important;letter-spacing:.03em!important}\n.prompt{font-size:clamp(18px,2vw,24px)!important;color:#29445f!important;margin-botto d-auto-rows:minmax(72px,1fr)!important}\n.animal-card{padding:4px 3px!important}\n.animal-card .avatar-svg{width:54px!important;height:54px!important;flex:0 0 54px!important}\n.animal-label{font-size:10px!important;line-height:1.05!important}\n.animal-meta{font-size:8px!important;line-height:1!important}\n.current-turn{min-height:54px!important}\n.current-turn .avatar-svg{width:46px!important;height:46px!important;flex:0 0 46px!important}\n.roulette-choice{min-height:68px!important}\n.roulette-choice .avatar-svg{width:58px!important;height:58px!important;flex:0 0 58px!important}\n.player-badge .avatar-svg{width:42px!important;height:42px!important;flex:0 0 42px!important}\n.journey-animal .avatar-svg{width:32px!important;height:32px!important}\n.activity-waiting .avatar-svg{width:72px!important;height:72px!important}\n.turn-card .avatar-svg{width:76px!important;height:76px!important}\n@media(max-height:700px) and (min-width:761px){\n .animal-roster{grid-auto-rows:minmax(62px,1fr)!important}\n .animal-card .avatar-svg{width:46px!important;height:46px!important;flex-basis:46px!important}\n .current-turn .avatar-svg{width:42px!important;height:42px!important;flex-basis:42px!important}\n .roulette-choice .avatar-svg{width:50px!important;height:50px!important;flex-basis:50px!important}\n .player-badge .avatar-svg{width:38px!important;height:38px!important;flex-basis:38px!important}\n .journey-animal .avatar-svg{width:30px!important;height:30px!important}\n}\n@media(max-width:760px){\n .animal-card .avatar-svg{width:56px!important;height:56px!important;flex-basis:56px!important}\n .current-turn .avatar-svg{width:48px!important;height:48px!important;flex-basis:48px!important}\n .roulette-choice .avatar-svg{width:60px!important;height:60px!important;flex-basis:60px!important}\n}\n\n<\/style>\n<\/head>\n<body>\n<a class=\"zurron-back-letter\" href=\"/m/\" aria-label=\"Volver a la letra M\">← LETRA M<\/a>\n<div class=\"app\">\n  <header class=\"topbar\">\n    <div class=\"brand\">\n      <div class=\"badge\">M<\/div>\n      <div><h1>Centro interactivo · Letra M<\/h1><div class=\"subtitle\">Dos pantallas: jugadores y ruleta / niveles y actividad. Al comenzar, el juego sustituye esta pantalla de espera.<\/div><\/div>\n    <\/div>\n    <nav class=\"nav\" aria-label=\"Pantallas del juego\">\n      <button class=\"btn active\" id=\"playersTab\" type=\"button\">JUGADORES Y RULETA<\/button>\n      <button class=\"btn secondary\" id=\"activityTab\" type=\"button\">NIVELES Y ACTIVIDAD<\/button>\n    <\/nav>\n    <div class=\"actions\">\n      <button class=\"btn secondary\" id=\"voiceSettingsBtn\" type=\"button\">VOZ Y VOLUMEN<\/button>\n      <button class=\"btn secondary\" id=\"fullscreenBtn\" type=\"button\">PANTALLA COMPLETA<\/button>\n      <button class=\"btn danger\" id=\"resetBtn\" type=\"button\">NUEVA PARTIDA<\/button>\n    <\/div>\n  <\/header>\n\n  <div class=\"pages\">\n    <section class=\"page active\" id=\"playersPage\" aria-label=\"Jugadores y ruleta\">\n      <div class=\"players-layout\">\n        <div class=\"card players-panel\">\n          <div class=\"panel-head\">\n            <div>\n              <div class=\"panel-title\">ELIGE TU ANIMALITO<\/div>\n              <div class=\"panel-help\">Cada niño toca un animal libre al terminar su trabajo. Los 20 permanecen visibles. El borde azul señala a quienes tienen prioridad para salir.<\/div>\n            <\/div>\n          <\/div>\n          <div class=\"current-turn\" id=\"currentTurn\"><span><strong>Sin turno.<\/strong> Elige animalitos y gira la ruleta.<\/span><\/div>\n          <div class=\"animal-roster\" id=\"animalRoster\"><\/div>\n          <div class=\"roster-footer\">\n            <div class=\"legend\"><span><b>Azul:<\/b> prioridad<\/span><span><b>Amarillo:<\/b> juega ahora<\/span><span><b>Verde:<\/b> finalizado<\/span><\/div>\n            <div class=\"small\">La ruleta prioriza primero a quienes todavía no han jugado y después a quienes llevan menos turnos.<\/div>\n          <\/div>\n        <\/div>\n\n        <aside class=\"card wheel-panel\">\n          <div class=\"roulette-kicker\">LA RULETA ELIGE<\/div>\n          <h2>¿Quién juega ahora?<\/h2>\n          <div class=\"priority-box\" id=\"priorityInfo\"><strong>Prioridad<\/strong><br>Elige varios animalitos para empezar.<\/div>\n          <div class=\"roulette-stage\">\n            <div class=\"roulette-pointer\"><\/div>\n            <canvas id=\"wheel\" width=\"420\" height=\"420\" aria-label=\"Ruleta de jugadores\"><\/canvas>\n          <\/div>\n          <div class=\"roulette-choice\" id=\"wheelResult\"><div><strong>Preparados<\/strong><span>Primero juegan quienes todavía no han participado.<\/span><\/div><\/div>\n          <div class=\"roulette-buttons\">\n            <button class=\"btn primary\" id=\"spinBtn\" type=\"button\">GIRAR<\/button>\n            <button class=\"btn good\" id=\"startTurnBtn\" type=\"button\" disabled>COMENZAR<\/button>\n          <\/div>\n        <\/aside>\n      <\/div>\n    <\/section>\n\n    <section class=\"page\" id=\"activityPage\" aria-label=\"Niveles y actividad\">\n      <div class=\"activity-layout\">\n        <div class=\"activity-head\">\n          <div>\n            <div class=\"activity-title\" id=\"levelTitle\">Niveles y actividad<\/div>\n            <div class=\"small\" id=\"levelDesc\">La ruleta debe elegir primero a un jugador.<\/div>\n          <\/div>\n          <div class=\"activity-actions\"><div class=\"player-badge\" id=\"playerBadge\"><strong>Sin jugador<\/strong><\/div><button class=\"btn secondary\" id=\"changePlayerBtn\" type=\"button\">CAMBIAR JUGADOR<\/button><\/div>\n        <\/div>\n        <div class=\"progress-track\" id=\"progressTrack\"><\/div>\n        <div class=\"journey-wrap\" id=\"journeyWrap\"><\/div>\n        <div id=\"activityBody\" style=\"height:100%;min-height:0\">\n          <div class=\"activity-waiting\" id=\"waitingView\">\n            <div>\n              <div class=\"waiting-default\" id=\"waitingDefault\">\n                <div class=\"bigM\">M<\/div>\n                <h2>Preparados para leer<\/h2>\n                <p>Primero la ruleta debe elegir un animalito.<\/p>\n                <div class=\"waiting-actions\">\n                  <button class=\"btn primary\" id=\"goPlayersBtn\" type=\"button\">IR A LA RULETA<\/button>\n                <\/div>\n              <\/div>\n              <div class=\"waiting-selected\" id=\"waitingSelected\">\n                <div id=\"waitingAvatar\"><\/div>\n                <h2 id=\"waitingName\">Jugador elegido<\/h2>\n                <p id=\"waitingLevel\">Preparado para comenzar.<\/p>\n                <div class=\"waiting-actions\">\n                  <button class=\"btn good\" id=\"waitingStartBtn\" type=\"button\">COMENZAR ACTIVIDAD<\/button>\n                  <button class=\"btn secondary\" id=\"waitingBackBtn\" type=\"button\">VOLVER A LA RULETA<\/button>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n          <div class=\"question-card\" id=\"levelView\" hidden>\n            <div class=\"question-kicker\" id=\"questionKicker\">PREGUNTA<\/div>\n            <div class=\"instruction-box\" id=\"instructionBox\">\n              <strong>QUÉ HAGO<\/strong>\n              <div class=\"instruction-text\" id=\"instructionText\">Escucha o lee con calma y elige la respuesta correcta.<\/div>\n              <button class=\"btn secondary instruction-listen\" id=\"instructionListenBtn\" type=\"button\">OÍR INSTRUCCIÓN<\/button>\n            <\/div>\n            <div class=\"audio-zone\" id=\"audioZone\">\n              <div class=\"speaker-disc\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 64 64\"><path d=\"M12 26h11l13-11v34L23 38H12z\" fill=\"#2f80ed\" stroke=\"#17324d\" stroke-width=\"3\"/><path d=\"M43 24q8 8 0 16M49 18q14 14 0 28\" fill=\"none\" stroke=\"#17324d\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><\/svg>\n              <\/div>\n              <div>\n                <button class=\"btn primary listen-btn\" id=\"listenBtn\" type=\"button\">ESCUCHAR<\/button>\n                <div class=\"audio-status\" id=\"audioStatus\">Escucha y después toca la sílaba.<\/div>\n              <\/div>\n            <\/div>\n            <div class=\"question-main\" id=\"questionMain\"><\/div>\n            <div class=\"prompt\" id=\"questionPrompt\"><\/div>\n            <div class=\"choices\" id=\"questionChoices\"><\/div>\n            <div class=\"feedback\" id=\"feedback\" aria-live=\"polite\"><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<div class=\"voice-overlay\" id=\"voiceOverlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"voiceTitle\">\n  <div class=\"voice-card\">\n    <h2 id=\"voiceTitle\">Voz y volumen<\/h2>\n    <p>Elige una de las cuatro voces. La página busca primero voces españolas naturales o neurales instaladas en Chrome, Edge o Windows.<\/p>\n    <div class=\"voice-grid\" id=\"voiceGrid\"><\/div>\n    <div class=\"volume-row\">\n      <label for=\"volumeSlider\">Volumen<\/label>\n      <input id=\"volumeSlider\" type=\"range\" min=\"0\" max=\"200\" step=\"10\" value=\"100\" aria-label=\"Volumen de la voz, de 0 a 200 por ciento\">\n      <div class=\"volume-value\" id=\"volumeValue\">100%<\/div>\n    <\/div>\n    <div class=\"voice-actions\">\n      <button class=\"btn secondary\" id=\"testVoiceBtn\" type=\"button\">PROBAR VOZ<\/button>\n      <button class=\"btn primary\" id=\"closeVoiceBtn\" type=\"button\">LISTO<\/button>\n    <\/div>\n    <div class=\"voice-note\" id=\"voiceNote\">La calidad final depende de las voces disponibles en este ordenador. El control llega a 200 %. También ajusta la intensidad de los sonidos de acierto y fallo. El sintetizador del navegador limita físicamente su salida de voz a su máximo propio; por encima de 100 % se mantiene ese máximo.<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"turn-overlay\" id=\"turnOverlay\" role=\"dialog\" aria-modal=\"true\">\n  <div class=\"turn-card\" id=\"turnCard\"><\/div>\n<\/div>\n\n<script>\nconst animalSpecs=[\n{name:'Gato',kind:'cat',fill:'#ffd9a8',accent:'#f2b66a'},{name:'Perro',kind:'dog',fill:'#d9c2a3',accent:'#b98854'},{name:'Conejo',kind:'rabbit',fill:'#f5e2ff',accent:'#e4b8ff'},{name:'Búho',kind:'owl',fill:'#dfc7a7',accent:'#b1834d'},{name:'Tortuga',kind:'turtle',fill:'#cdebb7',accent:'#89c56a'},{name:'Pez',kind:'fish',fill:'#bde8ff',accent:'#73c5f2'},{name:'Osito',kind:'bear',fill:'#e7c7a8',accent:'#c28f5c'},{name:'Zorro',kind:'fox',fill:'#ffd0a8',accent:'#f39a4e'},{name:'Pollito',kind:'chick',fill:'#fff0a8',accent:'#ffd65f'},{name:'Abejita',kind:'bee',fill:'#ffe28e',accent:'#222'},{name:'Rana',kind:'frog',fill:'#bfe8a9',accent:'#7ec45e'},{name:'Panda',kind:'panda',fill:'#fff',accent:'#30343b'},{name:'León',kind:'lion',fill:'#f4c86e',accent:'#b77831'},{name:'Koala',kind:'koala',fill:'#cdd2d7',accent:'#8a959e'},{name:'Pingüino',kind:'penguin',fill:'#f3f5f7',accent:'#263746'},{name:'Elefante',kind:'elephant',fill:'#c9d6e5',accent:'#8ca3bd'},{name:'Mariquita',kind:'ladybug',fill:'#ef767a',accent:'#263746'},{name:'Caracol',kind:'snail',fill:'#f2c995',accent:'#bf8e55'},{name:'Mariposa',kind:'butterfly',fill:'#e3c3ff',accent:'#8f68b7'},{name:'Delfín',kind:'dolphin',fill:'#a9dcf5',accent:'#559fc4'}\n];\nfunction animalSVG(index){const a=animalSpecs[index],s='#17324d',base=b=>`<svg class=\"avatar-svg\" viewBox=\"0 0 68 68\" aria-hidden=\"true\">${b}<\/svg>`;switch(a.kind){\ncase'cat':return base(`<circle cx=\"34\" cy=\"37\" r=\"18\" fill=\"${a.fill}\" stroke=\"${s}\" stroke-width=\"2.5\"/><path d=\"M20 27 L26 14 L31 27 M37 27 L42 14 L48 27\" fill=\"${a.accent}\" stroke=\"${s}\" stroke-width=\"2.5\"/><circle cx=\"28\" cy=\"36\" r=\"2.3\"/><circle cx=\"40\" cy=\"36\" r=\"2.3\"/><path d=\"M31 43 Q34 46 37 43\" fill=\"none\" stroke=\"${s}\" stroke-width=\"2.4\"/>`);\ncase'dog':return base(`<circle cx=\"34\" cy=\"38\" r=\"18\" fill=\"${a.fill}\" stroke=\"${s}\" }\" stroke-width=\"2\"/><circle cx=\"29\" cy=\"34\" r=\"2\"/><circle cx=\"39\" cy=\"34\" r=\"2\"/><path d=\"M34 40 q-2 13 6 13\" stroke=\"${s}\" stroke-width=\"5\" fill=\"none\" stroke-linecap=\"round\"/>`);\ncase'ladybug':return base(`<circle cx=\"34\" cy=\"38\" r=\"18\" fill=\"${a.fill}\" stroke=\"${s}\" stroke-width=\"2.5\"/><path d=\"M34 21 v34\" stroke=\"${s}\" stroke-width=\"3\"/><circle cx=\"28\" cy=\"31\" r=\"3\"/><circle cx=\"41\" cy=\"32\" r=\"3\"/><circle cx=\"27\" cy=\"44\" r=\"3\"/><circle cx=\"42\" cy=\"45\" r=\"3\"/>`);\ncase'snail':return base(`<ellipse cx=\"42\" cy=\"43\" rx=\"16\" ry=\"10\" fill=\"${a.fill}\" stroke=\"${s}\" stroke-width=\"2.5\"/><circle cx=\"28\" cy=\"36\" r=\"14\" fill=\"${a.accent}\" stroke=\"${s}\" stroke-width=\"2.5\"/><path d=\"M28 28 q10 8 0 16 q-7 -5 0 -10\" stroke=\"#fff\" stroke-width=\"2.5\" fill=\"none\"/>`);\ncase'butterfly':return base(`<ellipse cx=\"25\" cy=\"34\" rx=\"11\" ry=\"15\" fill=\"${a.fill}\" stroke=\"${s}\" stroke-width=\"2.5\"/><ellipse cx=\"43\" cy=\"34\" rx=\"11\" ry=\"15\" fill=\"${a.fill}\" stroke=\"${s}\" stroke-width=\"2.5\"/><ellipse cx=\"34\" cy=\"38\" rx=\"4\" ry=\"14\" fill=\"${a.accent}\"/>`);\ncase'dolphin':return base(`<path d=\"M13 42 q14 -23 38 -11 q5 2 7 -2 q-1 8 -9 9 q-8 9 -23 10 q-10 0 -13 -6z\" fill=\"${a.fill}\" stroke=\"${s}\" stroke-width=\"2.5\"/><path d=\"M30 31 l4 -10 l7 10\" fill=\"${a.accent}\" stroke=\"${s}\" stroke-width=\"2\"/><circle cx=\"46\" cy=\"32\" r=\"2\"/>`);\n}}\n\n\n\nconst levelDefs=[\n  {title:'Nivel 1 · Escucho sílabas',desc:'Escucha el sonido y reconoce ma, me, mi, mo y mu.',instruction:'Escucha con atención. Oirás una sílaba. Después, toca la sílaba que has escuchado.',questions:[\n    {audio:true,audioType:'sílaba',sound:'ma',prompt:'¿Qué sílaba has oído?',options:['ma','me','mi','mo','mu'],answer:'ma'},\n    {audio:true,audioType:'sílaba',sound:'me',prompt:'¿Qué sílaba has oído?',options:['ma','me','mi','mo','mu'],answer:'me'},\n    {audio:true,audioType:'sílaba',sound:'mi',prompt:'¿Qué sílaba has oído?',options:['ma','me','mi','mo','mu'],answer:'mi'},\n    {audio:true,audioType:'sílaba',sound:'mo',prompt:'¿Qué sílaba has oído?',options:['ma','me','mi','mo','mu'],answer:'mo'},\n    {audio:true,audioType:'sílaba',sound:'mu',prompt:'¿Qué sílaba has oído?',options:['ma','me','mi','mo','mu'],answer:'mu'}\n  ]},\n  {title:'Nivel 2 · Escucho más sílabas',desc:'Escucha y reconoce sílabas en mayúscula e inversas.',instruction:'Escucha con atención. Oirás una sílaba. Después, toca la sílaba que has escuchado.',questions:[\n    {audio:true,audioType:'sílaba',sound:'me',prompt:'¿Qué sílaba has oído?',options:['MI','ME','MA','MU'],answer:'ME'},\n    {audio:true,audioType:'sílaba',sound:'ma',prompt:'¿Qué sílaba has oído?',options:['MO','MU','MA','ME'],answer:'MA'},\n    {audio:true,audioType:'sílaba',sound:'am',prompt:'¿Qué sílaba has oído?',options:['em','im','am','om'],answer:'am'},\n    {audio:true,audioType:'sílaba',sound:'em',prompt:'¿Qué sílaba has oído?',options:['um','em','am','im'],answer:'em'},\n    {audio:true,audioType:'sílaba',sound:'om',prompt:'¿Qué sílaba has oído?',options:['im','um','om','em'],answer:'om'}\n  ]},\n  {title:'Nivel 3 · Escucho palabras',desc:'Escucha palabras de la cartilla y encuentra la misma palabra.',instruction:'Escucha con atención. Oirás una palabra. Después, toca la palabra que has escuchado.',questions:[\n    {audio:true,audioType:'palabra',sound:'mamá',prompt:'¿Qué palabra has oído?',options:['mimo','mamá','Mimí','momia'],answer:'mamá'},\n    {audio:true,audioType:'palabra',sound:'Mimí',prompt:'¿Qué palabra has oído?',options:['mamá','momia','Mimí','mimo'],answer:'Mimí'},\n    {audio:true,audioType:'palabra',sound:'mimo',prompt:'¿Qué palabra has oído?',options:['momia','mimo','mamá','Mimí'],answer:'mimo'},\n    {audio:true,audioType:'palabra',sound:'momia',prompt:'¿Qué palabra has oído?',options:['mimo','Mimí','momia','mamá'],answer:'momia'}\n  ]},\n  {title:'Nivel 4 · Escucho frases',desc:'Escucha una frase completa y encuentra la misma frase escrita.',instruction:'Escucha con atención. Oirás una frase. Después, toca la frase que has escuchado.',questions:[\n    {audio:true,audioType:'frase',sound:'Amo a mi mamá.',prompt:'¿Qué frase has oído?',options:['Amo a mi mamá.','Emma mima a Mimí.','Amo a Mimí.'],answer:'Amo a mi mamá.',longOptions:true},\n    {audio:true,audioType:'frase',sound:'Emma mima a Mimí.',prompt:'¿Qué frase has oído?',options:['Mimí mima a Emma.','Emma mima a Mimí.','Amo a mi mamá.'],answer:'Emma mima a Mimí.',longOptions:true},\n    {audio:true,audioType:'frase',sound:'Amo a mi mamá.',prompt:'Escucha otra vez y elige.',options:['Emma mima a Mimí.','Amo a Mimí.','Amo a mi mamá.'],answer:'Amo a mi mamá.',longOptions:true},\n    {audio:true,audioType:'frase',sound:'Emma mima a Mimí.',prompt:'Escucha otra vez y elige.',options:['Emma mima a Mimí.','Mamá mima a Mimí.','Amo a mi mamá.'],answer:'Emma mima a Mimí.',longOptions:true}\n  ]}\n];\n\nlet animals=animalSpecs.map((_,i)=>({id:i,active:false,level:1,turns:0,finished:false}));\nlet currentPlayerId=null;\nlet selectedByWheelId=null;\nlet spinning=false;\nlet wheelRotation=0;\nlet turnMistakes=0;\nlet questionIndex=0;\nlet currentQuestions=[];\nlet currentQuestion=null;\nlet questionLocked=false;\nlet preferredSpanishVoice=null;\nlet availableSpanishVoices=[];\nlet voiceAssignments=[null,null,null,null];\nlet selectedVoiceProfile=0;\nlet speechVolume=1; // 0.0 a 2.0 en la interfaz (0 % a 200 %)\nlet speechSequenceId=0;\nlet levelInstructionSpokenFor=0;\nconst wheelColors=['#8fd3ff','#ffd56a','#cdebb7','#f6c1ff','#ffd0a8','#d2c2ff','#ffe7a8','#bde8ff'];\nconst $=id=>document.getElementById(id);\nconst STORAGE_KEY='letraM_v13';\nconst AUDIO_STORAGE_KEY='letraM_audio_v13';\n\nfunction shuffle(a){return [...a].sort(()=>Math.random()-.5)}\nfunction activeUnfinished(){return animals.filter(a=>a.active&&!a.finished)}\nfunction priorityAnimals(){\n  const all=activeUnfinished();\n  if(!all.length)return[];\n  const min=Math.min(...all.map(a=>a.turns));\n  return all.filter(a=>a.turns===min);\n}\nfunction save(){\n  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({animals}))}catch(e){}\n}\nfunction load(){\n  try{\n    const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');\n    if(s&&Array.isArray(s.animals)&&s.animals.length===animals.length){\n      animals=s.animals.map((a,i)=>({\n        id:i,active:!!a.active,level:Math.min(4,Math.max(1,Number(a.level)||1)),\n        turns:Math.max(0,Number(a.turns)||0),finished:!!a.finished\n      }));\n    }\n  }catch(e){}\n}\n\nfunction showPage(which){\n  const players=which==='players';\n  $('playersPage').classList.toggle('active',players);\n  $('activityPage').classList.toggle('active',!players);\n  $('playersTab').classList.toggle('active',players);\n  $('playersTab').classList.toggle('secondary',!players);\n  $('activityTab').classList.toggle('active',!players);\n  $('activityTab').classList.toggle('secondary',players);\n  if(players)drawWheel();\n  else renderActivityState();\n}\n\nfunction toggleAnimal(id){\n  if(spinning||id===currentPlayerId)return;\n  const a=animals[id];\n  a.active=!a.active;\n  // Al quitar un animal se limpia una selección pendiente de ese mismo animal.\n  if(!a.active&&selectedByWheelId===id)selectedByWheelId=null;\n  save();renderAll();\n}\n\nfunction renderRoster(){\n  const roster=$('animalRoster');roster.innerHTML='';\n  const priorityIds=new Set(priorityAnimals().map(a=>a.id));\n  animals.forEach(a=>{\n    const b=document.createElement('button');b.type='button';\n    let state=!a.active?'inactive':a.finished?'finished':a.id===currentPlayerId?'current':'pending';\n    b.className=`animal-card ${state}${priorityIds.has(a.id)&&a.active&&!a.finished?' priority':''}`;\n    const mark=a.finished?'✓':a.id===currentPlayerId?'▶':a.active?'•':'';\n    b.innerHTML=`${animalSVG(a.id)}<span class=\"animal-label\">${animalSpecs[a.id].name}<\/span><span class=\"animal-meta\">${a.active?(a.finished?'FINAL':`N${a.level} · T${a.turns}`):'LIBRE'}<\/span><span class=\"status-dot\">${mark}<\/span>`;\n    b.addEventListener('click',()=>toggleAnimal(a.id));\n    roster.appendChild(b);\n  });\n}\n\nfunction renderCurrent(){\n  const box=$('currentTurn');\n  if(currentPlayerId!==null){\n    const a=animals[currentPlayerId];\n    box.innerHTML=`${animalSVG(a.id)}<div><strong>JUEGA AHORA: ${animalSpecs[a.id].name}<\/strong><div class=\"small\">Nivel ${a.level} · Fallos: ${turnMistakes}/2<\/div><\/div>`;\n  }else if(selectedByWheelId!==null){\n    const a=animals[selectedByWheelId];\n    box.innerHTML=`${animalSVG(a.id)}<div><strong>ELEGIDO: ${animalSpecs[a.id].name}<\/strong><div class=\"small\">Nivel ${a.level} · pulsa COMENZAR<\/div><\/div>`;\n  }else{\n    const p=priorityAnimals(),active=animals.filter(a=>a.active).length;\n    box.innerHTML=`<span><strong>Sin turno.<\/strong> ${active} jugador${active===1?'':'es'} activo${active===1?'':'s'} · ${p.length?`${p.length} con prioridad`:'toca un animalito para incorporarlo'}.<\/span>`;\n  }\n}\n\nfunction renderPriority(){\n  const p=priorityAnimals(),box=$('priorityInfo');\n  if(!animals.some(a=>a.active)){box.innerHTML='<strong>Prioridad<\/strong><br>Toca varios animalitos para empezar.';return}\n  if(!p.length){box.innerHTML='<strong>Partida completada<\/strong><br>Todos los jugadores activos han llegado al final.';return}\n  const min=p[0].turns;\n  if(min===0)box.innerHTML=`<strong>Primero: quienes no han jugado<\/strong><br>${p.length} animalito${p.length===1?'':'s'} con 0 turnos.`;\n  else box.innerHTML=`<strong>Después: menos turnos<\/strong><br>${p.length} animalito${p.length===1?'':'s'} con ${min} turno${min===1?'':'s'}.`;\n}\n\nfunction levelToPercent(level){\n  const safe=Math.max(1,Math.min(4,Number(level)||1));\n  return ((safe-1)/3)*88+6;\n}\n\nfunction renderJourney(actorOverride=null,moverLevelOverride=null,fillLevelOverride=null,bubbleOverride=''){\n  const wrap=$('journeyWrap'); if(!wrap)return;\n  const actor=actorOverride||(currentPlayerId!==null?animals[currentPlayerId]:(selectedByWheelId!==null?animals[selectedByWheelId]:null));\n  const moverLevel=actor?Math.max(1,Math.min(4,moverLevelOverride||actor.level||1)):0;\n  const fillLevel=actor?Math.max(1,Math.min(4,fillLevelOverride||moverLevel)):0;\n  wrap.innerHTML='';\n  const line=document.createElement('div');\n  line.className='journey-line';\n  const fill=document.createElement('div');\n  fill.className='journey-fill';\n  fill.style.width=actor?`calc(${levelToPercent(fillLevel)}% - 6%)`:'0';\n  line.appendChild(fill);\n  const labels=['Nivel 1','Nivel 2','Nivel 3','Meta · Nivel 4'];\n  labels.forEach((label,idx)=>{\n    const stop=document.createElement('div');\n    const stepNo=idx+1;\n    const doneUntil=Math.max(0,fillLevel-1);\n    stop.className='journey-stop '+(actor?(stepNo<=doneUntil?'done':stepNo===moverLevel?'active':'locked'):'locked')+(stepNo===4?' goal':'');\n    const node=document.createElement('div'); node.className='journey-node'; node.textContent=stepNo===4?'🏁':String(stepNo);\n    const caption=document.createElement('div'); caption.className='journey-label school-script'; caption.textContent=label;\n    stop.appendChild(node); stop.appendChild(caption); line.appendChild(stop);\n  });\n  wrap.appendChild(line);\n  if(actor){\n    const mover=document.createElement('div'); mover.className='journey-animal';\n    mover.style.left=`${levelToPercent(moverLevel)}%`;\n    const state=bubbleOverride || (actor.finished?'¡Meta!':`Va por el nivel ${moverLevel}`);\n    mover.innerHTML=`${animalSVG(actor.id)}<div class=\"bubble\">${state}<\/div>`;\n    wrap.appendChild(mover);\n  }else{\n    wrap.innerHTML += \"<div class='small school-script' style='margin-top:8px;text-align:center;font-size:16px'>Elige un animalito para ver su camino hasta la meta.<\/div>\";\n  }\n}\n\nfunction animateJourneyAdvance(fromLevel,toLevel,onDone){\n  if(currentPlayerId===null){ if(onDone)onDone(); return; }\n  const actor=animals[currentPlayerId];\n  renderJourney(actor,fromLevel,fromLevel,`¡Nivel ${fromLevel} superado!`);\n  const wrap=$('journeyWrap');\n  const mover=wrap.querySelector('.journey-animal');\n  const fill=wrap.querySelector('.journey-fill');\n  playAdvanceSound();\n  requestAnimationFrame(()=>{\n    if(mover){\n      mover.classList.add('moving');\n      mover.style.left=`${levelToPercent(toLevel)}%`;\n      const bubble=mover.querySelector('.bubble');\n      if(bubble)bubble.textContent=toLevel===4?'¡Hasta la meta!':`Avanza al nivel ${toLevel}`;\n    }\n    if(fill)fill.style.width=`calc(${levelToPercent(toLevel)}% - 6%)`;\n  });\n  setTimeout(()=>{\n    renderJourney();\n    renderActivityHeader();\n    if(onDone)onDone();\n  },1200);\n}\n\nfunction renderActivityHeader(){\n  const track=$('progressTrack');track.innerHTML='';\n  const level=currentPlayerId!==null?animals[currentPlayerId].level:(selectedByWheelId!==null?animals[selectedByWheelId].level:0);\n  for(let i=1;i<=4;i++){\n    const s=document.createElement('div');\n    s.className='step '+(i<level?'done':i===level?'active':'locked');\n    s.textContent=`Nivel ${i}`;track.appendChild(s);\n  }\n  renderJourney();\n  if(currentPlayerId!==null){\n    const a=animals[currentPlayerId],def=levelDefs[a.level-1];\n    $('levelTitle').textContent=def.title;$('levelDesc').textContent=def.desc;\n    $('playerBadge').innerHTML=`${animalSVG(a.id)}<div><strong>${animalSpecs[a.id].name}<\/strong><div class=\"mistakes\">Fallos: <span class=\"mark ${turnMistakes>=1?'used':''}\">×<\/span><span class=\"mark ${turnMistakes>=2?'used':''}\">×<\/span><\/div><\/div>`;\n    $('changePlayerBtn').textContent='CEDER TURNO';\n  }else if(selectedByWheelId!==null){\n    const a=animals[selectedByWheelId];\n    $('levelTitle').textContent='Jugador preparado';$('levelDesc').textContent=`${animalSpecs[a.id].name} está en el nivel ${a.level}.`;\n    $('playerBadge').innerHTML=`${animalSVG(a.id)}<div><strong>${animalSpecs[a.id].name}<\/strong><div class=\"small\">Nivel ${a.level}<\/div><\/div>`;\n    $('changePlayerBtn').textContent='ELEGIR OTRO';\n  }else{\n    $('levelTitle').textContent='Niveles y actividad';$('levelDesc').textContent='La ruleta debe elegir primero a un jugador.';\n    $('playerBadge').innerHTML='<strong>Sin jugador<\/strong>';\n    $('changePlayerBtn').textContent='IR A LA RULETA';\n  }\n}\n\nfunction renderActivityState(){\n  const waiting=$('waitingView'),level=$('levelView');\n  const hasActiveTurn=currentPlayerId!==null;\n  waiting.hidden=hasActiveTurn;\n  level.hidden=!hasActiveTurn;\n  if(hasActiveTurn)return;\n\n  const hasSelected=selectedByWheelId!==null;\n  $('waitingDefault').classList.toggle('hidden',hasSelected);\n  $('waitingSelected').classList.toggle('show',hasSelected);\n  if(hasSelected){\n    const a=animals[selectedByWheelId];\n    $('waitingAvatar').innerHTML=animalSVG(a.id);\n    $('waitingName').textContent=`${animalSpecs[a.id].name} ha sido elegido`;\n    $('waitingLevel').textContent=`Nivel ${a.level}. Pulsa COMENZAR ACTIVIDAD.`;\n  }\n}\n\nfunction renderAll(){\n  renderRoster();renderCurrent();renderPriority();renderActivityHeader();renderActivityState();updateButtons();drawWheel();\n}\n\nfunction updateButtons(){\n  const candidates=priorityAnimals();\n  $('spinBtn').disabled=spinning||candidates.length===0||currentPlayerId!==null;\n  $('spinBtn').textContent=spinning?'GIRANDO...':'GIRAR';\n  $('startTurnBtn').disabled=spinning||selectedByWheelId===null||currentPlayerId!==null;\n  $('startTurnBtn').textContent='COMENZAR';\n  $('waitingStartBtn').disabled=spinning||selectedByWheelId===null||currentPlayerId!==null;\n}\n\nfunction normalizeAngle(a){\n  const two=Math.PI*2;\n  return ((a%two)+two)%two;\n}\n\nfunction wheelIndexAtPointer(rotation,count){\n  if(!count)return -1;\n  const slice=Math.PI*2/count;\n  // El puntero está exactamente a las 12. En drawWheel el primer sector\n  // empieza en rotation - PI/2, por lo que -rotation determina el sector bajo la flecha.\n  return Math.floor(normalizeAngle(-rotation)/slice)%count;\n}\n\nfunction drawWheel(rotation=wheelRotation){\n  const c=$('wheel'),ctx=c.getContext('2d'),w=c.width,h=c.height,cx=w/2,cy=h/2,r=176;\n  ctx.clearRect(0,0,w,h);\n  const p=priorityAnimals();\n  if(!p.length){\n    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#f4f7fa';ctx.fill();ctx.strokeStyle='#c4def8';ctx.lineWidth=7;ctx.stroke();\n    ctx.fillStyle='#55708a';ctx.textAlign='center';ctx.font='bold 22px Arial';ctx.fillText(animals.some(a=>a.active)?'Sin candidatos':'Elige animalitos',cx,cy);return;\n  }\n  const slice=Math.PI*2/p.length;\n  p.forEach((a,i)=>{\n    const st=rotation+i*slice-Math.PI/2,en=st+slice;\n    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,st,en);ctx.closePath();ctx.fillStyle=wheelColors[i%wheelColors.length];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();\n    ctx.save();ctx.translate(cx,cy);ctx.rotate(st+slice/2);ctx.textAlign='right';ctx.fillStyle='#17324d';ctx.font='bold 15px Arial';ctx.fillText(animalSpecs[a.id].name,r-14,5);ctx.restore();\n  });\n  ctx.beginPath();ctx.arc(cx,cy,34,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#c4def8';ctx.lineWidth=5;ctx.stroke();\n  ctx.fillStyle='#17324d';ctx.textAlign='center';ctx.font='bold 19px Arial';ctx.fillText('M',cx,cy+7);\n}\n\nfunction spinWheel(){\n  if(spinning||currentPlayerId!==null)return;\n  const p=priorityAnimals();\n  if(!p.length){\n    $('wheelResult').innerHTML=`<div><strong>${animals.some(a=>a.active)?'No hay candidatos':'Primero elige animalitos'}<\/strong><span>${animals.some(a=>a.active)?'Los jugadores activos han terminado.':'Toca uno o varios animalitos.'}<\/span><\/div>`;\n    updateButtons();return;\n  }\n  spinning=true;selectedByWheelId=null;\n  $('wheelResult').innerHTML='<div><strong>Girando...<\/strong><span>Buscando al siguiente jugador.<\/span><\/div>';\n  renderCurrent();renderActivityHeader();renderActivityState();updateButtons();\n\n  const desiredIndex=Math.floor(Math.random()*p.length);\n  const slice=Math.PI*2/p.length;\n  const start=wheelRotation;\n  // Centro exacto del sector elegido bajo la flecha superior.\n  const desiredFinal=-(desiredIndex*slice+slice/2);\n  const extra=normalizeAngle(desiredFinal-normalizeAngle(start));\n  const target=start+Math.PI*2*6+extra;\n  const dur=1700,t0=performance.now();\n\n  function step(now){\n    const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,3),a=start+(target-start)*e;drawWheel(a);\n    if(t<1){requestAnimationFrame(step);return;}\n    wheelRotation=normalizeAngle(target);\n    // La selección se calcula desde la posición REAL del puntero, no desde el sorteo previo.\n    const actualIndex=wheelIndexAtPointer(wheelRotation,p.length);\n    const chosen=p[actualIndex];\n    selectedByWheelId=chosen.id;\n    spinning=false;\n    drawWheel(wheelRotation);\n    $('wheelResult').innerHTML=`${animalSVG(chosen.id)}<div><strong>${animalSpecs[chosen.id].name}<\/strong><span>Nivel ${chosen.level} · la flecha señala este mismo animal.<\/span><\/div>`;\n    renderCurrent();renderActivityHeader();renderActivityState();updateButtons();\n  }\n  requestAnimationFrame(step);\n}\n\nfunction startSelectedTurn(){\n  if(spinning||currentPlayerId!==null||selectedByWheelId===null)return;\n  const chosenId=selectedByWheelId;\n  currentPlayerId=chosenId;\n  selectedByWheelId=null;\n  const a=animals[currentPlayerId];\n  a.turns++;\n  turnMistakes=0;questionIndex=0;currentQuestions=[];currentQuestion=null;questionLocked=false;\n  save();\n  showPage('activity');\n  startLevel(a.level);\n  renderAll();\n}\n\nfunction startLevel(level){\n  const def=levelDefs[level-1];\n  if(!def||currentPlayerId===null)return;\n  currentQuestions=shuffle(def.questions);questionIndex=0;turnMistakes=0;currentQuestion=null;questionLocked=false;\n  levelInstructionSpokenFor=0;\n  $('waitingView').hidden=true;\n  $('levelView').hidden=false;\n  renderActivityHeader();\n  showQuestion();\n  // La explicación de cada nivel se escucha una sola vez al entrar.\n  setTimeout(()=>speakLevelInstruction(true),220);\n}\n\nconst voiceProfiles=[\n  {label:'FEMENINA 1',tone:'Clara',gender:'female',pitch:1.00,rate:.92,names:/elvira|helena|luc[ií]a|monica|m[oó]nica|dalia|sabina|paulina|paloma|conchita|laura|ximena/i},\n  {label:'FEMENINA 2',tone:'Cálida',gender:'female',pitch:1.03,rate:.90,names:/sabina|dalia|paulina|luc[ií]a|elvira|helena|m[oó]nica|paloma|laura|ximena/i},\n  {label:'MASCULINA 1',tone:'Clara',gender:'male',pitch:.96,rate:.92,names:/[aá]lvaro|alvaro|jorge|pablo|diego|raul|ra[uú]l|enrique|antonio/i},\n  {label:'MASCULINA 2',tone:'Cálida',gender:'male',pitch:.93,rate:.90,names:/jorge|pablo|diego|[aá]lvaro|alvaro|enrique|antonio|raul|ra[uú]l/i}\n];\n\nfunction voiceQualityScore(v){\n  const name=(v.name||'').toLowerCase(),lang=(v.lang||'').toLowerCase();\n  let n=0;\n  if(lang==='es-es')n+=160; else if(lang.startsWith('es-'))n+=115; else if(lang.startsWith('es'))n+=90;\n  if(/natural|neural/.test(name))n+=150;\n  if(/premium|enhanced|online/.test(name))n+=90;\n  if(/microsoft/.test(name))n+=55;\n  if(/google/.test(name))n+=45;\n  if(/compact|espeak/.test(name))n-=120;\n  return n;\n}\n\nfunction assignVoiceProfiles(){\n  if(!('speechSynthesis' in window))return;\n  const all=window.speechSynthesis.getVoices()||[];\n  availableSpanishVoices=all.filter(v=>(v.lang||'').toLowerCase().startsWith('es'));\n  if(!availableSpanishVoices.length){voiceAssignments=[null,null,null,null];preferredSpanishVoice=null;renderVoiceSettings();return;}\n  const ranked=[...availableSpanishVoices].sort((a,b)=>voiceQualityScore(b)-voiceQualityScore(a));\n  const used=new Set();\n  voiceAssignments=voiceProfiles.map(profile=>{\n    const matching=ranked.filter(v=>profile.names.test(v.name||''));\n    let choice=matching.find(v=>!used.has(v.name+'|'+v.lang))||matching[0];\n    if(!choice) choice=ranked.find(v=>!used.has(v.name+'|'+v.lang))||ranked[0];\n    if(choice)used.add(choice.name+'|'+choice.lang);\n    return choice||null;\n  });\n  preferredSpanishVoice=voiceAssignments[selectedVoiceProfile]||ranked[0]||null;\n  renderVoiceSettings();\n}\n\nfunction loadAudioSettings(){\n  try{\n    const cfg=JSON.parse(localStorage.getItem(AUDIO_STORAGE_KEY)||'null');\n    if(cfg){\n      selectedVoiceProfile=Math.max(0,Math.min(3,Number(cfg.profile)||0));\n      speechVolume=Math.max(0,Math.min(2,Number(cfg.volume)));\n      if(!Number.isFinite(speechVolume))speechVolume=1;\n    }\n  }catch(e){speechVolume=1;selectedVoiceProfile=0}\n}\n\nfunction saveAudioSettings(){\n  try{localStorage.setItem(AUDIO_STORAGE_KEY,JSON.stringify({profile:selectedVoiceProfile,volume:speechVolume}))}catch(e){}\n}\n\nfunction getSpanishVoice(){\n  return voiceAssignments[selectedVoiceProfile]||preferredSpanishVoice||availableSpanishVoices[0]||null;\n}\n\nfunction renderVoiceSettings(){\n  const grid=$('voiceGrid'); if(!grid)return;\n  grid.innerHTML='';\n  voiceProfiles.forEach((profile,i)=>{\n    const v=voiceAssignments[i];\n    const b=document.createElement('button');\n    b.type='button';b.className='voice-option'+(i===selectedVoiceProfile?' selected':'');\n    const engine=v?`${v.name} · ${v.lang}`:'Mejor voz española disponible';\n    b.innerHTML=`<strong>${profile.label} · ${profile.tone}<\/strong><span>${engine}<\/span>`;\n    b.addEventListener('click',()=>{\n      selectedVoiceProfile=i;preferredSpanishVoice=voiceAssignments[i]||availableSpanishVoices[0]||null;saveAudioSettings();renderVoiceSettings();testSelectedVoice();\n    });\n    grid.appendChild(b);\n  });\n  if($('volumeSlider')){$('volumeSlider').value=String(Math.round(speechVolume*100));$('volumeValue').textContent=`${Math.round(speechVolume*100)}%`;}\n}\n\nfunction openVoiceSettings(){renderVoiceSettings();$('voiceOverlay').classList.add('open')}\nfunction closeVoiceSettings(){stopSpeech();$('voiceOverlay').classList.remove('open')}\n\nfunction stopSpeech(){\n  speechSequenceId++;\n  if('speechSynthesis' in window){try{window.speechSynthesis.cancel();}catch(e){}}\n}\n\nfunction speakSequence(chunks,onDone,profileIndex=selectedVoiceProfile){\n  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){\n    if(onDone)onDone();return;\n  }\n  stopSpeech();\n  const seq=++speechSequenceId;\n  const items=chunks.filter(x=>x&&x.text);\n  const profile=voiceProfiles[profileIndex]||voiceProfiles[0];\n  let i=0;\n  const next=()=>{\n    if(seq!==speechSequenceId)return;\n    if(i>=items.length){if(onDone)onDone();return;}\n    const item=items[i++];\n    const u=new SpeechSynthesisUtterance(item.text);\n    u.lang='es-ES';\n    u.rate=Math.max(.48,Math.min(.95,(item.rate||.74)*profile.rate));\n    u.pitch=Math.max(.8,Math.min(1.15,(item.pitch||1)*profile.pitch));\n    u.volume=Math.max(0,Math.min(1,speechVolume)); // Web Speech API admite 0..1\n    const voice=voiceAssignments[profileIndex]||getSpanishVoice(); if(voice)u.voice=voice;\n    u.onend=()=>{if(seq===speechSequenceId)setTimeout(next,item.pause||260)};\n    u.onerror=()=>{if(seq===speechSequenceId)setTimeout(next,item.pause||180)};\n    try{window.speechSynthesis.resume();window.speechSynthesis.speak(u)}catch(e){next()}\n  };\n  next();\n}\n\nfunction testSelectedVoice(){\n  const p=voiceProfiles[selectedVoiceProfile];\n  speakSequence([\n    {text:'Hola. Esta es mi voz para el juego de la letra eme.',rate:.74,pause:450},\n    {text:'Escucha con calma.',rate:.70,pause:320}\n  ],null,selectedVoiceProfile);\n}\n\nfunction speakLevelInstruction(continueWithAudio=false){\n  if(currentPlayerId===null)return;\n  const a=animals[currentPlayerId];\n  const def=levelDefs[a.level-1];\n  if(!def)return;\n  $('instructionText').textContent=def.instruction;\n  levelInstructionSpokenFor=a.level;\n  // Nivel 4 se lee más lento para facilitar la comprensión de frases.\n  const instructionRate = a.level===4 ? .64 : .72;\n  const instructionPause = a.level===4 ? 980 : 760;\n  speakSequence([{text:def.instruction,rate:instructionRate,pitch:1,pause:instructionPause}],()=>{\n    if(continueWithAudio&&currentQuestion&&currentQuestion.audio){setTimeout(()=>speakTarget(currentQuestion.sound,currentQuestion.audioType||'sílaba'),420);}\n  });\n}\n\nfunction speakTarget(text,type='sílaba'){\n  const status=$('audioStatus');\n  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){\n    status.textContent='No se puede reproducir la voz. Usa Chrome o Edge.';return;\n  }\n  const kind=String(type||'sílaba').toLowerCase();\n  const noun=kind==='palabra'?'palabra':kind==='frase'?'frase':'sílaba';\n  status.textContent=`Escucha la ${noun} con atención...`;\n  const targetRate=noun==='frase'?.56:(noun==='palabra'?.66:.58);\n  const intro=noun==='frase'?'Escucha la frase.':noun==='palabra'?'Escucha la palabra.':'Escucha.';\n  const introRate=noun==='frase'?.64:.72;\n  const targetPause=noun==='frase'?620:380;\n  speakSequence([\n    {text:intro,rate:introRate,pitch:1,pause:noun==='frase'?760:560},\n    {text:String(text),rate:targetRate,pitch:1,pause:targetPause}\n  ],()=>{status.textContent=`Ahora toca la ${noun} que has oído.`});\n}\nfunction playCurrentAudio(){if(currentQuestion&&currentQuestion.audio)speakTarget(currentQuestion.sound,currentQuestion.audioType||'sílaba')}\n\nfunction showQuestion(){\n  if(currentPlayerId===null)return;\n  const a=animals[currentPlayerId];\n  if(questionIndex>=currentQuestions.length){levelPassed();return}\n  const q=currentQuestions[questionIndex];currentQuestion=q;questionLocked=false;\n  $('questionKicker').textContent=q.audio?`ESCUCHA ${questionIndex+1} DE ${currentQuestions.length}`:`PREGUNTA ${questionIndex+1} DE ${currentQuestions.length}`;\n  const def=levelDefs[a.level-1];\n  $('instructionText').textContent=def&&def.instruction?def.instruction:'Escucha o lee con calma y elige la respuesta correcta.';\n  $('questionPrompt').textContent=q.prompt;\n  $('feedback').textContent='';$('feedback').className='feedback';\n  $('audioZone').classList.toggle('show',!!q.audio);\n  $('questionMain').style.display=q.audio?'none':'block';\n  $('questionMain').textContent=q.main||'';\n  $('questionMain').className='question-main'+(q.sentence?' sentence':'');\n  if(q.audio){const noun=q.audioType==='palabra'?'palabra':q.audioType==='frase'?'frase':'sílaba';$('audioStatus').textContent=`Escucha y después toca la ${noun}.`;}\n  const ch=$('questionChoices');ch.innerHTML='';\n  shuffle(q.options).forEach(opt=>{\n    const b=document.createElement('button');b.type='button';b.className='choice'+(q.longOptions?' long':'');b.textContent=opt;\n    b.addEventListener('click',()=>answerQuestion(opt,b,q.answer));ch.appendChild(b);\n  });\n  // En la primera pregunta de cada nivel, la explicación hablada va primero.\n  // Después, todas las preguntas reproducen automáticamente el objetivo sonoro.\n  if(q.audio && levelInstructionSpokenFor===a.level)setTimeout(playCurrentAudio,300);\n}\n\n// Efectos sonoros del juego: cortinilla brillante al acertar y aviso estridente al fallar.\nlet sfxContext=null;\nfunction getSfxContext(){\n  try{\n    if(!sfxContext){\n      const Ctx=window.AudioContext||window.webkitAudioContext;\n      if(!Ctx)return null;\n      sfxContext=new Ctx();\n    }\n    if(sfxContext.state==='suspended')sfxContext.resume();\n    return sfxContext;\n  }catch(e){return null}\n}\nfunction sfxMasterGain(ctx,peak=.26){\n  const g=ctx.createGain();\n  const now=ctx.currentTime;\n  const boost=Math.max(.15,Math.min(1.35,speechVolume||1));\n  g.gain.setValueAtTime(Math.min(.9,peak*boost),now);\n  g.connect(ctx.destination);\n  return g;\n}\nfunction playCorrectSound(){\n  const ctx=getSfxContext(); if(!ctx)return;\n  const now=ctx.currentTime;\n  const master=sfxMasterGain(ctx,.24);\n  const notes=[659.25,783.99,987.77,1318.51];\n  notes.forEach((freq,i)=>{\n    const start=now+i*.085;\n    const osc=ctx.createOscillator();\n    const gain=ctx.createGain();\n    osc.type=i<2?'sine':'triangle';\n    osc.frequency.setValueAtTime(freq,start);\n    gain.gain.setValueAtTime(.0001,start);\n    gain.gain.exponentialRampToValueAtTime(.22,start+.025);\n    gain.gain.exponentialRampToValueAtTime(.0001,start+.34);\n    osc.connect(gain); gain.connect(master);\n    osc.start(start); osc.stop(start+.36);\n  });\n  // pequeño brillo final\n  const sparkle=ctx.createOscillator();\n  const sg=ctx.createGain();\n  sparkle.type='sine'; sparkle.frequency.setValueAtTime(1760,now+.30);\n  sg.gain.setValueAtTime(.0001,now+.30);\n  sg.gain.exponentialRampToValueAtTime(.12,now+.325);\n  sg.gain.exponentialRampToValueAtTime(.0001,now+.55);\n  sparkle.connect(sg); sg.connect(master); sparkle.start(now+.30); sparkle.stop(now+.56);\n}\nfunction playWrongSound(){\n  const ctx=getSfxContext(); if(!ctx)return;\n  const now=ctx.currentTime;\n  const master=sfxMasterGain(ctx,.34);\n  const osc=ctx.createOscillator();\n  const gain=ctx.createGain();\n  osc.type='sawtooth';\n  osc.frequency.setValueAtTime(210,now);\n  osc.frequency.exponentialRampToValueAtTime(95,now+.34);\n  gain.gain.setValueAtTime(.0001,now);\n  gain.gain.exponentialRampToValueAtTime(.30,now+.018);\n  gain.gain.exponentialRampToValueAtTime(.0001,now+.38);\n  osc.connect(gain); gain.connect(master);\n  osc.start(now); osc.stop(now+.40);\n  const osc2=ctx.createOscillator();\n  const gain2=ctx.createGain();\n  osc2.type='square'; osc2.frequency.setValueAtTime(330,now+.04);\n  osc2.frequency.exponentialRampToValueAtTime(145,now+.28);\n  gain2.gain.setValueAtTime(.0001,now+.04);\n  gain2.gain.exponentialRampToValueAtTime(.13,now+.06);\n  gain2.gain.exponentialRampToValueAtTime(.0001,now+.31);\n  osc2.connect(gain2); gain2.connect(master);\n  osc2.start(now+.04); osc2.stop(now+.32);\n}\nfunction playAdvanceSound(){\n  const ctx=getSfxContext(); if(!ctx)return;\n  const now=ctx.currentTime;\n  const master=sfxMasterGain(ctx,.28);\n  [523.25,659.25,783.99,1046.5].forEach((freq,i)=>{\n    const start=now+i*.12;\n    const osc=ctx.createOscillator();\n    const gain=ctx.createGain();\n    osc.type=i<2?'triangle':'sine';\n    osc.frequency.setValueAtTime(freq,start);\n    gain.gain.setValueAtTime(.0001,start);\n    gain.gain.exponentialRampToValueAtTime(.18,start+.03);\n    gain.gain.exponentialRampToValueAtTime(.0001,start+.28);\n    osc.connect(gain); gain.connect(master);\n    osc.start(start); osc.stop(start+.30);\n  });\n}\nfunction playGoalSound(){\n  const ctx=getSfxContext(); if(!ctx)return;\n  const now=ctx.currentTime;\n  const master=sfxMasterGain(ctx,.30);\n\n  // 1) FANFARRIA BRILLANTE · aprox. 1,5 s\n  const chords=[\n    {t:0.00,notes:[523.25,659.25,783.99]},\n    {t:0.28,notes:[659.25,783.99,987.77]},\n    {t:0.56,notes:[783.99,987.77,1174.66]},\n    {t:0.86,notes:[1046.50,1318.51,1567.98]}\n  ];\n  chords.forEach((ch,ci)=>{\n    ch.notes.forEach((freq,ni)=>{\n      const start=now+ch.t;\n      const osc=ctx.createOscillator();\n      const gain=ctx.createGain();\n      osc.type=ni===0?'triangle':'sine';\n      osc.frequency.setValueAtTime(freq,start);\n      gain.gain.setValueAtTime(.0001,start);\n      gain.gain.exponentialRampToValueAtTime(ci===3?.13:.10,start+.025);\n      gain.gain.exponentialRampToValueAtTime(.0001,start+(ci===3?.62:.30));\n      osc.connect(gain); gain.connect(master);\n      osc.start(start); osc.stop(start+(ci===3?.66:.34));\n    });\n  });\n\n  // 2) VÍTORES · pequeñas voces ascendentes sintetizadas\n  [0.70,1.15,1.62,2.05,2.55].forEach((offset,i)=>{\n    const osc=ctx.createOscillator();\n    const gain=ctx.createGain();\n    const start=now+offset;\n    osc.type='sine';\n    const base=[310,360,330,390,350][i];\n    osc.frequency.setValueAtTime(base,start);\n    osc.frequency.exponentialRampToValueAtTime(base*1.75,start+.32);\n    osc.frequency.exponentialRampToValueAtTime(base*1.45,start+.52);\n    gain.gain.setValueAtTime(.0001,start);\n    gain.gain.exponentialRampToValueAtTime(.055,start+.055);\n    gain.gain.exponentialRampToValueAtTime(.0001,start+.56);\n    osc.connect(gain); gain.connect(master);\n    osc.start(start); osc.stop(start+.58);\n  });\n\n  // 3) APLAUSOS · ráfagas de ruido filtrado durante unos 3 segundos\n  const sr=ctx.sampleRate;\n  const noiseBuffer=ctx.createBuffer(1,Math.floor(sr*.16),sr);\n  const data=noiseBuffer.getChannelData(0);\n  for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length);\n  for(let i=0;i<28;i++){\n    const start=now+.55+i*.105+(Math.random()*.035);\n    const src=ctx.createBufferSource();\n    src.buffer=noiseBuffer;\n    const band=ctx.createBiquadFilter();\n    band.type='bandpass';\n    band.frequency.value=1300+Math.random()*1700;\n    band.Q.value=.7+Math.random()*.9;\n    const g=ctx.createGain();\n    g.gain.setValueAtTime(.0001,start);\n    g.gain.exponentialRampToValueAtTime(.035+Math.random()*.035,start+.012);\n    g.gain.exponentialRampToValueAtTime(.0001,start+.13);\n    src.connect(band); band.connect(g); g.connect(master);\n    src.start(start); src.stop(start+.15);\n  }\n\n  // Brillo final para cerrar la celebración cerca de los 4 segundos\n  [1318.51,1567.98,2093.00].forEach((freq,i)=>{\n    const start=now+3.18+i*.10;\n    const osc=ctx.createOscillator();\n    const gain=ctx.createGain();\n    osc.type='sine'; osc.frequency.setValueAtTime(freq,start);\n    gain.gain.setValueAtTime(.0001,start);\n    gain.gain.exponentialRampToValueAtTime(.075,start+.025);\n    gain.gain.exponentialRampToValueAtTime(.0001,start+.42);\n    osc.connect(gain); gain.connect(master);\n    osc.start(start); osc.stop(start+.44);\n  });\n}\n\nfunction answerQuestion(opt,btn,correct){\n  if(questionLocked||currentPlayerId===null)return;\n  questionLocked=true;\n  const buttons=[...$('questionChoices').querySelectorAll('.choice')];buttons.forEach(b=>b.disabled=true);\n  const fb=$('feedback');\n  if(opt===correct){\n    playCorrectSound();\n    btn.classList.add('correct');fb.textContent='¡Correcto!';fb.className='feedback good';\n    questionIndex++;\n    setTimeout(showQuestion,720);\n  }else{\n    playWrongSound();\n    btn.classList.add('wrong');const right=buttons.find(b=>b.textContent===correct);if(right)right.classList.add('correct');\n    turnMistakes++;renderActivityHeader();\n    if(turnMistakes>=2){\n      fb.textContent='Segundo fallo. El turno termina.';fb.className='feedback bad';\n      setTimeout(()=>endTurn('mistakes'),900);\n    }else{\n      fb.textContent='Primer fallo. Continúa.';fb.className='feedback bad';\n      questionIndex++;\n      setTimeout(showQuestion,850);\n    }\n  }\n}\n\nfunction levelPassed(){\n  if(currentPlayerId===null)return;\n  const a=animals[currentPlayerId];\n  if(a.level<4){\n    const old=a.level; a.level++; save();\n    renderActivityHeader();\n    animateJourneyAdvance(old,a.level,()=>{\n      showTurnMessage(`${animalSpecs[a.id].name} supera el nivel ${old}.`,`Continúa en el nivel ${a.level}. Los fallos vuelven a cero.`,()=>startLevel(a.level),'SIGUIENTE NIVEL');\n    });\n  }else{\n    a.finished=true; save(); renderActivityHeader(); playGoalSound(); endTurn('finished');\n  }\n}\n\nfunction showTurnMessage(title,text,after,label){\n  const a=animals[currentPlayerId];\n  $('turnCard').innerHTML=`${animalSVG(a.id)}<h2>${title}<\/h2><p>${text}<\/p><button class=\"btn good\" id=\"continueTurnBtn\" type=\"button\">${label||'CONTINUAR'}<\/button>`;\n  $('turnOverlay').classList.add('open');\n  $('continueTurnBtn').addEventListener('click',()=>{$('turnOverlay').classList.remove('open');after()},{once:true});\n}\n\nfunction clearTurnState(){\n  stopSpeech();\n  currentPlayerId=null;selectedByWheelId=null;currentQuestion=null;currentQuestions=[];questionIndex=0;turnMistakes=0;questionLocked=false;\n  $('levelView').hidden=true;$('waitingView').hidden=false;\n}\n\nfunction endTurn(reason){\n  if(currentPlayerId===null)return;\n  const id=currentPlayerId,a=animals[id];\n  const title=reason==='finished'?`${animalSpecs[id].name} ha llegado al final`:`Turno de ${animalSpecs[id].name} terminado`;\n  const text=reason==='finished'?'Ha completado los cuatro niveles.':`Ha llegado a 2 fallos. La próxima vez continuará en el nivel ${a.level}.`;\n  clearTurnState();save();renderAll();\n  $('turnCard').innerHTML=`${animalSVG(id)}<h2>${title}<\/h2><p>${text}<\/p><button class=\"btn primary\" id=\"nextWheelBtn\" type=\"button\">IR A LA RULETA<\/button>`;\n  $('turnOverlay').classList.add('open');\n  $('nextWheelBtn').addEventListener('click',()=>{\n    $('turnOverlay').classList.remove('open');showPage('players');\n    $('wheelResult').innerHTML='<div><strong>Siguiente turno<\/strong><span>La ruleta da prioridad a quienes han jugado menos.<\/span><\/div>';\n    renderAll();\n  },{once:true});\n}\n\nfunction returnToRoulette(){\n  // Volver a la ruleta siempre libera el turno actual y permite elegir a otro niño.\n  let message='Puedes girar para elegir al siguiente jugador.';\n  if(currentPlayerId!==null){\n    const name=animalSpecs[currentPlayerId].name;\n    stopSpeech();\n    currentPlayerId=null;currentQuestion=null;currentQuestions=[];questionIndex=0;turnMistakes=0;questionLocked=false;\n    message=`${name} cede el turno. La ruleta puede elegir a otro jugador.`;\n  }\n  if(selectedByWheelId!==null){selectedByWheelId=null;message='Selección cancelada. Gira de nuevo para elegir a otro jugador.'}\n  $('turnOverlay').classList.remove('open');\n  $('levelView').hidden=true;$('waitingView').hidden=false;\n  save();renderAll();showPage('players');\n  $('wheelResult').innerHTML=`<div><strong>Ruleta lista<\/strong><span>${message}<\/span><\/div>`;\n}\n\nfunction resetGame(){\n  if(!confirm('¿Empezar una partida nueva? Se borrarán niveles y turnos.'))return;\n  stopSpeech();\n  animals=animalSpecs.map((_,i)=>({id:i,active:false,level:1,turns:0,finished:false}));\n  currentPlayerId=null;selectedByWheelId=null;spinning=false;wheelRotation=0;turnMistakes=0;questionIndex=0;currentQuestions=[];currentQuestion=null;questionLocked=false;\n  try{localStorage.removeItem(STORAGE_KEY)}catch(e){}\n  $('levelView').hidden=true;$('waitingView').hidden=false;$('turnOverlay').classList.remove('open');\n  $('wheelResult').innerHTML='<div><strong>Preparados<\/strong><span>Primero juegan quienes todavía no han participado.<\/span><\/div>';\n  renderAll();showPage('players');\n}\n\nasync function toggleFullscreen(){\n  try{\n    if(!document.fullscreenElement)await document.documentElement.requestFullscreen();\n    else await document.exitFullscreen();\n  }catch(e){}\n}\nfunction updateFullscreenLabel(){$('fullscreenBtn').textContent=document.fullscreenElement?'SALIR DE PANTALLA COMPLETA':'PANTALLA COMPLETA'}\n\n$('playersTab').addEventListener('click',returnToRoulette);\n$('activityTab').addEventListener('click',()=>showPage('activity'));\n$('spinBtn').addEventListener('click',spinWheel);\n$('startTurnBtn').addEventListener('click',startSelectedTurn);\n$('waitingStartBtn').addEventListener('click',startSelectedTurn);\n$('waitingBackBtn').addEventListener('click',returnToRoulette);\n$('goPlayersBtn').addEventListener('click',returnToRoulette);\n$('changePlayerBtn').addEventListener('click',returnToRoulette);\n$('listenBtn').addEventListener('click',playCurrentAudio);\n$('instructionListenBtn').addEventListener('click',()=>speakLevelInstruction(false));\n$('voiceSettingsBtn').addEventListener('click',openVoiceSettings);\n$('closeVoiceBtn').addEventListener('click',closeVoiceSettings);\n$('testVoiceBtn').addEventListener('click',testSelectedVoice);\n$('volumeSlider').addEventListener('input',e=>{speechVolume=Math.max(0,Math.min(2,Number(e.target.value)/100));$('volumeValue').textContent=`${Math.round(speechVolume*100)}%`;saveAudioSettings();});\n$('voiceOverlay').addEventListener('click',e=>{if(e.target===$('voiceOverlay'))closeVoiceSettings()});\n$('resetBtn').addEventListener('click',resetGame);\n$('fullscreenBtn').addEventListener('click',toggleFullscreen);\ndocument.addEventListener('fullscreenchange',upd cat\": \"complex\", \"label\": \"frambuesas\", \"img\": \"assets/82_frambuesas.png\"}];\nconst BANKS={\n  1:DATA.filter(x=>x.cat==='initial'),\n  2:DATA.filter(x=>x.cat==='final'),\n  3:DATA.filter(x=>x.cat==='middle'),\n  4:DATA.filter(x=>['initial','final','middle'].includes(x.cat)),\n  5:DATA.filter(x=>['inverse','mixed','mixedmiddle','complex'].includes(x.cat))\n};\nconst NAMES={\n  1:'Nivel 1 · M al principio',\n  2:'Nivel 2 · M al final',\n  3:'Nivel 3 · M en medio',\n  4:'Nivel 4 · Detective M',\n  5:'Nivel 5 · Super M'\n};\nconst TAGS={\n  initial:['M inicial','#ef2b35'],\n  final:['M final','#f0a3dc'],\n  middle:['M media','#f4a000'],\n  inverse:['Sílaba inversa','#33a653'],\n  mixed:['Sílaba mixta','#315ec8'],\n  mixedmiddle:['Sílaba mixta · M media','#2e9fd1'],\n  complex:['Sílaba compleja','#f4a000']\n};\nconst LEVEL_THEME={\n  1:['#ef2b35','#fff0f1'],\n  2:['#d85abb','#fff0fb'],\n  3:['#e59600','#fff7df'],\n  4:['#268b8f','#eaf8f8'],\n  5:['#315ec8','#edf2ff']\n};\nconst POSITIVE=[\n  'Mmmmm… ¡Muy bien!',\n  '¡Lo has conseguido!',\n  '¡Buen trabajo con la M!',\n  '¡Palabra superada!'\n];\n\nfunction applyLevelTheme(){\n  const [main,soft]=LEVEL_THEME[level] || LEVEL_THEME[4];\n  document.documentElement.style.setProperty('--level',main);\n  document.documentElement.style.setProperty('--level-soft',soft);\n}\n\nfunction setStep(step){\n  $$('#stepTrack .stepPill').forEach(el=>{\n    const n=Number(el.dataset.step);\n    el.classList.toggle('active',n===step);\n    el.classList.toggle('done',n<step);\n  });\n}\n\nfunction clearStepTrack(){\n  $$('#stepTrack .stepPill').forEach(el=>el.classList.remove('active','done'));\n}\n\n\n\nfunction wrapStageContent(){\n  document.querySelectorAll('.stage').forEach(stage=>{\n    if(stage.querySelector('.stageFit')) return;\n    const fit=document.createElement('div');\n    fit.className='stageFit';\n    const content=document.createElement('div');\n    content.className='stageContent';\n    while(stage.firstChild){\n      content.appendChild(stage.firstChild);\n    }\n    fit.appendChild(content);\n    stage.appendChild(fit);\n  });\n  document.querySelectorAll('.picture').forEach(img=>{\n    img.addEventListener('load',()=>refitStage(),{once:false});\n  });\n}\nfunction fitActiveStage(){\n  const active=[...document.querySelectorAll('.stage')].find(s=>!s.classList.contains('hidden'));\n  if(!active) return;\n  const fit=active.querySelector('.stageFit');\n  const content=active.querySelector('.stageContent');\n  if(!fit || !content) return;\n\n  content.style.transform='scale(1)';\n  content.style.maxWidth='100%';\n\n  // On small screens, keep the natural flow.\n  if(window.innerWidth < 760){\n    return;\n  }\n\n  const availW=Math.max(100, fit.clientWidth - 8);\n  const availH=Math.max(100, fit.clientHeight - 8);\n\n  // Measure the content at natural size.\n  const neededW=Math.max(content.scrollWidth, content.getBoundingClientRect().width || 0);\n  const neededH=Math.max(content.scrollHeight, content.getBoundingClientRect().height || 0);\n\n  const scale=Math.min(1, availW / neededW, availH / neededH);\n\n  content.style.transform='scale('+scale+')';\n}\nfunction refitStage(){\n  requestAnimationFrame(fitActiveStage);\n  setTimeout(fitActiveStage, 60);\n  setTimeout(fitActiveStage, 160);\n}\n\nlet level=1, deck=[], index=0, score=0, countTries=0, soundTries=0, found=new Set();\n\nconst $=q=>document.querySelector(q);\nconst $$=q=>[...document.querySelectorAll(q)];\n\nfunction shuffle(a){\n  const b=[...a];\n  for(let i=b.length-1;i>0;i--){\n    const j=Math.floor(Math.random()*(i+1));\n    [b[i],b[j]]=[b[j],b[i]];\n  }\n  return b;\n}\nfunction current(){return deck[index]}\nfunction hide(q){$(q).classList.add('hidden')}\nfunction show(q){$(q).classList.remove('hidden')}\nfunction pointsFor(tries){return tries===1?3:tries===2?2:1}\nfunction addPoints(n){score+=n;$('#pointsText').textContent='Puntos: '+score}\n\nfunction showOnly(id){\n  ['#screenCenterReady','#screenIdentify','#screenCount','#screenSound','#screenSentence','#screenSuccess'].forEach(hide);\n  show(id);\n  const stepMap={\n    '#screenIdentify':1,\n    '#screenCount':2,\n    '#screenSound':3,\n    '#screenSentence':4\n  };\n  if(stepMap[id]) setStep(stepMap[id]);\n  else clearStepTrack();\n  refitStage();\n}\n\nfunction renderProgress(){\n  $('#progressDots').innerHTML='';\n  deck.forEach((_,i)=>{\n    const d=document.createElement('span');\n    d.className='pdot '+(i<index?'done':i===index?'current':'');\n    $('#progressDots').appendChild(d);\n  });\n  $('#roundText').textContent=`Palabra ${index+1} de ${deck.length}`;\n}\n\nfunction setImages(){\n  const c=current();\n  [\n    ['#identifyImg',c.img],\n    ['#countImg',c.img],\n    ['#sentenceImg',c.img]\n  ].forEach(([sel,src])=>{\n    $(sel).src=src;\n    $(sel).alt='Pictograma de '+c.label;\n  });\n}\n\nfunction buildCountButtons(){\n  $('#countButtons').innerHTML='';\n  for(let n=1;n<=6;n++){\n    const b=document.createElement('button');\n    b.type='button';\n    b.className='btn';\n    b.textContent=n;\n    b.addEventListener('click',()=>checkCount(b,n));\n    $('#countButtons').appendChild(b);\n  }\n}\n\nfunction buildSoundSyllables(){\n  $('#soundSyllables').innerHTML='';\n  current().syll.forEach((s,i)=>{\n    const b=document.createElement('button');\n    b.type='button';\n    b.className='syll';\n    b.textContent=s.toUpperCase();\n    b.addEventListener('click',()=>checkSound(b,i));\n    $('#soundSyllables').appendChild(b);\n  });\n}\n\nfunction resetWord(){\n  countTries=0; soundTries=0; found=new Set();\n  renderProgress(); setImages(); buildCountButtons(); buildSoundSyllables();\n\n  $('#identifyWord').textContent='';\n  $('#countWord').textContent=current().label.toUpperCase();\n  $('#soundWord').textContent=current().label.toUpperCase();\n  $('#sentenceWord').textContent=current().label.toUpperCase();\n  $('#successWord').textContent=current().label.toUpperCase();\n\n  $('#countFeedback').className='feedback';\n  $('#soundFeedback').className='feedback';\n  $('#countFeedback').textContent='';\n  $('#soundFeedback').textContent='';\n  $('#revealBtn').disabled=false;\n  show('#revealBtn'); hide('#toCountBtn');\n  hide('#toSoundBtn'); hide('#toSentenceBtn');\n\n  const [tagText,tagColor]=TAGS[current().cat];\n  $('#categoryTag').innerHTML=`<span class=\"tag\" style=\"border-color:${tagColor};background:${tagColor}18\">${tagText}<\/span>`;\n\n  showOnly('#screenIdentify');\n}\n\nfunction startLevel(n){\n  level=Number(n);\n  deck=shuffle(BANKS[level]).slice(0,5);\n  index=0; score=0;\n  $('#pointsText').textContent='Puntos: 0';\n  $('#levelTitle').textContent=NAMES[level];\n  applyLevelTheme();\n  hide('#levelScreen'); hide('#finishScreen'); show('#gameScreen');\n  resetWord();\n}\n\nfunction prepareNewPlayer(){\n  deck=shuffle(BANKS[level]).slice(0,5);\n  index=0;\n  score=0;\n  $('#pointsText').textContent='Puntos: 0';\n  applyLevelTheme();\n  $('#centerReadyLevel').textContent=NAMES[level];\n  hide('#finishScreen');\n  hide('#levelScreen');\n  show('#gameScreen');\n  renderProgress();\n  showOnly('#screenCenterReady');\n}\n\nfunction samePlayerAnotherFive(){\n  deck=shuffle(BANKS[level]).slice(0,5);\n  index=0;\n  // score is intentionally preserved for the same child\n  hide('#finishScreen');\n  hide('#levelScreen');\n  show('#gameScreen');\n  resetWord();\n}\n\nfunction changeLevel(){\n  hide('#gameScreen');\n  hide('#finishScreen');\n  clearStepTrack();\n  show('#levelScreen');\n  refitStage();\n}\n\n\nfunction checkCount(button,n){\n  countTries++;\n  const correct=current().syll.length;\n  if(n===correct){\n    button.classList.add('good');\n    $$('#countButtons .btn').forEach(b=>b.disabled=true);\n    $('#countFeedback').className='feedback ok';\n    $('#countFeedback').textContent=`Muy bien. Tiene ${correct} ${correct===1?'sílaba':'sílabas'}.`;\n    addPoints(pointsFor(countTries));\n    show('#toSoundBtn');\n    refitStage();\n  } else {\n    button.classList.add('bad');\n    $('#countFeedback').className='feedback try';\n    $('#countFeedback').textContent='Casi. Dilo despacio y vuelve a contar.';\n    setTimeout(()=>button.classList.remove('bad'),550);\n  }\n}\n\nfunction getSoundTargets(){\n  const c=current();\n  const targets=Array.isArray(c.m) ? c.m : [];\n  return [...new Set(targets)].filter(i=>Number.isInteger(i) && i>=0 && i<c.syll.length);\n}\n\nfunction completeSoundStep(){\n  const targets=getSoundTargets();\n  $$('#soundSyllables .syll').forEach(b=>b.disabled=true);\n  $('#soundFeedback').className='feedback ok';\n  $('#soundFeedback').textContent='Muy bien. Has encontrado dónde suena la M.';\n  addPoints(pointsFor(soundTries));\n  show('#toSentenceBtn');\n  refitStage();\n}\n\nfunction checkSound(button,i){\n  if(found.has(i)) return;\n\n  const targets=getSoundTargets();\n  soundTries++;\n\n  if(targets.includes(i)){\n    found.add(i);\n    button.classList.add('hit');\n    button.disabled=true;\n\n    if(!button.querySelector('.cap')){\n      const cap=document.createElement('span');\n      cap.className='cap';\n      cap.setAttribute('aria-hidden','true');\n      button.appendChild(cap);\n    }\n\n    const remaining=targets.filter(pos=>!found.has(pos));\n\n    if(remaining.length===0){\n      completeSoundStep();\n    } else {\n      $('#soundFeedback').className='feedback ok';\n      $('#soundFeedback').textContent='Muy bien. La M también suena en otra sílaba. Tócala.';\n      refitStage();\n    }\n  } else {\n    button.classList.add('bad');\n    $('#soundFeedback').className='feedback try';\n    $('#soundFeedback').textContent='Casi. Escucha despacio y toca otra sílaba.';\n    setTimeout(()=>button.classList.remove('bad'),550);\n  }\n}\n\nfunction finishGame(){\n  hide('#gameScreen'); show('#finishScreen');\n  $('#finishLevel').textContent=NAMES[level];\n  $('#finishPoints').textContent='Puntos: '+score;\n  clearStepTrack();\n  refitStage();\n}\n\n$$('[data-level]').forEach(b=>b.addEventListener('click',()=>startLevel(b.dataset.level)));\n\n$('#revealBtn').addEventListener('click',()=>{\n  $('#identifyWord').textContent=current().label.toUpperCase();\n  $('#revealBtn').disabled=true;\n  hide('#revealBtn'); show('#toCountBtn');\n  refitStage();\n});\n\n$('#toCountBtn').addEventListener('click',()=>showOnly('#screenCount'));\n$('#toSoundBtn').addEventListener('click',()=>showOnly('#screenSound'));\n$('#toSentenceBtn').addEventListener('click',()=>showOnly('#screenSentence'));\n\n$('#clapBtn').addEventListener('click',()=>{\n  const syllables=$$('#soundSyllables .syll');\n  $('#soundFeedback').className='feedback';\n  $('#soundFeedback').textContent='Palmea cada sílaba...';\n\n  syllables.forEach((el,i)=>{\n    setTimeout(()=>{\n      el.classList.add('clapPulse');\n      setTimeout(()=>el.classList.remove('clapPulse'),360);\n    },i*430);\n  });\n\n  const total=Math.max(450, syllables.length*430+120);\n  setTimeout(()=>{\n    if(getSoundTargets().some(pos=>!found.has(pos))){\n      $('#soundFeedback').className='feedback';\n      $('#soundFeedback').textContent='Ahora toca la sílaba o sílabas donde suena la M.';\n      refitStage();\n    }\n  },total);\n});\n\n$('#sentenceDoneBtn').addEventListener('click',()=>{\n  addPoints(1);\n  $('#successLead').textContent=POSITIVE[index % POSITIVE.length];\n  showOnly('#screenSuccess');\n  refitStage();\n});\n\n$('#nextWordBtn').addEventListener('click',()=>{\n  index++;\n  if(index>=deck.length) finishGame();\n  else resetWord();\n  refitStage();\n});\n\n$('#restartLevel').addEventListener('click',()=>startLevel(level));\n$('#quickNewPlayer').addEventListener('click',prepareNewPlayer);\n$('#quickChangeLevel').addEventListener('click',changeLevel);\n$('#centerStartBtn').addEventListener('click',resetWord);\n$('#playAgain').addEventListener('click',samePlayerAnotherFive);\n$('#chooseLevel').addEventListener('click',changeLevel);\n$('#finishNewPlayer').addEventListener('click',prepareNewPlayer);\n\n\nwrapStageContent();\nwindow.addEventListener('resize', refitStage);\nwindow.addEventListener('load', refitStage);\ndocument.addEventListener('fullscreenchange', ()=>setTimeout(refitStage,120));\n\nconst fullscreenBtn=document.getElementById('fullscreenBtn');\nif(fullscreenBtn){\n  fullscreenBtn.addEventListener('click', async ()=>{\n    try{\n      if(!document.fullscreenElement){\n        await document.documentElement.requestFullscreen();\n        fullscreenBtn.textContent='Salir de pantalla completa';\n      }else{\n        await document.exitFullscreen();\n        fullscreenBtn.textContent='Pantalla completa';\n      }\n    }catch(e){\n      fullscreenBtn.textContent='Pantalla completa';\n    }\n  });\n  document.addEventListener('fullscreenchange',()=>{\n    fullscreenBtn.textContent=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa';\n  });\n}\n\n<\/script>\n\n\n<script id=\"zurron-local-nav\">\n(() => {\n  const ROUTES = new Set([\"/\", \"/m/\", \"/m/centro/\", \"/m/mision/\", \"/s/\", \"/s/centro/\", \"/s/mision/\", \"/s/cuento/\", \"/l/\", \"/l/centro/\", \"/l/mision/\"]);\n\n  function normalizeInternal(href) {\n    if (!href) return null;\n    href = String(href).trim();\n\n    // Solo rutas internas absolutas del proyecto.\n    if (!href.startsWith('/')) return null;\n\n    let path = href.split('?')[0].split('#')[0];\n    if (path !== '/' && !path.endsWith('/')) path += '/';\n\n    return ROUTES.has(path) ? path : null;\n  }\n\n  document.addEventListener('click', (ev) => {\n    const a = ev.target.closest('a[href]');\n    if (!a) return;\n\n    const path = normalizeInternal(a.getAttribute('href'));\n    if (!path) return;\n\n    ev.preventDefault();\n    ev.stopImmediatePropagation();\n\n    if (window.parent && window.parent !== window) {\n      window.parent.postMessage({type:'zurron:navigate', path}, '*');\n    }\n  }, true);\n})();\n<\/script>\n\n\n<script id=\"zurron-responsive-viewport\">\n(() => {\n  const applyViewport = () => {\n    const h = Math.max(\n      320,\n      Math.round(window.visualViewport ? window.visualViewport.height : window.innerHeight)\n    );\n    const w = Math.max(\n      320,\n      Math.round(window.visualViewport ? window.visualViewport.width : window.innerWidth)\n    );\n    document.documentElement.style.setProperty('--zurron-view-h', h + 'px');\n    document.documentElement.style.setProperty('--zurron-view-w', w + 'px');\n  };\n  applyViewport();\n  window.addEventListener('resize', applyViewport, {passive:true});\n  window.addEventListener('orientationchange', applyViewport, {passive:true});\n  if(window.visualViewport){\n    window.visualViewport.addEventListener('resize', applyViewport, {passive:true});\n  }\n})();\n<\/script>\n\n<\/body>\n<\/html>\n","/s/":"<!doctype html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>Letra S · El Zurrón de las Letras<\/title>\n<style>\n:root{--ink:#17324d;--muted:#5c7184;--m:#2f80ed;--s:#df4b53}\n*{box-sizing:border-box}\nhtml,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef5f9}\nbody{overflow:hidden}\na{text-decoration:none;color:inherit}\n.page{width:100%;height:100dvh;padding:8px}\n.shell{\n  position:relative;width:100%;height:100%;overflow:hidden;isolation:isolate;\n  border-radius:24px;border:1px solid rgba(216,228,237,.9);\n  box-shadow:0 14px 34px rgba(30,70,105,.12)\n}\n.shell::before{\n  content:\"\";position:absolute;inset:-20px;background-image:var(--letter-bg);\n  background-size:cover;background-position:center;filter:blur(16px) saturate(1.02);\n  transform:scale(1.07);z-index:-3\n}\n.shell::after{\n  content:\"\";position:absolute;inset:0;\n  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.5));\n  z-index:-2\n}\n.content{\n  width:min(1560px,100%);height:100%;margin:auto;\n  padding:12px 20px 84px;\n  display:grid;grid- 0!important;\n  min-height:0!important;\n  max-width:100%!important;\n  max-height:var(--zurron-view-h)!important;\n}\n.shell{\n  min-width:0!important;\n  min-height:0!important;\n  max-width:100%!important;\n  max-height:100%!important;\n}\n\n/* Cualquier imagen funcional debe entrar COMPLETA en su contenedor */\nimg{\n  max-width:100%!important;\n  max-height:100%!important;\n}\n\n/* Pictogramas de las misiones */\n.picture{\n  width:min(40vw,46vh,420px)!important;\n  height:min(40vw,46vh,420px)!important;\n  max-width:88vw!important;\n  max-height:46vh!important;\n  object-fit:contain!important;\n}\n.picture.small{\n  width:min(28vw,30vh,285px)!important;\n  height:min(28vw,30vh,285px)!important;\n  max-width:72vw!important;\n  max-height:30vh!important;\n  object-fit:contain!important;\n}\n\n/* Portada: siempre se ve la ilustración completa */\n.hero{\n  min-height:0!important;\n  overflow:hidden!important;\n  display:flex!important;\n  align-items:center!important;\n  justify-content:center!important;\n}\n.hero img{\n  width:100%!important;\n  height:100%!important;\n  object-fit:contain!important;\n  object-position:center center!important;\n}\n\n/* Cuento: página completa dentro del área disponible */\n.storyImageWrap{\n  min-width:0!important;\n  min-height:0!important;\n  overflow:hidden!important;\n}\n.storyImage{\n  width:100%!important;\n  height:100%!important;\n  max-width:100%!important;\n  max-height:100%!important;\n  object-fit:contain!important;\n  object-position:center center!important;\n}\n\n/* Ilustraciones de las canciones */\n.audioIllu{\n  width:100%!important;\n  height:auto!important;\n  min-height:0!important;\n  max-width:100%!important;\n  max-height:min(42vh,390px)!important;\n  object-fit:contain!important;\n  object-position:center!important;\n}\n\n/* Canvas/ruletas: nunca salen de pantalla */\ncanvas{\n  max-width:100%!important;\n  max-height:100%!important;\n}\n\n/* SVG y vídeo, por seguridad */\nsvg,video{\n  max-width:100%;\n pe=\"button\">CAMBIAR JUGADOR<\/button><\/div>\n        <\/div>\n        <div class=\"progress-track\" id=\"progressTrack\"><\/div>\n        <div class=\"journey-wrap\" id=\"journeyWrap\"><\/div>\n        <div id=\"activityBody\" style=\"height:100%;min-height:0\">\n          <div class=\"activity-waiting\" id=\"waitingView\">\n            <div>\n              <div class=\"waiting-default\" id=\"waitingDefault\">\n                <div class=\"bigM\">S<\/div>\n                <h2>Preparados para leer<\/h2>\n                <p>Primero la ruleta debe elegir un animalito.<\/p>\n                <div class=\"waiting-actions\">\n                  <button class=\"btn primary\" id=\"goPlayersBtn\" type=\"button\">IR A LA RULETA<\/button>\n                <\/div>\n              <\/div>\n              <div class=\"waiting-selected\" id=\"waitingSelected\">\n                <div id=\"waitingAvatar\"><\/div>\n                <h2 id=\"waitingName\">Jugador elegido<\/h2>\n                <p id=\"waitingLevel\">Preparado para comenzar.<\/p>\n                <div class=\"waiting-actions\">\n                  <button class=\"btn good\" id=\"waitingStartBtn\" type=\"button\">COMENZAR ACTIVIDAD<\/button>\n                  <button class=\"btn secondary\" id=\"waitingBackBtn\" type=\"button\">VOLVER A LA RULETA<\/button>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n          <div class=\"question-card\" id=\"levelView\" hidden>\n            <div class=\"question-kicker\" id=\"questionKicker\">PREGUNTA<\/div>\n            <div class=\"instruction-box\" id=\"instructionBox\">\n              <strong>QUÉ HAGO<\/strong>\n              <div class=\"instruction-text\" id=\"instructionText\">Escucha o lee con calma y elige la respuesta correcta.<\/div>\n              <button class=\"btn secondary instruction-listen\" id=\"instructionListenBtn\" type=\"button\">OÍR INSTRUCCIÓN<\/button>\n            <\/div>\n            <div class=\"audio-zone\" id=\"audioZone\">\n              <div class=\"speaker-disc\" aria-hidden=\"true\">\n                <svg viewBox=\"0 0 64 64\"><path d=\"M12 26h11l13-11v34L23 38H12z\" fill=\"#2f80ed\" stroke=\"#17324d\" stroke-width=\"3\"/><path d=\"M43 24q8 8 0 16M49 18q14 14 0 28\" fill=\"none\" stroke=\"#17324d\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><\/svg>\n              <\/div>\n              <div>\n                <button class=\"btn primary listen-btn\" id=\"listenBtn\" type=\"button\">ESCUCHAR<\/button>\n                <div class=\"audio-status\" id=\"audioStatus\">Escucha y después toca la sílaba.<\/div>\n              <\/div>\n            <\/div>\n            <div class=\"phrase-controls\" id=\"phraseControls\" aria-label=\"Ajustes de lectura del nivel 4\">\n              <div class=\"phrase-control\">\n                <strong>VELOCIDAD<\/strong>\n                <button class=\"phrase-step\" id=\"phraseRateDown\" type=\"button\" aria-label=\"Reducir velocidad\">−<\/button>\n                <span class=\"phrase-value\" id=\"phraseRateValue\">0,56<\/span>\n                <button class=\"phrase-step\" id=\"phraseRateUp\" type=\"button\" aria-label=\"Aumentar velocidad\">+<\/button>\n              <\/div>\n              <div class=\"phrase-control\">\n                <strong>PAUSA<\/strong>\n                <button class=\"phrase-step\" id=\"phrasePauseDown\" type=\"button\" aria-label=\"Reducir pausa entre palabras\">−<\/button>\n                <span class=\"phrase-value\" id=\"phrasePauseValue\">500 ms<\/span>\n                <button class=\"phrase-step\" id=\"phrasePauseUp\" type=\"button\" aria-label=\"Aumentar pausa entre palabras\">+<\/button>\n              <\/div>\n            <\/div>\n            <div class=\"question-main\" id=\"questionMain\"><\/div>\n            <div class=\"prompt\" id=\"questionPrompt\"><\/div>\n            <div class=\"choices\" id=\"questionChoices\"><\/div>\n            <div class=\"feedback\" id=\"feedback\" aria-live=\"polite\"><\/
