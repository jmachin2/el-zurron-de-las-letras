<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartilla P</title><style>
:root{--ink:#17324d;--muted:#607486;--paper:#fffdf8;--line:#d9e5ec;--p:#a13f7a;--green:#2f9e5b;--shadow:0 14px 38px rgba(27,65,95,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef6fa}
a{text-decoration:none;color:inherit}button{font:inherit}.hidden{display:none!important}
.shell{min-height:calc(100vh - 18px);margin:9px;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:15px;background:var(--p);color:white;display:grid;place-items:center;font-size:31px;font-weight:950}
.kicker{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--muted)}h1{margin:2px 0 0;font-size:clamp(22px,3vw,36px)}
.back,.btn{border:2px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-weight:900;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--p);border-color:var(--p);color:white}.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.content{padding:16px}.sub{color:var(--muted);line-height:1.45}.card{background:white;border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 7px 20px rgba(30,70,105,.08)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:14px}.players{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.animal{min-height:75px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:28px;cursor:pointer}.animal.on{border-color:var(--p);background:#f9edf5}.wheel{width:260px;height:260px;border-radius:50%;margin:10px auto;background:conic-gradient(#ffd46b 0 45deg,#8fd3ff 45deg 90deg,#c9ecb6 90deg 135deg,#f4b7e1 135deg 180deg,#ffd0a8 180deg 225deg,#cfbfff 225deg 270deg,#ffe7a8 270deg 315deg,#aee7ef 315deg);border:10px solid white;box-shadow:0 0 0 3px var(--line);display:grid;place-items:center;font-size:52px;transition:transform 1s cubic-bezier(.2,.8,.2,1)}.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.level{padding:13px;border:2px solid var(--line);border-radius:14px;background:#fff;text-align:left;font-weight:900;cursor:pointer}.level.sel{border-color:var(--p);background:#f9edf5}.q{text-align:center;padding:22px}.big{font-size:clamp(32px,6vw,64px);font-weight:950;margin:18px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{min-height:70px;border:0;border-radius:16px;background:#eaf3f8;font-size:22px;font-weight:950;cursor:pointer}.choice.ok{background:#dff5e6}.choice.bad{background:#ffe2df}.tiny{font-size:12px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="header"><div class="brand"><div class="mark">P</div><div><div class="kicker">EL ZURRÓN · CARTILLA</div><h1>Juego con la CARTILLA DE LECTURA de la P</h1></div></div><a class="back" href="/p/">← LETRA P</a></header>
<div class="content"><div id="setup" class="layout"><section class="card"><h2>¿Quién juega?</h2><p class="sub">Toca los animalitos que participan.</p><div id="players" class="players"></div></section><section class="card"><h2>Ruleta</h2><div id="wheel" class="wheel">P</div><div class="controls"><button class="btn primary" id="spin">GIRAR</button><button class="btn" id="start">COMENZAR</button></div><p id="chosen" class="sub" style="text-align:center">Activa al menos un jugador.</p></section></div>
<section id="levelSel" class="card hidden"><h2>Elige nivel</h2><div id="levels" class="levels"></div><div class="controls" style="margin-top:12px"><button class="btn primary" id="go">COMENZAR ACTIVIDAD</button><button class="btn" id="backSetup">VOLVER A LA RULETA</button></div></section>
<section id="game" class="card hidden q"><div class="controls"><button class="btn" id="speak">🔊 ESCUCHAR</button><button class="btn" id="voice">VOZ Y VOLUMEN</button></div><h2 id="lvlTitle"></h2><p id="lvlDesc" class="sub"></p><div id="prompt" class="big">Escucha</div><div id="choices" class="choices"></div><div id="feedback" class="big" style="font-size:26px;min-height:34px"></div><div id="phraseCtl" class="controls hidden"><button class="btn" id="slower">− VELOCIDAD</button><span id="rate">0.58</span><button class="btn" id="faster">+ VELOCIDAD</button><button class="btn" id="lessPause">− PAUSA</button><span id="pause">500 ms</span><button class="btn" id="morePause">+ PAUSA</button></div><div class="controls"><button class="btn" id="change">CAMBIAR NIVEL</button><button class="btn primary" id="next">SIGUIENTE</button></div></section>
<dialog id="voiceDlg" class="card"><h2>Voz y volumen</h2><select id="voiceSelect" style="width:100%;padding:10px"></select><label>Volumen <input id="vol" type="range" min="0" max="1" step=".1" value="1"></label><div class="controls"><button class="btn" id="testVoice">PROBAR VOZ</button><button class="btn primary" id="closeVoice">LISTO</button></div></dialog></div></main>
<script>const LEVELS=[{"title":"Nivel 1 · Escucho sílabas","desc":"Escucha y reconoce pa, pe, pi, po y pu.","qs":[["pa",["pa","pe","pi","po","pu"]],["pe",["pa","pe","pi","po","pu"]],["pi",["pa","pe","pi","po","pu"]],["po",["pa","pe","pi","po","pu"]],["pu",["pa","pe","pi","po","pu"]]]},{"title":"Nivel 2 · Escucho más sílabas","desc":"Mayúsculas e inversas.","qs":[["pi",["PI","PE","PO","PU"]],["pe",["PA","PU","PE","PO"]],["po",["PO","PI","PA","PE"]],["ap",["ep","ip","ap","op"]],["ep",["up","ep","ap","ip"]],["up",["op","ip","up","ep"]]]},{"title":"Nivel 3 · Escucho palabras","desc":"Palabras de la cartilla.","qs":[["papá",["papá","pipas","palo","piso"]],["palo",["pomo","palo","sapo","Lupe"]],["pomo",["piso","pomo","palo","papá"]],["piso",["piso","sapo","pipas","pomo"]],["sapo",["Lupe","sapo","palo","piso"]],["Lupe",["Lupe","pomo","papá","sapo"]],["paloma",["paloma","amapola","piano","pala"]]]},{"title":"Nivel 4 · Escucho frases","desc":"Frases completas de la cartilla.","qs":[["Papá pela las papas y Paulina pela los pomelos.",["Papá pela las papas y Paulina pela los pomelos.","Popi lame mi mano y el pie.","Esa paloma pisa el papel."]],["Popi lame mi mano y el pie.",["El mapa de La Palma.","Popi lame mi mano y el pie.","Pepe merienda pan, lomo y alioli."]],["Pepe merienda pan, lomo y alioli.",["Pepe merienda pan, lomo y alioli.","Esa paloma pisa el papel.","Papá pela las papas y Paulina pela los pomelos."]],["Al mediodía comió sopa, pulpo y papas.",["Esa paloma pisa el papel.","Al mediodía comió sopa, pulpo y papas.","El mapa de La Palma."]],["Esa paloma pisa el papel.",["El mapa de La Palma.","Esa paloma pisa el papel.","Popi lame mi mano y el pie."]],["El mapa de La Palma.",["El mapa de La Palma.","Pepe merienda pan, lomo y alioli.","Al mediodía comió sopa, pulpo y papas."]]]}];const animals=['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐸','🐵','🦁'];let active=new Set(),chosen=null,level=0,idx=0,questions=[],rate=.58,pause=500,vol=1,voice=null;const $=x=>document.getElementById(x);const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function renderPlayers(){$('players').innerHTML='';animals.forEach((a,i)=>{let b=document.createElement('button');b.className='animal'+(active.has(i)?' on':'');b.textContent=a;b.onclick=()=>{active.has(i)?active.delete(i):active.add(i);renderPlayers();$('chosen').textContent=active.size?active.size+' jugadores activos':'Activa al menos un jugador.'};$('players').appendChild(b)})}renderPlayers();
$('spin').onclick=()=>{if(!active.size)return;let arr=[...active];chosen=arr[Math.floor(Math.random()*arr.length)];$('wheel').style.transform='rotate('+(720+Math.random()*720)+'deg)';$('chosen').textContent='Juega '+animals[chosen]};$('start').onclick=()=>{if(chosen===null&&active.size)chosen=[...active][0];if(chosen===null)return;$('setup').classList.add('hidden');$('levelSel').classList.remove('hidden');renderLevels()};
function renderLevels(){$('levels').innerHTML='';LEVELS.forEach((l,i)=>{let b=document.createElement('button');b.className='level'+(i===level?' sel':'');b.innerHTML='<strong>'+l.title+'</strong><br><span class="tiny">'+l.desc+'</span>';b.onclick=()=>{level=i;renderLevels()};$('levels').appendChild(b)})}$('backSetup').onclick=()=>{$('levelSel').classList.add('hidden');$('setup').classList.remove('hidden')};$('go').onclick=startGame;$('change').onclick=()=>{$('game').classList.add('hidden');$('levelSel').classList.remove('hidden');renderLevels()};
function startGame(){questions=shuffle(LEVELS[level].qs);idx=0;$('levelSel').classList.add('hidden');$('game').classList.remove('hidden');$('lvlTitle').textContent=LEVELS[level].title;$('lvlDesc').textContent=LEVELS[level].desc;$('phraseCtl').classList.toggle('hidden',level!==3);showQ()}
function showQ(){if(idx>=questions.length)idx=0;let q=questions[idx];$('prompt').textContent=level===3?'Escucha la frase':'Escucha';$('feedback').textContent='';$('choices').innerHTML='';shuffle(q[1]).forEach(opt=>{let b=document.createElement('button');b.className='choice';b.textContent=opt;b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.disabled=true);if(opt.toLowerCase()===q[0].toLowerCase()){b.classList.add('ok');$('feedback').textContent='✓ Muy bien'}else{b.classList.add('bad');$('feedback').textContent='Inténtalo otra vez';document.querySelectorAll('.choice').forEach(x=>{if(x.textContent.toLowerCase()===q[0].toLowerCase())x.classList.add('ok')})}};$('choices').appendChild(b)});speak(q[0])}
function speak(text){speechSynthesis.cancel();if(level===3){let ws=text.split(/\s+/),n=0;function go(){if(n>=ws.length)return;let u=new SpeechSynthesisUtterance(ws[n++]);u.lang='es-ES';u.rate=rate;u.volume=vol;if(voice)u.voice=voice;u.onend=()=>setTimeout(go,pause);speechSynthesis.speak(u)}go()}else{let u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=.72;u.volume=vol;if(voice)u.voice=voice;speechSynthesis.speak(u)}}$('speak').onclick=()=>speak(questions[idx][0]);$('next').onclick=()=>{idx=(idx+1)%questions.length;showQ()};$('slower').onclick=()=>{rate=Math.max(.35,rate-.05);$('rate').textContent=rate.toFixed(2)};$('faster').onclick=()=>{rate=Math.min(1,rate+.05);$('rate').textContent=rate.toFixed(2)};$('lessPause').onclick=()=>{pause=Math.max(100,pause-100);$('pause').textContent=pause+' ms'};$('morePause').onclick=()=>{pause=Math.min(1500,pause+100);$('pause').textContent=pause+' ms'};
function voices(){let v=speechSynthesis.getVoices().filter(x=>/^es/i.test(x.lang));$('voiceSelect').innerHTML=v.map((x,i)=>'<option value="'+i+'">'+x.name+' · '+x.lang+'</option>').join('');if(v.length)voice=v[0];$('voiceSelect').onchange=e=>voice=v[+e.target.value]}speechSynthesis.onvoiceschanged=voices;voices();$('voice').onclick=()=>$('voiceDlg').showModal();$('closeVoice').onclick=()=>$('voiceDlg').close();$('testVoice').onclick=()=>speak('La pandorga palmera');$('vol').oninput=e=>vol=+e.target.value;</script></body></html>
