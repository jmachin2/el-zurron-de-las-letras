<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuento · La pandorga palmera</title><style>
:root{--ink:#17324d;--muted:#607486;--paper:#fffdf8;--line:#d9e5ec;--p:#a13f7a;--green:#2f9e5b;--shadow:0 14px 38px rgba(27,65,95,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef6fa}
a{text-decoration:none;color:inherit}button{font:inherit}.hidden{display:none!important}
.shell{min-height:calc(100vh - 18px);margin:9px;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:15px;background:var(--p);color:white;display:grid;place-items:center;font-size:31px;font-weight:950}
.kicker{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--muted)}h1{margin:2px 0 0;font-size:clamp(22px,3vw,36px)}
.back,.btn{border:2px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-weight:900;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--p);border-color:var(--p);color:white}.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.content{padding:16px}.sub{color:var(--muted);line-height:1.45}.card{background:white;border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 7px 20px rgba(30,70,105,.08)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;font-weight:900}.tabs .on{background:var(--p);color:#fff;border-color:var(--p)}.story{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}.story img{width:100%;height:420px;object-fit:cover;border-radius:20px}.storyText{font-size:clamp(19px,2.2vw,27px);line-height:1.55}.audioGrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}audio{width:100%}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{min-height:70px;border:0;border-radius:16px;background:#eaf3f8;font-weight:900;font-size:18px}.voc{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.voc h2{color:var(--p);font-size:30px}@media(max-width:850px){.story{grid-template-columns:1fr}.audioGrid,.voc{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="header"><div class="brand"><div class="mark">P</div><div><div class="kicker">EL ZURRÓN · CUENTO</div><h1>La pandorga palmera</h1></div></div><a class="back" href="../">← LETRA P</a></header><div class="content"><div class="tabs"><button class="on" data-tab="cuento">CUENTO</button><button data-tab="canciones">CANCIONES</button><button data-tab="quiz">COMPRENSIÓN</button><button data-tab="vocab">VOCABULARIO</button></div>
<section id="cuento" class="panel"><div class="story card" style="margin-top:12px"><div><h2 id="sceneTitle"></h2><p id="sceneText" class="storyText"></p><div class="controls"><button class="btn" id="prev">ANTERIOR</button><span id="counter"></span><button class="btn primary" id="next">SIGUIENTE</button></div></div><img src="https://drive.google.com/thumbnail?id=1Cp03YB6oRzqRmf06tDStjaePO1RqL72P&sz=w1600" alt="Ilustración de la pandorga palmera"></div></section>
<section id="canciones" class="panel hidden"><div class="audioGrid" style="margin-top:12px"><article class="card"><h2>Rima de la Pandorga palmera</h2><p class="sub">Parapapá · Párapa párapa parapapá.</p><audio controls src="https://drive.google.com/uc?export=download&id=1OTSMzi1F5OnJ9fVBSpf79AtAftB-GZzj"></audio></article><article class="card"><h2>Base musical del cuento</h2><p class="sub">Acompañamiento para narrar el cuento.</p><audio controls src="https://drive.google.com/uc?export=download&id=1TJ3XCm9zaP5op7r-flLsxOkRW2Hr08SH"></audio></article></div></section>
<section id="quiz" class="panel hidden"><div class="card" style="margin-top:12px;text-align:center"><div id="qcount"></div><h2 id="qtext" style="font-size:30px"></h2><div id="answers" class="answers"></div><div id="qfeedback" style="min-height:35px;font-size:22px;font-weight:900;margin:12px"></div><button id="qnext" class="btn primary hidden">SIGUIENTE PREGUNTA</button></div></section>
<section id="vocab" class="panel hidden"><div class="voc" style="margin-top:12px" id="voc"></div></section></div></main>
<script>const SCENES=[["1 · Acerina recuerda su infancia","Acerina miró unas fotografías antiguas y comenzó a recordar. Cuando era una pepona, una niña pequeña, vivía en La Palma, la Isla Bonita. Cada cinco años celebraban la Bajada de la Virgen de las Nieves. ¡Y le encantaban las pandorgas!"],["2 · Preparamos las pandorgas","Acerina, sus hermanos y sus primos preparaban figuras con cañas y papeles de muchos colores. Había pandorgas de formas diferentes. ¡Eran preciosas!"],["3 · El desfile de luces","Por la noche llevaban las pandorgas por las calles de Santa Cruz de La Palma. Se iluminaban y sus colores brillaban en la oscuridad. Había música, alegría y parrandas. Aunque hacía pelete, nadie quería marcharse."],["4 · La hoguera y los recuerdos","Al terminar, las pandorgas se quemaban en una gran hoguera. Acerina recuerda aquellos días felices y se emociona. Olegario la abraza y le promete llevarla a la próxima Bajada, ¡aunque sea nadando!"]],QUIZ=[["¿Qué miraba Acerina al comenzar el cuento?",["Unas fotografías antiguas","Un mapa","Una pandorga nueva"],0],["¿En qué isla vivía Acerina cuando era pequeña?",["Tenerife","La Palma","El Hierro"],1],["¿Con qué materiales preparaban las pandorgas?",["Con cañas y papeles de colores","Con piedra y barro","Con metal"],0],["¿Qué hacían los niños durante el desfile?",["Dormían","Llevaban las pandorgas, cantaban y bailaban","Iban a pescar"],1],["¿Por qué lloraba Acerina?",["Porque recordaba momentos felices","Porque tenía frío","Porque perdió una pandorga"],0],["¿Qué le prometió Olegario?",["Comprar una casa","Llevarla a la próxima Bajada","Hacer una paella"],1]],VOC=[["pandorga","pan · dor · ga","Figura de cañas y papel de colores que se ilumina en la fiesta.","Acerina llevaba una pandorga de colores."],["parranda","pa · rran · da","Grupo de personas que se reúne para cantar y tocar música.","La parranda llenaba la calle de música."],["pelete","pe · le · te","Palabra canaria para decir que hace frío.","Aquella noche hacía pelete en La Palma."],["pepona","pe · po · na","En el cuento, manera cariñosa de llamar a una niña pequeña.","Acerina era una pepona cuando iba a la fiesta."]];const $=x=>document.getElementById(x);let si=0,qi=0,score=0;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});function scene(){$('sceneTitle').textContent=SCENES[si][0];$('sceneText').textContent=SCENES[si][1];$('counter').textContent='Página '+(si+1)+' de '+SCENES.length;$('prev').disabled=si===0;$('next').disabled=si===SCENES.length-1}$('prev').onclick=()=>{si--;scene()};$('next').onclick=()=>{si++;scene()};scene();function showQ(){if(qi>=QUIZ.length){$('qcount').textContent='Comprensión completada';$('qtext').textContent=score+' / '+QUIZ.length;$('answers').innerHTML='';$('qfeedback').textContent='';$('qnext').textContent='VOLVER A JUGAR';$('qnext').classList.remove('hidden');$('qnext').onclick=()=>{qi=0;score=0;showQ()};return}let q=QUIZ[qi];$('qcount').textContent='Pregunta '+(qi+1)+' de '+QUIZ.length;$('qtext').textContent=q[0];$('answers').innerHTML='';$('qfeedback').textContent='';$('qnext').classList.add('hidden');q[1].forEach((a,j)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>{document.querySelectorAll('.answer').forEach(x=>x.disabled=true);if(j===q[2]){b.style.background='#dff5e6';score++;$('qfeedback').textContent='✓ Correcto'}else{b.style.background='#ffe2df';$('qfeedback').textContent='La respuesta correcta es: '+q[1][q[2]]}$('qnext').classList.remove('hidden');$('qnext').onclick=()=>{qi++;showQ()}};$('answers').appendChild(b)})}showQ();$('voc').innerHTML=VOC.map(v=>'<article class="card"><h2>'+v[0]+'</h2><strong>'+v[1]+'</strong><p>'+v[2]+'</p><p class="sub"><b>En el cuento:</b> '+v[3]+'</p></article>').join('');</script></body></html>
