<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión P</title><style>
:root{--ink:#17324d;--muted:#607486;--paper:#fffdf8;--line:#d9e5ec;--p:#a13f7a;--green:#2f9e5b;--shadow:0 14px 38px rgba(27,65,95,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef6fa}
a{text-decoration:none;color:inherit}button{font:inherit}.hidden{display:none!important}
.shell{min-height:calc(100vh - 18px);margin:9px;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:15px;background:var(--p);color:white;display:grid;place-items:center;font-size:31px;font-weight:950}
.kicker{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--muted)}h1{margin:2px 0 0;font-size:clamp(22px,3vw,36px)}
.back,.btn{border:2px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-weight:900;padding:10px 14px;cursor:pointer}
.btn.primary{background:var(--p);border-color:var(--p);color:white}.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.content{padding:16px}.sub{color:var(--muted);line-height:1.45}.card{background:white;border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 7px 20px rgba(30,70,105,.08)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.level{border:2px solid var(--line);border-radius:16px;background:#fff;padding:14px;font-weight:900;cursor:pointer}.stage{max-width:900px;margin:0 auto;text-align:center}.pic{width:min(360px,80vw);height:260px;border-radius:20px;background:linear-gradient(145deg,#fff4fa,#eef7fb);border:2px solid var(--line);display:grid;place-items:center;font-size:46px;font-weight:950;color:var(--p);margin:0 auto}.word{font-size:clamp(34px,6vw,64px);font-weight:950;margin:12px}.counts,.sylls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.counts button,.syll{min-width:65px;min-height:58px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:24px;font-weight:950}.syll.hit{background:#ffe6f2;border-color:var(--p)}.steps{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}.step{padding:7px 10px;border-radius:999px;background:#edf4f7;font-weight:900}.step.on{background:var(--p);color:white}@media(max-width:800px){.levels{grid-template-columns:1fr}}</style></head><body><main class="shell"><header class="header"><div class="brand"><div class="mark">P</div><div><div class="kicker">EL ZURRÓN · MISIÓN P</div><h1>Jugamos con los sonidos y las palabras</h1></div></div><a class="back" href="../">← LETRA P</a></header><div class="content"><section id="choose"><p class="sub">La selección de palabras procede del material «LETRA p. Jugamos con los sonidos y las palabras».</p><div class="levels"><button class="level" data-l="1">Nivel 1 · P al principio</button><button class="level" data-l="2">Nivel 2 · P al final</button><button class="level" data-l="3">Nivel 3 · P en medio</button><button class="level" data-l="4">Nivel 4 · Detective P</button><button class="level" data-l="5">Nivel 5 · Súper P</button></div></section><section id="game" class="hidden"><div class="steps"><span class="step" data-s="1">1 · Identifica</span><span class="step" data-s="2">2 · Sílabas</span><span class="step" data-s="3">3 · Sonido P</span><span class="step" data-s="4">4 · Oración</span></div><div class="stage card"><div id="stepLabel" class="kicker"></div><h2 id="question"></h2><div id="pic" class="pic">?</div><div id="word" class="word"></div><div id="work"></div><div id="feedback" style="min-height:36px;font-weight:900;font-size:20px;margin:10px"></div><div class="controls"><button id="mainBtn" class="btn primary">VER PALABRA</button><button id="nextBtn" class="btn hidden">CONTINUAR</button><button id="change" class="btn">CAMBIAR NIVEL</button></div></div><p id="score" class="sub" style="text-align:center"></p></section></div></main>
<script>const DATA=[{"word":"paloma","syll":["pa","lo","ma"],"p":[0],"cat":"initial"},{"word":"pala","syll":["pa","la"],"p":[0],"cat":"initial"},{"word":"paella","syll":["pa","e","lla"],"p":[0],"cat":"initial"},{"word":"palillos","syll":["pa","li","llos"],"p":[0],"cat":"initial"},{"word":"pañal","syll":["pa","ñal"],"p":[0],"cat":"initial"},{"word":"paraguas","syll":["pa","ra","guas"],"p":[0],"cat":"initial"},{"word":"patín","syll":["pa","tín"],"p":[0],"cat":"initial"},{"word":"pavo","syll":["pa","vo"],"p":[0],"cat":"initial"},{"word":"pañuelos","syll":["pa","ñue","los"],"p":[0],"cat":"initial"},{"word":"pecera","syll":["pe","ce","ra"],"p":[0],"cat":"initial"},{"word":"pegamento","syll":["pe","ga","men","to"],"p":[0],"cat":"initial"},{"word":"pelícano","syll":["pe","lí","ca","no"],"p":[0],"cat":"initial"},{"word":"pera","syll":["pe","ra"],"p":[0],"cat":"initial"},{"word":"pimiento","syll":["pi","mien","to"],"p":[0],"cat":"initial"},{"word":"pizza","syll":["pi","zza"],"p":[0],"cat":"initial"},{"word":"pollo","syll":["po","llo"],"p":[0],"cat":"initial"},{"word":"poni","syll":["po","ni"],"p":[0],"cat":"initial"},{"word":"pupila","syll":["pu","pi","la"],"p":[0],"cat":"initial"},{"word":"tapa","syll":["ta","pa"],"p":[1],"cat":"final"},{"word":"copa","syll":["co","pa"],"p":[1],"cat":"final"},{"word":"ropa","syll":["ro","pa"],"p":[1],"cat":"final"},{"word":"esparadrapo","syll":["es","pa","ra","dra","po"],"p":[4],"cat":"final"},{"word":"equipo","syll":["e","qui","po"],"p":[2],"cat":"final"},{"word":"lupa","syll":["lu","pa"],"p":[1],"cat":"final"},{"word":"champú","syll":["cham","pú"],"p":[1],"cat":"final"},{"word":"chapa","syll":["cha","pa"],"p":[1],"cat":"final"},{"word":"campana","syll":["cam","pa","na"],"p":[1],"cat":"medial"},{"word":"lámpara","syll":["lám","pa","ra"],"p":[1],"cat":"medial"},{"word":"mapache","syll":["ma","pa","che"],"p":[1],"cat":"medial"},{"word":"relámpago","syll":["re","lám","pa","go"],"p":[2],"cat":"medial"},{"word":"España","syll":["Es","pa","ña"],"p":[1],"cat":"medial"},{"word":"estropajo","syll":["es","tro","pa","jo"],"p":[2],"cat":"medial"},{"word":"espejo","syll":["es","pe","jo"],"p":[1],"cat":"medial"},{"word":"alpinista","syll":["al","pi","nis","ta"],"p":[1],"cat":"medial"}];let level=1,round=[],i=0,points=0;const $=x=>document.getElementById(x);document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{level=+b.dataset.l;start()});$('change').onclick=()=>{$('game').classList.add('hidden');$('choose').classList.remove('hidden')};const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function pool(){if(level===1)return DATA.filter(x=>x.cat==='initial');if(level===2)return DATA.filter(x=>x.cat==='final');if(level===3)return DATA.filter(x=>x.cat==='medial');if(level===4)return DATA;return DATA.filter(x=>x.syll.length>=3)}
function setStep(n){document.querySelectorAll('.step').forEach(x=>x.classList.toggle('on',+x.dataset.s===n));$('feedback').textContent='';$('work').innerHTML='';$('nextBtn').classList.add('hidden')}
function start(){round=shuffle(pool()).slice(0,5);i=0;points=0;$('choose').classList.add('hidden');$('game').classList.remove('hidden');load()}function current(){return round[i]}
function load(){if(i>=round.length){$('question').textContent='¡Misión P completada!';$('pic').textContent='✓';$('word').textContent=points+' puntos';$('work').innerHTML='<button class="btn primary" onclick="start()">OTRAS 5 · MISMO NIVEL</button>';$('mainBtn').classList.add('hidden');return}$('mainBtn').classList.remove('hidden');$('pic').textContent='?';$('word').textContent='';setStep(1);$('stepLabel').textContent='PALABRA '+(i+1)+' DE 5';$('question').textContent='¿Qué palabra será?';$('mainBtn').textContent='VER PALABRA';$('mainBtn').onclick=reveal;$('score').textContent='Puntos: '+points}
function reveal(){$('pic').textContent=current().word[0].toUpperCase();$('word').textContent=current().word;$('mainBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('nextBtn').onclick=countStep}
function countStep(){setStep(2);$('question').textContent='¿Cuántas sílabas tiene?';$('word').textContent=current().word;let box=$('work');box.className='counts';for(let n=1;n<=5;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(n===current().syll.length){$('feedback').textContent='✓ Muy bien';points++;setTimeout(soundStep,450)}else $('feedback').textContent='Prueba otra vez'};box.appendChild(b)}}
function soundStep(){setStep(3);$('question').textContent='¿Dónde suena la P?';$('word').textContent=current().word;let box=$('work');box.className='sylls';current().syll.forEach((s,j)=>{let b=document.createElement('button');b.className='syll';b.textContent=s;b.onclick=()=>{if(current().p.includes(j)){b.classList.add('hit');$('feedback').textContent='✓ Ahí suena /p/';points++;$('nextBtn').classList.remove('hidden');$('nextBtn').textContent='PALMEAR SÍLABAS Y CONTINUAR';$('nextBtn').onclick=sentenceStep}else $('feedback').textContent='Escucha otra vez'};box.appendChild(b)})}
function sentenceStep(){setStep(4);$('question').textContent='Di una oración';$('word').textContent=current().word;$('work').innerHTML='<p class="sub" style="font-size:20px">Inventa una frase que contenga esta palabra.</p>';$('mainBtn').classList.remove('hidden');$('mainBtn').textContent='YA LA HE DICHO';$('mainBtn').onclick=()=>{points++;i++;load()}}</script></body></html>
