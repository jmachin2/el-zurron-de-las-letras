<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referencia P mayúscula</title><style>
:root{--ink:#17324d;--muted:#607486;--paper:#fffdf8;--line:#d9e5ec;--p:#a13f7a;--shadow:0 14px 38px rgba(27,65,95,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#eef6fa}
a{text-decoration:none;color:inherit}.shell{min-height:calc(100vh - 18px);margin:9px;background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:#fff}
.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;border-radius:15px;background:var(--p);color:white;display:grid;place-items:center;font-size:31px;font-weight:950}
.kicker{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--muted)}h1{margin:2px 0 0;font-size:clamp(22px,3vw,36px)}
.back{border:2px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-weight:900;padding:10px 14px}.content{padding:16px}.card{background:white;border:2px solid var(--line);border-radius:20px;padding:16px}
iframe{width:100%;height:72vh;border:2px solid var(--line);border-radius:18px;background:white}.notice{margin-bottom:12px;background:#fff7df;border-color:#ebc967}</style></head><body><main class="shell"><header class="header"><div class="brand"><div class="mark">P</div><div><div class="kicker">LA CONTRASEÑA DEL ZURRÓN</div><h1>Referencia oficial del trazo P</h1></div></div><a class="back" href="/p/trazo/">← TRAZO P</a></header><div class="content"><div class="card notice"><strong>Esta pantalla es de referencia para calibración.</strong> La trayectoria automática se incorporará cuando validemos los puntos de control sobre la grafía oficial.</div><iframe src="https://drive.google.com/file/d/1efyOsEn3RTwE99lgnOmS_6DDa5u49H7n/preview" title="Documento oficial de direccionalidad"></iframe></div></main></body></html>
